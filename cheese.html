<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cheese</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://use.typekit.net/vvc0ewr.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --paper:#f6f0e2;
    --paper-dark:#ecdfbd;
    --ink:#2b2416;
    --rind:#8a5a2b;
    --gold:#c99a3d;
    --sage:#5b6b46;
    --line:#d9c9a0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper-dark);
    color:var(--ink);
    font-family:'Courier New', ui-monospace, monospace;
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px 80px;}

  header{
    text-align:center;
    margin-bottom:28px;
    position:relative;
  }
  header .kicker{
    letter-spacing:.28em;
    font-size:11px;
    color:var(--rind);
    text-transform:uppercase;
  }
  header .kicker a{color:inherit;text-decoration:none;}
  header .kicker a:hover{text-decoration:underline;}
  header h1{
    font-family:'adobe-caslon-pro', Georgia, 'Times New Roman', serif;
    font-weight:400;
    font-style:italic;
    font-size:44px;
    margin:6px 0 4px;
    letter-spacing:.01em;
  }
  header .sub{
    font-size:12px;
    color:var(--sage);
    opacity:.85;
  }
  header .rule{
    margin:18px auto 0;
    width:100%;
    height:1px;
    background:repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 12px);
    opacity:.35;
  }

  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin:22px 0 14px;
    font-size:12px;
  }
  .toolbar .count{color:var(--sage);opacity:.85;}
  .newbtn{
    background:var(--rind);
    color:var(--paper);
    border:none;
    font-family:inherit;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:10px 16px;
    cursor:pointer;
    border-radius:2px;
  }
  .newbtn:hover{background:#6e451f;}

  .auth-control{
    display:flex;align-items:center;gap:8px;
    font-size:11px;color:var(--sage);
  }
  .auth-control form{display:flex;gap:6px;align-items:center;}
  .auth-control input[type=email], .auth-control input[type=password]{
    padding:6px 8px;font-size:13px;border:1px solid var(--line);border-radius:2px;
    background:var(--paper);color:var(--ink);width:120px;font-family:'Courier New', monospace;
  }
  .auth-control button{
    font-family:inherit;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    padding:6px 10px;cursor:pointer;border-radius:2px;
    border:1px solid var(--ink);background:transparent;color:var(--ink);
  }
  .auth-error{color:var(--rind);font-size:10px;}

  /* form ticket */
  .ticket{
    background:var(--paper);
    border:1px solid var(--line);
    padding:22px;
    margin-bottom:22px;
    position:relative;
    box-shadow:0 1px 2px rgba(0,0,0,.06);
    display:none;
  }
  .ticket.open{display:block;}
  .ticket::before, .ticket::after{
    content:"";
    position:absolute;
    left:0;right:0;
    height:10px;
    background:
      radial-gradient(circle 5px at 0 0, transparent 5px, var(--paper-dark) 5.5px) 0 0/16px 100% repeat-x;
  }
  .ticket::before{top:-6px;transform:rotate(180deg);}
  .ticket::after{bottom:-6px;}

  .field{margin-bottom:14px;position:relative;}
  .field label{
    display:block;
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--rind);
    margin-bottom:5px;
  }
  .field input, .field textarea, .field select{
    width:100%;
    font-family:inherit;
    font-size:14px;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    padding:6px 2px;
    color:var(--ink);
  }
  .field input:focus, .field textarea:focus, .field select:focus{
    outline:none;
    border-bottom:1px solid var(--rind);
  }
  .field textarea{resize:vertical;min-height:54px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .field-hint{font-size:10px;color:var(--sage);opacity:.8;margin-top:4px;}

  .cheese-row{
    display:grid;
    grid-template-columns:1fr 1fr auto;
    gap:8px;
    align-items:center;
    margin-bottom:8px;
  }
  .cheese-row select, .cheese-row input{
    font-family:inherit;font-size:13px;
    background:transparent;border:none;border-bottom:1px solid var(--line);
    padding:5px 2px;color:var(--ink);
    width:100%;
  }
  .cheese-row select:focus, .cheese-row input:focus{outline:none;border-bottom:1px solid var(--rind);}

  .dish-select-wrap{display:flex;align-items:center;gap:4px;min-width:0;}
  .dish-select-wrap select{flex:1;min-width:0;}
  .dish-open-link{
    flex:none;font-size:13px;text-decoration:none;color:var(--sage);
    padding:2px 4px;line-height:1;
  }
  .dish-open-link:hover{color:var(--rind);}
  .row-rm{
    background:none;border:none;color:var(--sage);
    font-size:15px;cursor:pointer;padding:0 4px;line-height:1;
  }
  .row-rm:hover{color:var(--rind);}
  .ghost-inline{
    font-family:inherit;font-size:11px;letter-spacing:.04em;
    color:var(--sage);background:none;border:none;cursor:pointer;
    text-decoration:underline;padding:2px 0;
  }
  .ghost-inline:hover{color:var(--rind);}

  .autocomplete-list{
    position:absolute;top:100%;left:0;right:0;z-index:20;
    background:var(--paper);border:1px solid var(--ink);border-top:none;
    max-height:160px;overflow-y:auto;display:none;
  }
  .autocomplete-list.open{display:block;}
  .autocomplete-list div{
    padding:7px 10px;font-size:13px;cursor:pointer;font-family:inherit;
  }
  .autocomplete-list div:hover, .autocomplete-list div.active{
    background:var(--paper-dark);
  }

  .autofill-field{
    background:var(--paper-dark);
    border:1px dashed var(--line);
    padding:14px 16px;
    border-radius:3px;
    margin-bottom:20px;
  }
  .autofill-row{display:flex;gap:8px;}
  .autofill-row input{flex:1;}
  .autofill-row button{
    font-family:inherit;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    padding:8px 14px;cursor:pointer;border-radius:2px;white-space:nowrap;
    border:1px solid var(--rind);background:var(--rind);color:var(--paper);
  }
  .autofill-row button:hover{background:#6e451f;}
  .autofill-row button:disabled{opacity:.5;cursor:default;}
  #autofillStatus.err{color:var(--rind);}
  #autofillStatus.ok{color:var(--sage);}

  .refresh-link{
    font-family:inherit;font-size:10px;color:var(--sage);
    background:none;border:none;cursor:pointer;text-decoration:underline;
    padding:0;margin-top:4px;
  }
  .refresh-link:hover{color:var(--rind);}
  .refresh-link:disabled{opacity:.5;cursor:default;text-decoration:none;}

  /* photo gallery picker */
  .gallery{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;align-items:flex-start;}
  .gallery .thumb{
    position:relative;width:76px;
    border-radius:2px;overflow:hidden;
    border:1px solid var(--line);
    background:var(--paper);
  }
  .gallery .thumb.cover{border-color:var(--rind);}
  .gallery .thumb img{width:100%;height:72px;object-fit:cover;display:block;}
  .gallery .thumb .rm{
    position:absolute;top:2px;right:2px;
    width:18px;height:18px;border-radius:50%;
    background:rgba(43,36,22,0.75);color:var(--paper);
    border:none;font-size:11px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;padding:0;
  }
  .gallery .thumb .cover-badge, .gallery .thumb .make-cover{
    display:block;width:100%;
    font-family:inherit;font-size:9px;
    text-align:center;padding:3px 0;
    border:none;border-top:1px solid var(--line);
  }
  .gallery .thumb .cover-badge{
    color:var(--rind);background:var(--paper);cursor:default;
  }
  .gallery .thumb .make-cover{
    color:var(--sage);background:var(--paper-dark);cursor:pointer;
  }
  .gallery .thumb .make-cover:hover{color:var(--rind);background:var(--paper);}
  .gallery .addtile{
    width:76px;height:72px;
    border:1px dashed var(--line);
    border-radius:2px;
    display:flex;align-items:center;justify-content:center;
    color:var(--sage);
    font-size:1.4rem;
    cursor:pointer;
    background:var(--paper-dark);
  }
  #f-photos{display:none;}

  .form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;}
  .form-actions button{
    font-family:inherit;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:9px 14px;
    cursor:pointer;
    border-radius:2px;
    border:1px solid var(--ink);
    background:transparent;
    color:var(--ink);
  }
  .form-actions button.save{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  /* entries */
  .entry{
    background:var(--paper);
    border:1px solid var(--line);
    padding:18px 20px;
    margin-bottom:14px;
    position:relative;
    cursor:pointer;
    display:flex;
    gap:16px;
  }
  .entry-thumb{
    width:64px;height:64px;object-fit:cover;flex:none;
    border:1px solid var(--line);border-radius:2px;
    background:var(--paper-dark);
  }
  .entry-thumb.empty{
    display:flex;align-items:center;justify-content:center;
    font-family:'adobe-caslon-pro', Georgia, serif;font-style:italic;
    color:var(--sage);opacity:.5;font-size:22px;
  }
  .entry-body{flex:1;min-width:0;text-align:left;}
  .entry-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
  }
  .entry-name{
    font-family:'adobe-caslon-pro', Georgia, 'Times New Roman', serif;
    font-style:italic;
    font-size:22px;
    text-align:left;
  }
  .entry-meta{
    font-size:11px;
    color:var(--sage);
    opacity:.9;
    margin-top:4px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .entry-meta a{color:var(--rind);text-decoration:none;border-bottom:1px solid var(--line);}
  .entry-meta a:hover{border-color:var(--rind);}
  .entry-comment{
    margin-top:8px;
    font-size:13px;
    line-height:1.55;
    color:var(--ink);
    white-space:pre-wrap;
  }
  .entry-actions{
    position:absolute;
    top:14px;right:16px;
    display:flex;gap:8px;
  }
  .entry-actions button{
    background:none;border:none;
    font-family:inherit;
    font-size:11px;
    color:var(--sage);
    opacity:.6;
    cursor:pointer;
  }
  .entry-actions button:hover{opacity:1;color:var(--rind);}

  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--sage);
    opacity:.8;
    font-size:13px;
    line-height:1.7;
  }
  .empty .big{font-family:'adobe-caslon-pro', Georgia, 'Times New Roman', serif;font-style:italic;font-size:20px;display:block;margin-bottom:8px;opacity:1;color:var(--ink);}

  .loading{text-align:center;padding:40px;font-size:12px;color:var(--sage);}

  .load-error{
    background:#f6e6d9;border:1px solid var(--rind);color:var(--ink);
    padding:14px 16px;border-radius:3px;font-size:12px;margin-bottom:16px;
    display:none;
  }
  .load-error button{
    font-family:inherit;font-size:11px;margin-left:8px;cursor:pointer;
    border:1px solid var(--ink);background:transparent;padding:4px 8px;border-radius:2px;
  }

  ::placeholder{color:var(--sage);opacity:.4;}

  .lightbox{
    display:none;
    position:fixed;inset:0;
    background:rgba(20,16,8,.88);
    z-index:100;
    align-items:flex-start;justify-content:center;
    overflow-y:auto;
    padding:40px 16px;
  }
  .lightbox.open{display:flex;}
  .lightbox-card{
    background:var(--paper);
    max-width:640px;width:100%;
    padding:24px;
    position:relative;
    border:1px solid var(--line);
  }
  .lightbox-close{
    position:absolute;top:12px;right:14px;
    background:none;border:none;
    font-family:inherit;font-size:13px;
    color:var(--sage);cursor:pointer;
  }
  .lightbox-close:hover{color:var(--rind);}
  .lightbox-copy-link{
    position:absolute;top:12px;left:14px;
    background:none;border:none;
    font-family:inherit;font-size:11px;
    color:var(--sage);cursor:pointer;
    letter-spacing:.04em;
  }
  .lightbox-copy-link:hover{color:var(--rind);}
  .lightbox-photos{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:8px;margin-bottom:18px;
  }
  .lightbox-photos img{
    width:100%;height:140px;object-fit:cover;
    border:1px solid var(--line);border-radius:2px;
    cursor:zoom-in;
  }
  .lightbox-name{
    font-family:'adobe-caslon-pro', Georgia, 'Times New Roman', serif;
    font-style:italic;font-size:26px;margin-bottom:2px;
  }
  .lightbox-name a{color:inherit;}
  .lightbox-meta{
    font-size:11px;color:var(--sage);opacity:.9;
    display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;
  }
  .lightbox-meta a{color:var(--rind);text-decoration:none;border-bottom:1px solid var(--line);}
  .lightbox-fields{margin-bottom:14px;}
  .lightbox-fields .row{
    display:flex;gap:8px;font-size:12px;padding:5px 0;
    border-bottom:1px solid var(--line);
  }
  .lightbox-fields .lbl{
    color:var(--rind);letter-spacing:.08em;text-transform:uppercase;
    font-size:10px;flex:none;width:110px;padding-top:2px;
  }
  .lightbox-comment .lbl{
    color:var(--rind);font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;display:block;margin-bottom:4px;
  }
  .lightbox-comment{font-size:13px;line-height:1.55;white-space:pre-wrap;}

  .photo-zoom{
    display:none;
    position:fixed;inset:0;
    background:rgba(0,0,0,.92);
    z-index:200;
    align-items:center;justify-content:center;
    padding:20px;
    cursor:zoom-out;
  }
  .photo-zoom.open{display:flex;}
  .photo-zoom img{max-width:100%;max-height:100%;object-fit:contain;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker"><a href="index.html">&larr; Warehouse</a> &middot; Est. In Practice</div>
    <h1>Cheese</h1>
    <div class="sub">a running record of wheels, wedges, and rinds</div>
    <div id="authControl" class="auth-control" style="justify-content:center;margin-top:10px;"></div>
    <div class="rule"></div>
  </header>

  <div class="toolbar">
    <span class="count" id="count">loading&hellip;</span>
    <button class="newbtn" id="toggleForm">+ New Cheese</button>
  </div>

  <div class="load-error" id="loadErrorState">
    <span class="msg"></span>
    <button id="retryLoadBtn">Retry</button>
  </div>

  <div class="ticket" id="ticket">
    <div class="field autofill-field">
      <label>Autofill from URL</label>
      <div class="autofill-row">
        <input id="f-autofillUrl" type="text" placeholder="producer-or-shop.com/this-cheese">
        <button type="button" id="autofillBtn">Fetch</button>
      </div>
      <div class="field-hint" id="autofillStatus">Pulls whatever it can find from the page — review everything before saving.</div>
    </div>

    <div class="field">
      <label>Name</label>
      <input id="f-name" type="text" placeholder="Époisses de Bourgogne">
    </div>

    <div class="field">
      <label>Pictures</label>
      <div class="gallery" id="galleryWrap">
        <div class="addtile" id="addPhotoTile">+</div>
      </div>
      <input type="file" id="f-photos" accept="image/*" multiple>
      <div class="field-hint" id="photoHint">Add one or more photos of the wheel, wedge, or label.</div>
    </div>

    <div class="row2">
      <div class="field">
        <label>Producer</label>
        <input id="f-producer" type="text" placeholder="Fromagerie Berthaut" autocomplete="off">
        <div class="autocomplete-list" id="f-producer-options"></div>
      </div>
      <div class="field">
        <label>Producer link (optional)</label>
        <input id="f-producerUrl" type="url" placeholder="https://&hellip;">
      </div>
    </div>

    <div class="field">
      <label>Cheesemaker</label>
      <input id="f-cheesemaker" type="text" placeholder="Veronica Pedraza">
    </div>

    <div class="row2">
      <div class="field">
        <label>Cheesemonger</label>
        <input id="f-cheesemonger" type="text" placeholder="Bedford Cheese Shop" autocomplete="off">
        <div class="autocomplete-list" id="f-cheesemonger-options"></div>
      </div>
      <div class="field">
        <label>Cheesemonger link (optional)</label>
        <input id="f-cheesemongerUrl" type="url" placeholder="https://&hellip;">
        <button type="button" id="cheesemongerRefreshBtn" class="refresh-link">&#8635; Pull comments from this link</button>
        <div class="field-hint" id="cheesemongerRefreshStatus"></div>
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label>Milk Type</label>
        <select id="f-milk">
          <option value="">&mdash;</option>
          <option>Cow</option>
          <option>Goat</option>
          <option>Sheep</option>
          <option>Buffalo</option>
          <option>Mixed</option>
          <option>Other</option>
        </select>
      </div>
      <div class="field">
        <label>Age</label>
        <input id="f-age" type="text" placeholder="6 weeks / 18 months">
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label>Rennet</label>
        <select id="f-rennet">
          <option value="">&mdash;</option>
          <option>Animal</option>
          <option>Vegetable</option>
          <option>Microbial</option>
          <option>Unknown</option>
        </select>
      </div>
      <div class="field">
        <label>Milk Treatment</label>
        <select id="f-pasteurization">
          <option value="">&mdash;</option>
          <option>Raw</option>
          <option>Pasteurized</option>
          <option>Unknown</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label>Wrapped</label>
      <select id="f-wrapped">
        <option value="">&mdash;</option>
        <option>Wax</option>
        <option>Cloth-bound</option>
        <option>Leaf-wrapped</option>
        <option>Vacuum-sealed</option>
        <option>Paper</option>
        <option>Foil</option>
        <option>Natural Rind</option>
        <option>Other</option>
      </select>
    </div>

    <div class="field" id="wrappedDescField" style="display:none;">
      <label>Wrapped detail (optional)</label>
      <input id="f-wrappedDesc" type="text" placeholder="Hand-dipped in black wax, cave-aged 3 months&hellip;">
    </div>

    <div class="row2">
      <div class="field">
        <label>State / Region</label>
        <input id="f-region" type="text" placeholder="Burgundy">
      </div>
      <div class="field">
        <label>Country</label>
        <input id="f-country" type="text" placeholder="France">
      </div>
    </div>

    <div class="field">
      <label>Paired Wine</label>
      <div class="dish-select-wrap">
        <select id="f-wine">
          <option value="">&mdash;</option>
        </select>
        <a id="f-wine-open" class="dish-open-link" target="_blank" rel="noopener" title="Open this wine's page" style="display:none;">&#8599;</a>
      </div>
    </div>

    <div class="field">
      <label>Paired Spirit</label>
      <div class="dish-select-wrap">
        <select id="f-spirit">
          <option value="">&mdash;</option>
        </select>
        <a id="f-spirit-open" class="dish-open-link" target="_blank" rel="noopener" title="Open this spirit's page" style="display:none;">&#8599;</a>
      </div>
    </div>

    <div class="field">
      <label>Restaurant visit(s)</label>
      <div id="restaurantsList"></div>
      <button type="button" id="addRestaurantBtn" class="ghost-inline">+ Add restaurant</button>
    </div>

    <div class="field">
      <label>Date</label>
      <input id="f-date" type="date">
    </div>

    <div class="field">
      <label>Comment</label>
      <textarea id="f-comment" placeholder="Tasting notes, pairing, where it was had&hellip;"></textarea>
    </div>

    <div class="form-actions">
      <button id="cancelBtn">Cancel</button>
      <button class="save" id="saveBtn">Save Cheese</button>
    </div>
  </div>

  <div id="entries" class="loading">loading&hellip;</div>
</div>

<div class="lightbox" id="lightbox">
  <div class="lightbox-card">
    <button class="lightbox-close" id="lightboxClose">close &#10005;</button>
    <button class="lightbox-copy-link" id="lightboxCopyLink">&#128279; copy link</button>
    <div class="lightbox-photos" id="lb-photos"></div>
    <div class="lightbox-name" id="lb-name"></div>
    <div class="lightbox-fields" id="lb-fields"></div>
    <div class="lightbox-comment" id="lb-comment-wrap" style="display:none;">
      <span class="lbl">Comment</span><span id="lb-comment"></span>
    </div>
  </div>
</div>

<div class="photo-zoom" id="photoZoom">
  <img id="photoZoomImg" src="" alt="">
</div>

<script>
let entries = [];
let editingId = null;
let currentPhotos = []; // data URLs of the photos attached to the entry currently being edited
let currentLightboxId = null; // entry currently shown in the lightbox, for the copy-link button

const $ = (id) => document.getElementById(id);

// Reads an entry's photos array, falling back to the old singular `photo`
// field so entries saved before multi-photo support still display fine.
function entryPhotos(e){
  if(e.photos && e.photos.length) return e.photos;
  if(e.photo) return [e.photo];
  return [];
}

// Supabase-backed storage, shared with the rest of Warehouse, so entries
// sync across devices instead of being trapped in one browser. Falls back
// to localStorage if Supabase can't be reached, and to Claude's
// window.storage when running inside a Claude artifact.
const SUPABASE_URL = 'https://psbdjeyianlhfkgwwsvt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_fmEJD4dXEZF0elMTqgfhIg_nH-dCQn_';

const localStorageAdapter = {
  async get(key){
    const v = localStorage.getItem(key);
    if(v === null) throw new Error('not found');
    return {key, value: v};
  },
  async set(key, value){
    localStorage.setItem(key, value);
    return {key, value};
  },
  async delete(key){
    localStorage.removeItem(key);
    return {key, deleted: true};
  },
  async list(prefix){
    const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
    return {keys};
  }
};

let supabaseClient = null;
let supabaseInitError = null;

function makeSupabaseAdapter(){
  if(typeof window === 'undefined' || !window.supabase || !window.supabase.createClient){
    supabaseInitError = 'Supabase library did not load — running on this browser only until the page is refreshed with a connection.';
    return null;
  }
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const client = supabaseClient;
  return {
    async get(key){
      const { data, error } = await client.from('kv_store').select('value').eq('key', key).maybeSingle();
      if(error) throw error;
      if(!data) throw new Error('not found');
      try{ localStorage.setItem(key, data.value); }catch(e){}
      return {key, value: data.value};
    },
    async set(key, value){
      const { error } = await client.from('kv_store').upsert({ key, value, updated_at: new Date().toISOString() });
      if(error) throw error;
      try{ localStorage.setItem(key, value); }catch(e){}
      return {key, value};
    },
    async delete(key){
      const { error } = await client.from('kv_store').delete().eq('key', key);
      if(error) throw error;
      try{ localStorage.removeItem(key); }catch(e){}
      return {key, deleted: true};
    },
    async list(prefix){
      let query = client.from('kv_store').select('key');
      if(prefix) query = query.like('key', prefix + '%');
      const { data, error } = await query;
      if(error) throw error;
      return { keys: (data||[]).map(r => r.key) };
    },
    // Fetches every key+value under a prefix in ONE request, instead of
    // list() + a get() per key. With hundreds of entries, one-request-per-
    // entry means hundreds of sequential round trips before the page can
    // render anything.
    async listWithValues(prefix){
      let query = client.from('kv_store').select('key,value');
      if(prefix) query = query.like('key', prefix + '%');
      const { data, error } = await query;
      if(error) throw error;
      const items = data || [];
      try{
        for(const row of items) localStorage.setItem(row.key, row.value);
      }catch(e){ /* localStorage full/unavailable — safe to skip */ }
      return { items: items.map(r => ({ key: r.key, value: r.value })) };
    }
  };
}

// Priority: Claude artifact storage > Supabase > localStorage
const storage = (typeof window !== 'undefined' && window.storage)
  ? window.storage
  : (makeSupabaseAdapter() || localStorageAdapter);

// --- Auth: read is public, only a signed-in session can add/edit/delete ---
let currentUser = null;

function renderAuthControl(){
  const el = document.getElementById('authControl');
  if(!supabaseClient){
    el.innerHTML = '';
    return;
  }
  if(currentUser){
    el.innerHTML = `
      <span>${currentUser.email}</span>
      <button id="signOutBtn">Sign out</button>`;
    document.getElementById('signOutBtn').addEventListener('click', async ()=>{
      await supabaseClient.auth.signOut();
    });
  } else {
    el.innerHTML = `
      <form id="signInForm">
        <input type="email" id="authEmail" placeholder="Email" required>
        <input type="password" id="authPassword" placeholder="Password" required>
        <button type="submit">Sign in</button>
      </form>
      <span class="auth-error" id="authError"></span>`;
    document.getElementById('signInForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      document.getElementById('authError').textContent = error ? 'Sign in failed' : '';
    });
  }
}

function applyAuthGating(){
  const loggedIn = !supabaseClient || !!currentUser; // if no Supabase, don't block (local/artifact mode)
  const newBtn = document.getElementById('toggleForm');
  if(newBtn) newBtn.style.display = loggedIn ? '' : 'none';
  document.querySelectorAll('.entry-actions').forEach(el=>{
    el.style.display = loggedIn ? '' : 'none';
  });
}

if(supabaseClient){
  supabaseClient.auth.getSession().then(({data})=>{
    currentUser = data.session ? data.session.user : null;
    renderAuthControl();
    applyAuthGating();
  });
  supabaseClient.auth.onAuthStateChange((_event, session)=>{
    currentUser = session ? session.user : null;
    renderAuthControl();
    applyAuthGating();
  });
} else {
  renderAuthControl();
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : str;
  return div.innerHTML;
}

// Only allow http(s) URLs through as href values — guards against
// javascript: or other schemes sneaking into a link field.
function safeUrl(u){
  if(!u) return null;
  const s = u.trim();
  if(/^https?:\/\//i.test(s)) return s;
  return null;
}

function linkOrText(text, url){
  const t = escapeHtml(text || '');
  if(!t) return '';
  const href = safeUrl(url);
  return href
    ? `<a href="${escapeHtml(href)}" target="_blank" rel="noopener">${t}</a>`
    : t;
}

function setLoadError(message){
  const el = document.getElementById('loadErrorState');
  if(!el) return;
  if(message){
    el.style.display = 'block';
    el.querySelector('.msg').textContent = message;
  }else{
    el.style.display = 'none';
  }
}

function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

function render(){
  const wrap = $('entries');
  $('count').textContent = entries.length === 0 ? 'no cheeses yet' :
    entries.length + (entries.length === 1 ? ' cheese logged' : ' cheeses logged');

  if(entries.length === 0){
    wrap.innerHTML = `<div class="empty"><span class="big">The board is empty.</span>Log the first cheese.</div>`;
    applyAuthGating();
    return;
  }

  const sorted = [...entries].sort((a,b) => (a.name||'').localeCompare(b.name||''));

  wrap.innerHTML = sorted.map(e => {
    const metaBits = [];
    if(e.producer) metaBits.push(linkOrText(e.producer, e.producerUrl));
    if(e.cheesemaker) metaBits.push(escapeHtml(e.cheesemaker));
    if(e.cheesemonger) metaBits.push(linkOrText(e.cheesemonger, e.cheesemongerUrl));
    if(e.milkType) metaBits.push(escapeHtml(e.milkType));
    if(e.age) metaBits.push(escapeHtml(e.age));
    if(e.wrapped) metaBits.push(escapeHtml(e.wrapped));
    const place = [e.region, e.country].filter(Boolean).join(', ');
    if(place) metaBits.push(escapeHtml(place));
    restaurantVisitsOf(e).forEach(r => metaBits.push(linkOrText(r.name, r.restaurantUrl)));
    if(e.pairedWine) metaBits.push(linkOrText('\ud83c\udf77 ' + e.pairedWine, e.pairedWineUrl));
    if(e.pairedSpirit) metaBits.push(linkOrText('\ud83c\udf78 ' + e.pairedSpirit, e.pairedSpiritUrl));
    if(e.date) metaBits.push(fmtDate(e.date));

    return `
    <div class="entry" data-id="${e.id}">
      <div class="entry-actions">
        <button class="editBtn">edit</button>
        <button class="delBtn">delete</button>
      </div>
      ${entryPhotos(e).length
        ? `<img class="entry-thumb" src="${entryPhotos(e)[0]}" alt="">`
        : `<div class="entry-thumb empty">c</div>`}
      <div class="entry-body">
        <div class="entry-top">
          <div>
            <div class="entry-name">${escapeHtml(e.name || 'Untitled')}</div>
            ${metaBits.length ? `<div class="entry-meta">${metaBits.map(m=>`<span>${m}</span>`).join('')}</div>` : ''}
          </div>
        </div>
        ${e.comment ? `<div class="entry-comment">${escapeHtml(e.comment)}</div>` : ''}
      </div>
    </div>
  `;}).join('');

  wrap.querySelectorAll('.editBtn').forEach(btn=>{
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = e.target.closest('.entry').dataset.id;
      openForEdit(id);
    });
  });
  wrap.querySelectorAll('.delBtn').forEach(btn=>{
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const id = e.target.closest('.entry').dataset.id;
      if(confirm('Remove this cheese?')){
        await deleteEntry(id);
      }
    });
  });
  wrap.querySelectorAll('.entry').forEach(card=>{
    card.addEventListener('click', e => {
      openLightbox(card.dataset.id);
    });
  });
  wrap.querySelectorAll('.entry-meta a').forEach(a=>{
    // Let a Producer/Cheesemonger/Restaurant link just navigate on its own,
    // instead of also popping the detail lightbox open behind it.
    a.addEventListener('click', e => e.stopPropagation());
  });
  refreshCheesemongerOptions();
  refreshProducerOptions();
  applyAuthGating();
}

function openLightbox(id){
  const e = entries.find(x => x.id === id);
  if(!e) return;
  currentLightboxId = id;

  const photos = entryPhotos(e);
  const photosEl = $('lb-photos');
  photosEl.innerHTML = photos.map(src => `<img src="${src}" alt="">`).join('');
  photosEl.querySelectorAll('img').forEach(img=>{
    img.addEventListener('click', ev => {
      ev.stopPropagation();
      openPhotoZoom(img.src);
    });
  });

  $('lb-name').textContent = e.name || 'Untitled';

  const rows = [];
  if(e.producer) rows.push(['Producer', linkOrText(e.producer, e.producerUrl)]);
  if(e.cheesemaker) rows.push(['Cheesemaker', escapeHtml(e.cheesemaker)]);
  if(e.cheesemonger) rows.push(['Cheesemonger', linkOrText(e.cheesemonger, e.cheesemongerUrl)]);
  if(e.milkType) rows.push(['Milk Type', escapeHtml(e.milkType)]);
  if(e.age) rows.push(['Age', escapeHtml(e.age)]);
  if(e.rennet) rows.push(['Rennet', escapeHtml(e.rennet)]);
  if(e.pasteurization) rows.push(['Milk Treatment', escapeHtml(e.pasteurization)]);
  if(e.wrapped) rows.push(['Wrapped', escapeHtml(e.wrapped) + (e.wrappedDesc ? ' — ' + escapeHtml(e.wrappedDesc) : '')]);
  const place = [e.region, e.country].filter(Boolean).join(', ');
  if(place) rows.push(['Region', escapeHtml(place)]);
  const visits = restaurantVisitsOf(e);
  if(visits.length){
    const visitVal = visits.map(r => linkOrText(r.name, r.restaurantUrl) + (r.note ? ` <span style="color:var(--sage);">— ${escapeHtml(r.note)}</span>` : '')).join('<br>');
    rows.push(['Restaurant', visitVal]);
  }
  if(e.pairedWine) rows.push(['Paired Wine', linkOrText(e.pairedWine, e.pairedWineUrl)]);
  if(e.pairedSpirit) rows.push(['Paired Spirit', linkOrText(e.pairedSpirit, e.pairedSpiritUrl)]);
  if(e.date) rows.push(['Date', escapeHtml(fmtDate(e.date))]);

  $('lb-fields').innerHTML = rows.map(([label, val]) =>
    `<div class="row"><span class="lbl">${label}</span><span>${val}</span></div>`
  ).join('');

  if(e.comment){
    $('lb-comment-wrap').style.display = 'block';
    $('lb-comment').textContent = e.comment;
  } else {
    $('lb-comment-wrap').style.display = 'none';
  }

  $('lightbox').classList.add('open');
}

function closeLightbox(){
  $('lightbox').classList.remove('open');
  currentLightboxId = null;
}

// --- Autofill: asks the cheese-autofill Edge Function to fetch a producer
// or shop page server-side (browsers can't fetch arbitrary cross-origin
// pages directly) and pull out best-guess fields. Only ever fills in
// fields that are currently empty, so it never clobbers what's already
// been typed — review everything it fills before saving. ---
const AUTOFILL_URL = SUPABASE_URL + '/functions/v1/cheese-autofill';

function setAutofillStatus(msg, cls){
  const el = $('autofillStatus');
  el.textContent = msg;
  el.className = 'field-hint' + (cls ? ' ' + cls : '');
}

// Resizes a data: URL image the same way resizeImage() handles a File —
// used to compress the photo an autofill fetch hands back, so it goes
// through the same size/quality pipeline as a manually uploaded photo
// instead of storing the producer site's raw (often much larger) image.
function resizeDataUrl(dataUrl, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h * maxDim/w); w = maxDim; }
      else if(h >= w && h > maxDim){ w = Math.round(w * maxDim/h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

// Accepts a bare domain ("bluehillfarm.com") as well as a full URL —
// prepends https:// if no scheme was typed, so the field doesn't demand
// people paste the "https://" prefix by hand.
function normalizeAutofillUrl(u){
  u = (u || '').trim();
  if(!u) return u;
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
  return u;
}

async function runAutofill(){
  const url = normalizeAutofillUrl($('f-autofillUrl').value);
  if(!url){
    setAutofillStatus('Paste a URL first.', 'err');
    return;
  }
  const btn = $('autofillBtn');
  btn.disabled = true;
  setAutofillStatus('Fetching…');

  // Fetch + parse are their own try/catch: a failure here really is a
  // network/URL problem. Applying the result to the form is separate, so a
  // bug in that step reports honestly instead of being mislabeled as
  // "check the URL" — which was masking a real problem with large photos.
  let data;
  try{
    const res = await fetch(AUTOFILL_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'apikey': SUPABASE_KEY
      },
      body: JSON.stringify({ url })
    });
    data = await res.json();
    if(!res.ok || !data.ok){
      setAutofillStatus(data.error || `Could not fetch that page (HTTP ${res.status}).`, 'err');
      btn.disabled = false;
      return;
    }
  }catch(err){
    console.error('Autofill fetch failed', err);
    setAutofillStatus('Autofill request failed — check the URL and try again.', 'err');
    btn.disabled = false;
    return;
  }

  try{
    const filled = [];
    const fillIfEmpty = (id, value) => {
      if(value && !$(id).value.trim()){
        $(id).value = value;
        filled.push(id);
      }
    };
    fillIfEmpty('f-name', data.name);
    fillIfEmpty('f-producer', data.producer);
    fillIfEmpty('f-producerUrl', data.producerUrl);
    fillIfEmpty('f-cheesemaker', data.cheesemaker);
    fillIfEmpty('f-cheesemonger', data.cheesemonger);
    fillIfEmpty('f-cheesemongerUrl', data.cheesemongerUrl);
    fillIfEmpty('f-age', data.age);
    fillIfEmpty('f-region', data.region);
    if(data.country && !$('f-country').value.trim()){
      $('f-country').value = data.country;
      filled.push('f-country');
    }
    if(data.milkType && !$('f-milk').value){
      $('f-milk').value = data.milkType;
      filled.push('f-milk');
    }
    if(data.wrapped && !$('f-wrapped').value){
      $('f-wrapped').value = data.wrapped;
      filled.push('f-wrapped');
      toggleWrappedDescField();
    }
    fillIfEmpty('f-comment', data.comment);
    if(data.photo && currentPhotos.length === 0){
      try{
        currentPhotos.push(await resizeDataUrl(data.photo, 1000, 0.72));
      }catch(err){
        console.error('Could not compress autofilled photo, using it as-is', err);
        currentPhotos.push(data.photo);
      }
      renderGallery();
      filled.push('picture');
    }

    if(filled.length){
      setAutofillStatus(`Filled ${filled.length} field${filled.length>1?'s':''} — double-check them, especially milk type, age, and region/country.`, 'ok');
    } else {
      setAutofillStatus('Fetched the page but found nothing new to fill in — the rest is already set or wasn\'t on the page.', 'ok');
    }
  }catch(err){
    console.error('Autofill fetched OK but applying it to the form failed', err);
    setAutofillStatus('Fetched the page, but hit a problem filling in the form — check the browser console for details.', 'err');
  }finally{
    btn.disabled = false;
  }
}

$('autofillBtn').addEventListener('click', runAutofill);
$('f-autofillUrl').addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    e.preventDefault();
    runAutofill();
  }
});

// --- Refresh from Cheesemonger link: for when the Cheesemonger link is
// entered or corrected AFTER the initial autofill (or entered by hand with
// no autofill at all). Unlike the main autofill, this doesn't skip fields
// that already have a value — the whole point is to pull whatever's new
// from that specific page, especially a pull-quote, and APPEND it to
// Comment rather than silently drop it because Comment isn't empty. ---
async function refreshFromCheesemonger(){
  const url = $('f-cheesemongerUrl').value.trim();
  const statusEl = $('cheesemongerRefreshStatus');
  if(!url){
    statusEl.textContent = 'Add a Cheesemonger link first.';
    statusEl.className = 'field-hint err';
    return;
  }
  const btn = $('cheesemongerRefreshBtn');
  btn.disabled = true;
  statusEl.textContent = 'Fetching…';
  statusEl.className = 'field-hint';

  let data;
  try{
    const res = await fetch(AUTOFILL_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'apikey': SUPABASE_KEY
      },
      body: JSON.stringify({ url })
    });
    data = await res.json();
    if(!res.ok || !data.ok){
      statusEl.textContent = data.error || `Could not fetch that page (HTTP ${res.status}).`;
      statusEl.className = 'field-hint err';
      btn.disabled = false;
      return;
    }
  }catch(err){
    console.error('Cheesemonger refresh fetch failed', err);
    statusEl.textContent = 'Request failed — check the link and try again.';
    statusEl.className = 'field-hint err';
    btn.disabled = false;
    return;
  }

  try{
    const added = [];
    let quoteFound = !!data.quote;
    let quoteAdded = false;

    if(data.quote){
      const quoteLine = `\u201C${data.quote}\u201D \u2014 ${data.quoteAttribution || $('f-cheesemonger').value.trim() || 'source site'}`;
      const existing = $('f-comment').value;
      if(!existing.includes(data.quote)){
        $('f-comment').value = existing ? `${existing}\n\n${quoteLine}` : quoteLine;
        quoteAdded = true;
      }
    }

    // Anything else this page reveals that's still blank is fair game too,
    // same fill-blanks-only behavior as the main autofill.
    const fillIfEmpty = (id, value) => {
      if(value && !$(id).value.trim()){
        $(id).value = value;
        added.push(id);
      }
    };
    fillIfEmpty('f-cheesemaker', data.cheesemaker);
    fillIfEmpty('f-age', data.age);
    fillIfEmpty('f-region', data.region);
    if(data.country && !$('f-country').value.trim()){
      $('f-country').value = data.country;
      added.push('f-country');
    }
    if(data.milkType && !$('f-milk').value){
      $('f-milk').value = data.milkType;
      added.push('f-milk');
    }
    if(data.wrapped && !$('f-wrapped').value){
      $('f-wrapped').value = data.wrapped;
      added.push('f-wrapped');
      toggleWrappedDescField();
    }

    // Quote status is reported separately from "other fields filled" so a
    // vague "it worked" can't paper over "but no quote was actually found"
    // — that ambiguity was the whole reason this needed fixing.
    let quoteMsg;
    if(quoteAdded){
      quoteMsg = data.quoteConfident
        ? 'Added a quote from this page.'
        : 'Added a quote found on this page (no clear attribution on the page itself, so it\'s credited to the site).';
    } else if(quoteFound){
      quoteMsg = 'Found a quote, but it was already in your notes.';
    } else {
      quoteMsg = 'No quote found on this page — it may not use a pull-quote style block.';
    }
    const otherMsg = added.length ? ` Also filled ${added.length} other field${added.length>1?'s':''}.` : '';
    statusEl.textContent = quoteMsg + otherMsg;
    statusEl.className = 'field-hint' + ((quoteAdded || added.length) ? ' ok' : '');
  }catch(err){
    console.error('Cheesemonger refresh apply failed', err);
    statusEl.textContent = 'Fetched the page, but hit a problem applying it — check the browser console.';
    statusEl.className = 'field-hint err';
  }finally{
    btn.disabled = false;
  }
}
$('cheesemongerRefreshBtn').addEventListener('click', refreshFromCheesemonger);

// Custom autocomplete dropdown for Producer and Cheesemonger (replaces
// native <datalist>, which iOS Safari handles unreliably). Shows every
// known value on focus, filters as you type, still accepts any free-text
// value so a new producer/cheesemonger isn't blocked.
function allProducers(){
  return [...new Set(entries.map(e=>e.producer).filter(Boolean))].sort();

function setupAutocomplete(inputId, listId){
  const input = $(inputId);
  const list = $(listId);

  function optionsFor(){
    try{ return JSON.parse(list.dataset.options || '[]'); }catch(e){ return []; }
  }
  function renderList(opts){
    if(opts.length === 0){ list.classList.remove('open'); list.innerHTML=''; return; }
    list.innerHTML = opts.map(o=>`<div data-val="${escapeHtml(o)}">${escapeHtml(o)}</div>`).join('');
    list.classList.add('open');
  }
  function showAll(){
    renderList(optionsFor());
    input.select();
  }
  function showFiltered(){
    const q = input.value.trim().toLowerCase();
    renderList(optionsFor().filter(o => !q || o.toLowerCase().includes(q)));
  }
  function hide(){ list.classList.remove('open'); }

  input.addEventListener('focus', showAll);
  input.addEventListener('input', showFiltered);
  input.addEventListener('blur', ()=> setTimeout(hide, 150));
  list.addEventListener('mousedown', (e)=>{
    const opt = e.target.closest('[data-val]');
    if(!opt) return;
    input.value = opt.dataset.val;
    hide();
  });
}

// --- Cross-app cross-links: Paired Wine and Restaurant are dropdowns
// sourced from the shared kv_store via the lightweight list_kv_names()
// RPC (name + key only — never the full record, which can carry large
// embedded photos). Both support inline "+ New ..." creation, writing a
// real stub entry directly into the other app's data with the same
// schema/id-scheme that app itself writes, so it's a genuine entry
// there, not just a local label. Mirrors the identical pattern in
// wine.html and in Restaurants' dish-row Cheese dropdown. ---
let wineOptions = []; // {id, name}
let spiritOptions = []; // {id, name}
let restaurantOptions = []; // {id, name}

async function refreshCrossLinkOptions(){
  wineOptions = [];
  spiritOptions = [];
  restaurantOptions = [];
  if(!supabaseClient) return; // no live Supabase (local/artifact mode) — dropdowns stay empty, still usable
  try{
    const [wineRes, spiritRes, restRes] = await Promise.all([
      supabaseClient.rpc('list_kv_names', { prefix: 'wine:' }),
      supabaseClient.rpc('list_kv_names', { prefix: 'spirits:' }),
      supabaseClient.rpc('list_kv_names', { prefix: 'entry:e' })
    ]);
    if(wineRes.error) throw wineRes.error;
    if(spiritRes.error) throw spiritRes.error;
    if(restRes.error) throw restRes.error;
    wineOptions = (wineRes.data || [])
      .map(r => ({ id: r.key.replace(/^wine:/, ''), name: r.name || 'Untitled' }))
      .sort((a,b) => a.name.localeCompare(b.name));
    spiritOptions = (spiritRes.data || [])
      .map(r => ({ id: r.key.replace(/^spirits:/, ''), name: r.name || 'Untitled' }))
      .sort((a,b) => a.name.localeCompare(b.name));
    restaurantOptions = (restRes.data || [])
      .map(r => ({ id: r.key.replace(/^entry:/, ''), name: r.name || 'Untitled' }))
      .sort((a,b) => a.name.localeCompare(b.name));
  }catch(err){
    console.error('Could not load wine/spirit/restaurant lists for the pickers', err);
  }
}

function buildLinkedSelect(selectEl, options, currentId, currentLabel, newLabel, openLinkEl, openLinkTarget){
  selectEl.innerHTML = '';
  const blankOpt = document.createElement('option');
  blankOpt.value = '';
  blankOpt.textContent = '\u2014';
  selectEl.appendChild(blankOpt);
  const newOpt = document.createElement('option');
  newOpt.value = '__new__';
  newOpt.textContent = newLabel;
  selectEl.appendChild(newOpt);
  let matched = false;
  options.forEach(o => {
    const opt = document.createElement('option');
    opt.value = o.id;
    opt.textContent = o.name;
    if(o.id && o.id === currentId){ opt.selected = true; matched = true; }
    selectEl.appendChild(opt);
  });
  if(currentId && !matched){
    const opt = document.createElement('option');
    opt.value = currentId;
    opt.textContent = '(' + (currentLabel || 'linked entry') + ' not in list)';
    opt.selected = true;
    selectEl.appendChild(opt);
  }
  if(openLinkEl && openLinkTarget){
    updateOpenLinkForSelect(selectEl, openLinkEl, openLinkTarget);
  }
}

// Shared by any single <select> cross-link paired with an "open" anchor
// (e.g. Paired Wine, Paired Spirit) — points the link at the currently
// selected linked entry's own page, hidden when nothing's selected.
function updateOpenLinkForSelect(selectEl, linkEl, targetFile){
  const id = selectEl.value;
  if(id && id !== '__new__'){
    linkEl.href = location.pathname.replace(/[^/]+$/, '') + targetFile + '#' + id;
    linkEl.style.display = '';
  } else {
    linkEl.removeAttribute('href');
    linkEl.style.display = 'none';
  }
}

// Resize/compress to a reasonable web size before storing as base64 —
// keeps entries light and quick to load across the collection.
function resizeImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim/w); w = maxDim; }
        else if(h >= w && h > maxDim){ w = Math.round(w * maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function loadEntries(){
  try{
    if(storage.listWithValues){
      // Fast path: one request for everything.
      const result = await storage.listWithValues('cheese:');
      entries = (result.items || [])
        .map(it => { try{ return JSON.parse(it.value); }catch(e){ return null; } })
        .filter(Boolean);
      setLoadError(supabaseInitError);
      render();
      return;
    }
    // Fallback for storage backends without a batch method (Claude artifact
    // storage, plain localStorage) — one request per entry.
    const result = await storage.list('cheese:');
    if(!result || !result.keys || result.keys.length === 0){
      entries = [];
      setLoadError(supabaseInitError);
      render();
      return;
    }
    const loaded = [];
    for(const key of result.keys){
      try{
        const r = await storage.get(key);
        if(r && r.value){
          loaded.push(JSON.parse(r.value));
        }
      }catch(err){ /* skip missing */ }
    }
    entries = loaded;
    setLoadError(supabaseInitError);
  }catch(err){
    console.error('Cheese Collection: failed to load entries', err);
    setLoadError(supabaseInitError ||
      `Couldn't load your entries (${err.message || err}). Your data is safe in storage — this looks like a connection hiccup, not lost data.`);
  }
  render();
}

// Keeps this cheese's restaurant link two-way: after saving, makes
// sure the linked restaurant's own "Cheeses had" list includes (or is
// updated to reflect) this cheese — closes the gap where only links
// initiated from the Restaurants app auto-synced. Updates an existing
// row for this cheese if one's already there, otherwise adds a new
// one. Errors are logged and swallowed so a sync failure can't block
// the cheese itself from saving.
// Keeps this cheese's restaurant links two-way: after saving, makes
// sure every linked restaurant's own "Cheeses had" list includes (or
// is updated to reflect) this cheese — closes the gap where only links
// initiated from the Restaurants app auto-synced. Updates an existing
// row for this cheese if one's already there, otherwise adds a new
// one, per restaurant. Runs across all visits (was a single
// restaurant, now a repeatable list). Errors are logged and swallowed
// per visit so one bad link can't block the cheese itself from saving.
async function syncCheeseBackLinkToRestaurant(cheeseId, cheeseName){
  const ids = currentRestaurantVisits
    .map(r => (r.restaurantUrl || '').split('#')[1])
    .filter(Boolean);
  if(!ids.length) return;
  const cheeseUrl = location.origin + location.pathname.replace(/cheese\.html$/, '') + 'cheese.html#' + cheeseId;
  await Promise.allSettled(ids.map(async id => {
    try{
      const res = await storage.get('entry:' + id);
      const restEntry = JSON.parse(res.value);
      restEntry.cheeseItems = restEntry.cheeseItems || [];
      const idx = restEntry.cheeseItems.findIndex(c => c.cheeseUrl === cheeseUrl);
      if(idx > -1){
        restEntry.cheeseItems[idx].name = cheeseName;
      } else {
        restEntry.cheeseItems.push({ name: cheeseName, note: '', cheeseUrl });
      }
      await storage.set('entry:' + id, JSON.stringify(restEntry));
    }catch(err){
      console.error('Could not sync cheese back-link to restaurant', id, err);
    }
  }));
}

    wrapped: $('f-wrapped').value,
    wrappedDesc: $('f-wrappedDesc').value.trim(),
    region: $('f-region').value.trim(),
    country: $('f-country').value.trim(),
    pairedWine: pairedWine ? pairedWine.name : '',
    pairedWineUrl: currentWineId ? (location.origin + location.pathname.replace(/cheese\.html$/, '') + 'wine.html#' + currentWineId) : '',
    pairedSpirit: pairedSpirit ? pairedSpirit.name : '',
    pairedSpiritUrl: currentSpiritId ? (location.origin + location.pathname.replace(/cheese\.html$/, '') + 'spirits.html#' + currentSpiritId) : '',
    restaurantVisits,
    date: $('f-date').value,
    comment: $('f-comment').value.trim()
  };
  try{
    await storage.set('cheese:' + id, JSON.stringify(entry));
    await syncCheeseBackLinkToRestaurant(id, name);
    if(editingId){
      const idx = entries.findIndex(e=>e.id===id);
      if(idx>-1) entries[idx] = entry; else entries.push(entry);
    } else {
      entries.push(entry);
    }
    render();
    closeForm();
  }catch(err){
    console.error(err);
    alert('Could not save entry. Please try again.');
  }
}

async function deleteEntry(id){
  try{
    await storage.delete('cheese:' + id);
    entries = entries.filter(e=>e.id!==id);
    render();
  }catch(err){
    console.error(err);
    alert('Could not delete entry. Please try again.');
  }
}

function closeForm(){
  $('ticket').classList.remove('open');
  resetForm();
}

$('toggleForm').addEventListener('click', () => {
  const t = $('ticket');
  if(t.classList.contains('open')){
    closeForm();
  } else {
    resetForm();
    t.classList.add('open');
    t.scrollIntoView({behavior:'smooth', block:'start'});
    $('f-name').focus();
  }
});
$('cancelBtn').addEventListener('click', closeForm);
$('saveBtn').addEventListener('click', saveEntry);

loadEntries().then(openFromHash);
</script>
</body>
</html>

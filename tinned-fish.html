<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tinned Fish</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:ital,wght@1,300&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="common.js"></script>
<link rel="stylesheet" href="style.css">
<style>
  :root{
    --paper:#f3efe6; --paper-dark:#e4dccb; --ink:#1f2a2e;
    --accent:#2f6f7e; --accent2:#c8963e; --muted:#5a6b6e; --line:#d3cbb8;
  }
  /* Tinned Fish-specific: the leading square is a rating chip (your Pantry
     score, shaded red -> yellow -> green) instead of a photo thumb. */
  .tf-score{
    display:flex;align-items:center;justify-content:center;
    font-family:var(--display-font);font-style:italic;font-weight:300;font-size:26px;
    color:var(--ink);
  }
  .tf-score.untasted{color:var(--muted);opacity:.45;font-size:18px;}
  .tf-score.unrated{font-size:12px;font-style:normal;font-family:inherit;color:var(--muted);text-align:center;line-height:1.2;}
  .tf-price{white-space:nowrap;color:var(--ink);}
  .tf-soldout{color:#a14a3b;}
  .filters .f-sel{min-width:120px;}
  .import-status{margin:0 0 14px;}
  .lightbox-links{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-top:6px;}
  .lightbox-links a{color:var(--accent);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker"><a href="index.html">&larr; Warehouse</a> &middot; Est. In Practice</div>
    <h1>Tinned Fish</h1>
    <div class="sub">conservas catalog &mdash; what&rsquo;s out there, what it costs, and how you liked it</div>
    <div id="authControl" class="auth-control" style="justify-content:center;margin-top:10px;"></div>
    <div class="rule"></div>
  </header>

  <div class="toolbar">
    <span class="count" id="count">loading&hellip;</span>
    <input type="text" id="search" placeholder="Search brand, fish, sauce, country, shop…">
    <div class="toolbar-btns">
      <button class="newbtn importbtn" id="importBtn" title="Load or refresh the catalog from tinned-fish-catalog.json">&#8635; Import catalog</button>
      <button class="newbtn" id="toggleForm">+ New Tin</button>
    </div>
  </div>

  <div class="import-status" id="importStatus"></div>

  <div class="filters">
    <select class="f-sel" id="fSeafood"><option value="">All seafood</option></select>
    <select class="f-sel" id="fCountry"><option value="">All countries</option></select>
    <select class="f-sel" id="fShop">
      <option value="">Any shop</option>
      <option value="mercado">Mercado Central NYC</option>
      <option value="mercado-in">Mercado Central, in stock</option>
      <option value="jubilee">Jubilee Marketplace</option>
      <option value="supermarket">Supermarket brands</option>
    </select>
    <select class="f-sel" id="fTasted">
      <option value="">Tasted or not</option>
      <option value="tasted">Tasted</option>
      <option value="untasted">Not tasted</option>
    </select>
    <select class="f-sel" id="fSort">
      <option value="brand">Sort: brand A&ndash;Z</option>
      <option value="rating">Sort: my rating</option>
      <option value="price-asc">Sort: price, low&ndash;high</option>
      <option value="price-desc">Sort: price, high&ndash;low</option>
      <option value="peroz">Sort: price per oz</option>
    </select>
  </div>

  <div class="load-error" id="loadErrorState">
    <span class="msg"></span>
    <button id="retryLoadBtn">Retry</button>
  </div>

  <div class="ticket" id="ticket">
    <div class="field">
      <label>Product</label>
      <input id="f-name" type="text" placeholder="Sardines in Olive Oil with Lemon">
    </div>
    <div class="row2">
      <div class="field">
        <label>Brand</label>
        <input id="f-brand" type="text" placeholder="Nuri" autocomplete="off">
        <div class="autocomplete-list" id="f-brand-options"></div>
      </div>
      <div class="field">
        <label>Country</label>
        <input id="f-country" type="text" placeholder="Portugal">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Seafood</label>
        <input id="f-seafood" type="text" placeholder="Sardines">
      </div>
      <div class="field">
        <label>Canning liquid / sauce</label>
        <input id="f-packedIn" type="text" placeholder="Olive oil with lemon">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Size (oz)</label>
        <input id="f-size" type="number" step="0.01" min="0" placeholder="4.4">
      </div>
      <div class="field">
        <label>Price per tin (USD)</label>
        <input id="f-price" type="number" step="0.01" min="0" placeholder="9.99">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Price source</label>
        <input id="f-priceSource" type="text" placeholder="Shop name">
      </div>
      <div class="field">
        <label>Price source link (optional)</label>
        <input id="f-priceSourceUrl" type="url" placeholder="https://&hellip;">
      </div>
    </div>
    <div class="field">
      <label>Where to buy</label>
      <input id="f-whereToBuy" type="text" placeholder="Shops, sites">
    </div>
    <div class="field">
      <label>Linked Pantry entry (your rating comes from here)</label>
      <select id="f-pantry"><option value="">&mdash;</option></select>
      <div class="field-hint">Rate tins in Pantry; linking one here shows its score and colors the card.</div>
    </div>
    <div class="field">
      <label>My notes</label>
      <textarea id="f-myNotes" placeholder="Want to try, gift idea, who recommended it&hellip;"></textarea>
    </div>
    <div class="form-actions">
      <button id="cancelBtn">Cancel</button>
      <button class="save" id="saveBtn">Save Tin</button>
    </div>
  </div>

  <div id="entries" class="loading">loading&hellip;</div>
</div>

<div class="lightbox" id="lightbox">
  <div class="lightbox-card">
    <button class="lightbox-close" id="lightboxClose">close &#10005;</button>
    <button class="lightbox-copy-link" id="lightboxCopyLink">&#128279; copy link</button>
    <div class="lightbox-name" id="lb-name"></div>
    <div class="lightbox-fields" id="lb-fields"></div>
    <div class="lightbox-links" id="lb-links"></div>
  </div>
</div>

<script>
// Tinned Fish: a catalog of conservas (one kv_store row per tin under
// KEY_PREFIX), separate from Pantry, which stays the record of what you
// actually own and how you rated it. A catalog row can point at a Pantry
// row (pantryId); the score shown here is read live from that Pantry row
// on every load, so rating something in Pantry updates this page with no
// second step. Rows are seeded from tinned-fish-catalog.json via the
// Import button (signed-in only); re-importing a newer JSON refreshes
// prices/stock on rows you haven't edited, never touches your notes or
// Pantry links, and skips anything you deleted here.
const KEY_PREFIX = 'tinnedfish:';
const DELETED_KEY = 'tinnedfish-deleted'; // ids deleted here, so re-import doesn't resurrect them
const CATALOG_URL = 'tinned-fish-catalog.json';
// Fields a re-import keeps fresh even on rows you've edited (they change
// shop to shop and week to week; nothing you'd type yourself).
const LIVE_FIELDS = ['mercadoPrice','mercadoStock','jubileePrice'];

let entries = [];
let pantry = {};          // pantry row id -> product object
let deletedIds = [];
let editingId = null;
let currentLightboxId = null;

// --- Auth: read is public, only a signed-in session can add/edit/delete.
// Same pattern (and same Supabase Auth account) as the other collection apps. ---
let currentUser = null;
let mfaSatisfied = true;

function renderAuthControl(){
  const el = document.getElementById('authControl');
  if(!supabaseClient){ el.innerHTML = ''; return; }
  if(currentUser && !mfaSatisfied){
    el.innerHTML = `
      <form id="mfaChallengeForm">
        <input type="text" id="mfaChallengeCode" placeholder="6-digit code" inputmode="numeric" maxlength="6" required autocomplete="one-time-code">
        <button type="submit">Verify</button>
      </form>
      <span class="auth-error" id="mfaChallengeError"></span>`;
    document.getElementById('mfaChallengeForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const code = document.getElementById('mfaChallengeCode').value.trim();
      const errEl = document.getElementById('mfaChallengeError');
      const { data: factors, error: listErr } = await supabaseClient.auth.mfa.listFactors();
      const factor = listErr ? null : (factors.totp || []).find(f => f.status === 'verified');
      if(!factor){ errEl.textContent = 'No 2FA factor found on this account.'; return; }
      const { error } = await supabaseClient.auth.mfa.challengeAndVerify({ factorId: factor.id, code });
      if(error){ errEl.textContent = 'Incorrect code — try again.'; return; }
      await checkMfaStatus();
      renderAuthControl();
      applyAuthGating();
    });
    return;
  }
  if(currentUser){
    el.innerHTML = `<span>${escapeHtml(currentUser.email)}</span><button id="signOutBtn">Sign out</button>`;
    document.getElementById('signOutBtn').addEventListener('click', async ()=>{ await supabaseClient.auth.signOut(); });
  } else {
    el.innerHTML = `
      <form id="signInForm">
        <input type="email" id="authEmail" placeholder="Email" required>
        <input type="password" id="authPassword" placeholder="Password" required>
        <button type="submit">Sign in</button>
      </form>
      <span class="auth-error" id="authError"></span>`;
    document.getElementById('signInForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      document.getElementById('authError').textContent = error ? 'Sign in failed' : '';
    });
  }
}

function canEdit(){ return !supabaseClient || (!!currentUser && mfaSatisfied); }

function applyAuthGating(){
  const loggedIn = canEdit();
  ['toggleForm','importBtn'].forEach(id => { const b = $(id); if(b) b.style.display = loggedIn ? '' : 'none'; });
  document.querySelectorAll('.entry-actions').forEach(el => { el.style.display = loggedIn ? '' : 'none'; });
}

if(supabaseClient){
  supabaseClient.auth.getSession().then(async ({data})=>{
    currentUser = data.session ? data.session.user : null;
    await checkMfaStatus(); renderAuthControl(); applyAuthGating(); render();
  });
  supabaseClient.auth.onAuthStateChange(async (_event, session)=>{
    currentUser = session ? session.user : null;
    await checkMfaStatus(); renderAuthControl(); applyAuthGating();
  });
} else {
  renderAuthControl();
}

// --- helpers ---
function money(n){ return (typeof n === 'number' && isFinite(n)) ? '$' + n.toFixed(2) : ''; }
function num(v){ const n = parseFloat(v); return isFinite(n) ? n : null; }
function shortCountry(c){ return (c || '').split(/[;(]/)[0].trim(); }
function seafoodGroup(s){ return (s || '').split(' (')[0].trim(); }
function perOz(e){ return (e.price && e.sizeOz) ? e.price / e.sizeOz : null; }

// Your Pantry score for a catalog row: {score:Number|null} when linked, null when not.
function ratingOf(e){
  const p = e.pantryId && pantry[e.pantryId];
  if(!p) return null;
  const s = num(p.overall);
  return { score: s, product: p };
}

// 1 = red, 5.5 = yellow, 10 = green (same scale as the spreadsheet).
function ratingColor(v){
  const stops = [[1,[0xF8,0x69,0x6B]],[5.5,[0xFF,0xEB,0x84]],[10,[0x63,0xBE,0x7B]]];
  v = Math.max(1, Math.min(10, v));
  for(let i=0;i<stops.length-1;i++){
    const [a,ca] = stops[i], [b,cb] = stops[i+1];
    if(v <= b){
      const t = (v-a)/(b-a);
      return 'rgb(' + ca.map((c,k)=>Math.round(c + (cb[k]-c)*t)).join(',') + ')';
    }
  }
  return 'rgb(99,190,123)';
}

function scoreChip(e){
  const r = ratingOf(e);
  if(!r) return `<div class="entry-thumb tf-score untasted">&mdash;</div>`;
  if(r.score === null) return `<div class="entry-thumb tf-score unrated" style="background:#d9d9d9">in<br>pantry</div>`;
  return `<div class="entry-thumb tf-score" style="background:${ratingColor(r.score)}">${r.score}</div>`;
}

function populateFilters(){
  const fill = (id, values, allLabel) => {
    const el = $(id), cur = el.value;
    el.innerHTML = `<option value="">${allLabel}</option>` +
      values.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');
    if(values.includes(cur)) el.value = cur;
  };
  fill('fSeafood', [...new Set(entries.map(e => seafoodGroup(e.seafood)).filter(Boolean))].sort(), 'All seafood');
  fill('fCountry', [...new Set(entries.map(e => shortCountry(e.country)).filter(c => c && !/^not stated/i.test(c)))].sort(), 'All countries');
  const brands = [...new Set(entries.map(e => e.brand).filter(Boolean))].sort();
  $('f-brand-options').dataset.options = JSON.stringify(brands);
}

function passesFilters(e){
  const sf = $('fSeafood').value, ct = $('fCountry').value, shop = $('fShop').value, tasted = $('fTasted').value;
  if(sf && seafoodGroup(e.seafood) !== sf) return false;
  if(ct && shortCountry(e.country) !== ct) return false;
  if(shop === 'mercado' && e.mercadoPrice == null) return false;
  if(shop === 'mercado-in' && !(e.mercadoPrice != null && e.mercadoStock === 'In stock')) return false;
  if(shop === 'jubilee' && e.jubileePrice == null) return false;
  if(shop === 'supermarket' && !/^Supermarket/.test(e.availability || '')) return false;
  const r = ratingOf(e);
  if(tasted === 'tasted' && !r) return false;
  if(tasted === 'untasted' && r) return false;
  return true;
}

function sortEntries(list){
  const by = $('fSort').value;
  const name = (e) => ((e.brand||'') + ' ' + (e.name||'')).toLowerCase();
  const nullsLast = (a, b, f, dir) => {
    const x = f(a), y = f(b);
    if(x == null && y == null) return name(a).localeCompare(name(b));
    if(x == null) return 1; if(y == null) return -1;
    return dir * (x - y) || name(a).localeCompare(name(b));
  };
  return [...list].sort((a,b) => {
    if(by === 'rating') return nullsLast(a, b, e => { const r = ratingOf(e); return r ? r.score : null; }, -1);
    if(by === 'price-asc') return nullsLast(a, b, e => e.price, 1);
    if(by === 'price-desc') return nullsLast(a, b, e => e.price, -1);
    if(by === 'peroz') return nullsLast(a, b, perOz, 1);
    return name(a).localeCompare(name(b));
  });
}

function render(){
  const wrap = $('entries');
  const { query, rawQuery, filtered: searched } = applySearchFilter(entries, e =>
    [e.name, e.brand, e.seafood, e.packedIn, e.country, e.whereToBuy, e.priceSource, e.notes, e.myNotes]);
  const filtered = searched.filter(passesFilters);
  const narrowed = query || filtered.length !== searched.length;
  const tastedCount = entries.filter(e => ratingOf(e)).length;

  $('count').textContent = entries.length === 0
    ? 'no tins yet'
    : narrowed
      ? `${filtered.length} of ${entries.length} tins` + (rawQuery ? ` match "${rawQuery}"` : '')
      : `${entries.length} tins · ${tastedCount} tasted`;

  if(entries.length === 0){
    wrap.innerHTML = canEdit()
      ? `<div class="empty"><span class="big">The shelf is empty.</span>Press &ldquo;Import catalog&rdquo; to load the tinned fish list, or add a tin by hand.</div>`
      : `<div class="empty"><span class="big">The shelf is empty.</span>Sign in and import the catalog to fill it.</div>`;
    applyAuthGating();
    return;
  }
  if(filtered.length === 0){
    wrap.innerHTML = `<div class="empty"><span class="big">No matches.</span>Try a different search or loosen the filters.</div>`;
    applyAuthGating();
    return;
  }

  wrap.innerHTML = sortEntries(filtered).map(e => {
    const meta = [];
    if(e.brand) meta.push(`<strong>${escapeHtml(e.brand)}</strong>`);
    if(e.seafood) meta.push(escapeHtml(e.seafood));
    if(e.packedIn && e.packedIn !== 'Not stated') meta.push(escapeHtml(e.packedIn));
    const c = shortCountry(e.country);
    if(c && !/^not stated/i.test(c)) meta.push(escapeHtml(c));
    if(e.sizeOz) meta.push(escapeHtml(e.sizeOz + ' oz'));
    if(e.price != null) meta.push(`<span class="tf-price">${money(e.price)}</span>`);
    else if(e.localPrice) meta.push(`<span class="tf-price">${escapeHtml(e.localPrice)}</span>`);
    if(e.mercadoPrice != null) meta.push(`Mercado Central ${money(e.mercadoPrice)}` + (e.mercadoStock === 'Sold out' ? ` <span class="tf-soldout">sold out</span>` : ''));
    if(e.jubileePrice != null) meta.push(`Jubilee ${money(e.jubileePrice)}`);
    const r = ratingOf(e);
    const note = r && r.product.notes ? r.product.notes : (e.myNotes || '');
    return `
    <div class="entry entry-row" data-id="${escapeHtml(e.id)}">
      <div class="entry-actions">
        <button class="editBtn">edit</button>
        <button class="delBtn">delete</button>
      </div>
      ${scoreChip(e)}
      <div class="entry-body">
        <div class="entry-top"><div>
          <div class="entry-name">${escapeHtml(e.name || 'Untitled')}</div>
          <div class="entry-meta">${meta.map(m=>`<span>${m}</span>`).join('')}</div>
        </div></div>
        ${note ? `<div class="entry-comment">${escapeHtml(note)}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  wrap.querySelectorAll('.editBtn').forEach(btn => btn.addEventListener('click', ev => {
    ev.stopPropagation(); openForEdit(ev.target.closest('.entry').dataset.id);
  }));
  wrap.querySelectorAll('.delBtn').forEach(btn => btn.addEventListener('click', async ev => {
    ev.stopPropagation();
    const id = ev.target.closest('.entry').dataset.id;
    if(confirm('Remove this tin from the catalog?')) await deleteEntry(id);
  }));
  wrap.querySelectorAll('.entry').forEach(card => card.addEventListener('click', () => openLightbox(card.dataset.id)));
  applyAuthGating();
}

function openLightbox(id){
  const e = entries.find(x => x.id === id);
  if(!e) return;
  currentLightboxId = id;
  $('lb-name').textContent = (e.brand ? e.brand + ' · ' : '') + (e.name || 'Untitled');
  const rows = [];
  const r = ratingOf(e);
  if(r) rows.push(['My rating', r.score !== null
    ? `<span class="tf-score" style="display:inline-flex;width:34px;height:24px;font-size:16px;background:${ratingColor(r.score)}">${r.score}</span> / 10`
    : 'In Pantry, not rated yet']);
  if(r && r.product.notes) rows.push(['Pantry note', escapeHtml(r.product.notes)]);
  if(e.seafood) rows.push(['Seafood', escapeHtml(e.seafood)]);
  if(e.packedIn) rows.push(['Packed in', escapeHtml(e.packedIn)]);
  if(e.country) rows.push(['Country', escapeHtml(e.country)]);
  if(e.sizeOz) rows.push(['Size', escapeHtml(e.sizeOz + ' oz')]);
  if(e.price != null) rows.push(['Price per tin', money(e.price) + (e.priceSource ? ' at ' + linkOrText(e.priceSource, e.priceSourceUrl) : '')]);
  if(perOz(e)) rows.push(['Price per oz', money(perOz(e))]);
  if(e.localPrice) rows.push(['Local price', escapeHtml(e.localPrice) + (e.price == null && e.priceSource ? ' at ' + linkOrText(e.priceSource, e.priceSourceUrl) : '')]);
  if(e.mercadoPrice != null) rows.push(['Mercado Central NYC', money(e.mercadoPrice) + (e.mercadoStock ? ' · ' + escapeHtml(e.mercadoStock) : '')]);
  if(e.jubileePrice != null) rows.push(['Jubilee (Instacart)', money(e.jubileePrice)]);
  if(e.availability) rows.push(['Availability', escapeHtml(e.availability)]);
  if(e.whereToBuy) rows.push(['Where to buy', escapeHtml(e.whereToBuy)]);
  if(e.notes) rows.push(['Notes', escapeHtml(e.notes)]);
  if(e.myNotes) rows.push(['My notes', escapeHtml(e.myNotes)]);
  if(e.dateAdded) rows.push(['Added', escapeHtml(fmtDate(e.dateAdded))]);
  $('lb-fields').innerHTML = rows.map(([l, v]) => `<div class="row"><span class="lbl">${l}</span><span>${v}</span></div>`).join('');

  const links = [];
  const q = encodeURIComponent([e.brand, e.name, 'tin'].filter(Boolean).join(' '));
  links.push(`<a href="https://www.google.com/search?tbm=isch&q=${q}" target="_blank" rel="noopener">View tin photos</a>`);
  if(r) links.push(`<a href="pantry.html?q=${encodeURIComponent(r.product.name || e.brand || '')}">Open in Pantry</a>`);
  if(safeUrl(e.priceSourceUrl)) links.push(`<a href="${escapeHtml(safeUrl(e.priceSourceUrl))}" target="_blank" rel="noopener">Price source</a>`);
  $('lb-links').innerHTML = links.join('');
  $('lightbox').classList.add('open');
}

$('lightboxCopyLink').addEventListener('click', async ev => {
  ev.stopPropagation();
  if(!currentLightboxId) return;
  const url = location.origin + location.pathname + '#' + currentLightboxId;
  const btn = $('lightboxCopyLink');
  try{ await navigator.clipboard.writeText(url); btn.textContent = '✓ copied'; }
  catch(err){ prompt('Copy this link:', url); }
  setTimeout(()=>{ btn.textContent = '🔗 copy link'; }, 1500);
});
$('lightboxClose').addEventListener('click', ev => { ev.stopPropagation(); closeLightbox(); });
$('lightbox').addEventListener('click', ev => { if(ev.target.id === 'lightbox') closeLightbox(); });
document.addEventListener('keydown', ev => { if(ev.key === 'Escape') closeLightbox(); });

// --- form ---
function pantryFishOptions(){
  return Object.entries(pantry)
    .filter(([, p]) => /tinned fish/i.test(p.category || '') || /tuna|sardine|anchov|mackerel|trout|salmon|mussel|oyster|octopus|squid/i.test(p.name || ''))
    .map(([id, p]) => ({ id, label: [p.brand, p.name].filter(Boolean).join(' · ') + (p.overall ? ` (${p.overall}/10)` : '') }))
    .sort((a,b) => a.label.localeCompare(b.label));
}
function fillPantrySelect(current){
  const sel = $('f-pantry');
  sel.innerHTML = '<option value="">&mdash;</option>' +
    pantryFishOptions().map(o => `<option value="${escapeHtml(o.id)}">${escapeHtml(o.label)}</option>`).join('');
  if(current && !pantry[current]) sel.insertAdjacentHTML('beforeend', `<option value="${escapeHtml(current)}">(linked Pantry entry not found)</option>`);
  sel.value = current || '';
}

function resetForm(){
  editingId = null;
  ['f-name','f-brand','f-country','f-seafood','f-packedIn','f-size','f-price','f-priceSource','f-priceSourceUrl','f-whereToBuy','f-myNotes']
    .forEach(id => { $(id).value = ''; });
  fillPantrySelect('');
  $('saveBtn').textContent = 'Save Tin';
}

function openForEdit(id){
  const e = entries.find(x => x.id === id);
  if(!e) return;
  resetForm();
  editingId = id;
  $('f-name').value = e.name || '';
  $('f-brand').value = e.brand || '';
  $('f-country').value = e.country || '';
  $('f-seafood').value = e.seafood || '';
  $('f-packedIn').value = e.packedIn || '';
  $('f-size').value = e.sizeOz ?? '';
  $('f-price').value = e.price ?? '';
  $('f-priceSource').value = e.priceSource || '';
  $('f-priceSourceUrl').value = e.priceSourceUrl || '';
  $('f-whereToBuy').value = e.whereToBuy || '';
  $('f-myNotes').value = e.myNotes || '';
  fillPantrySelect(e.pantryId || '');
  $('saveBtn').textContent = 'Update Tin';
  $('ticket').classList.add('open');
  $('ticket').scrollIntoView({behavior:'smooth', block:'start'});
}

async function saveEntry(){
  const name = $('f-name').value.trim();
  if(!name){ $('f-name').focus(); return; }
  const existing = editingId ? entries.find(e => e.id === editingId) : null;
  const id = editingId || ('tf-' + Date.now() + Math.random().toString(36).slice(2,7));
  const entry = Object.assign({}, existing || { dateAdded: new Date().toISOString().slice(0,10) }, {
    id, name,
    brand: $('f-brand').value.trim(),
    country: $('f-country').value.trim(),
    seafood: $('f-seafood').value.trim(),
    packedIn: $('f-packedIn').value.trim(),
    sizeOz: num($('f-size').value),
    price: num($('f-price').value),
    priceSource: $('f-priceSource').value.trim(),
    priceSourceUrl: $('f-priceSourceUrl').value.trim(),
    whereToBuy: $('f-whereToBuy').value.trim(),
    pantryId: $('f-pantry').value,
    myNotes: $('f-myNotes').value.trim(),
    edited: true   // re-imports leave this row's fields alone (except live shop prices)
  });
  try{
    await storage.set(KEY_PREFIX + id, JSON.stringify(entry));
    const idx = entries.findIndex(e => e.id === id);
    if(idx > -1) entries[idx] = entry; else entries.push(entry);
    populateFilters(); render(); closeForm();
  }catch(err){
    console.error(err);
    alert('Could not save this tin. Please try again.');
  }
}

async function deleteEntry(id){
  try{
    await storage.delete(KEY_PREFIX + id);
    entries = entries.filter(e => e.id !== id);
    if(!deletedIds.includes(id)){
      deletedIds.push(id);
      await storage.set(DELETED_KEY, JSON.stringify(deletedIds));
    }
    populateFilters(); render();
  }catch(err){
    console.error(err);
    alert('Could not delete this tin. Please try again.');
  }
}

// --- import ---
function setImportStatus(msg){ $('importStatus').textContent = msg || ''; }

async function importCatalog(){
  if(!canEdit()) return;
  const btn = $('importBtn');
  btn.disabled = true;
  try{
    setImportStatus('Fetching catalog…');
    const res = await fetch(CATALOG_URL, { cache: 'no-store' });
    if(!res.ok) throw new Error('could not load ' + CATALOG_URL + ' (HTTP ' + res.status + ')');
    const items = await res.json();
    const byId = new Map(entries.map(e => [e.id, e]));
    const toWrite = [];
    let added = 0, refreshed = 0, skipped = 0;
    for(const item of items){
      if(!item || !item.id || deletedIds.includes(item.id)){ skipped++; continue; }
      const cur = byId.get(item.id);
      let next;
      if(!cur){ next = item; added++; }
      else if(cur.edited){
        next = Object.assign({}, cur);
        LIVE_FIELDS.forEach(f => { if(item[f] !== undefined) next[f] = item[f]; else delete next[f]; });
      } else {
        next = Object.assign({}, item, { myNotes: cur.myNotes, pantryId: cur.pantryId || item.pantryId, dateAdded: cur.dateAdded || item.dateAdded });
        if(!next.myNotes) delete next.myNotes;
      }
      if(!cur || JSON.stringify(cur) !== JSON.stringify(next)){
        if(cur) refreshed++;
        toWrite.push(next);
      }
    }
    const now = new Date().toISOString();
    if(supabaseClient){
      // Batched upsert (100 rows per request) rather than one request per tin.
      for(let i = 0; i < toWrite.length; i += 100){
        const chunk = toWrite.slice(i, i + 100);
        setImportStatus(`Saving ${Math.min(i + 100, toWrite.length)} of ${toWrite.length}…`);
        const { error } = await supabaseClient.from('kv_store').upsert(
          chunk.map(e => ({ key: KEY_PREFIX + e.id, value: JSON.stringify(e), updated_at: now })));
        if(error) throw error;
      }
    } else {
      for(const e of toWrite) await storage.set(KEY_PREFIX + e.id, JSON.stringify(e));
    }
    setImportStatus(`Import done: ${added} added, ${refreshed} updated, ${items.length - added - refreshed - skipped} unchanged` + (skipped ? `, ${skipped} skipped (deleted here)` : '') + '.');
    await loadEntries();
  }catch(err){
    console.error('Tinned Fish: import failed', err);
    setImportStatus('Import failed: ' + (err.message || err) + '. Nothing already saved was removed.');
  }finally{
    btn.disabled = false;
  }
}

// --- load ---
async function loadPrefix(prefix){
  if(storage.listWithValues){
    const result = await storage.listWithValues(prefix);
    return (result.items || []).map(it => { try{ return JSON.parse(it.value); }catch(e){ return null; } }).filter(Boolean);
  }
  const result = await storage.list(prefix);
  const out = [];
  for(const key of (result && result.keys) || []){
    try{ const r = await storage.get(key); if(r && r.value) out.push(JSON.parse(r.value)); }catch(e){ /* skip */ }
  }
  return out;
}

async function loadEntries(){
  try{
    const [rows, pantryRows] = await Promise.all([
      loadPrefix(KEY_PREFIX),
      loadPrefix('pantry:').catch(err => { console.error('Tinned Fish: could not load Pantry ratings', err); return []; })
    ]);
    entries = rows;
    pantry = {};
    pantryRows.forEach(p => { if(p && p.id) pantry[p.id] = p; });
    try{ const d = await storage.get(DELETED_KEY); deletedIds = JSON.parse(d.value) || []; }catch(e){ deletedIds = []; }
    setLoadError(supabaseInitError);
    applyIncomingSearchQuery();
  }catch(err){
    console.error('Tinned Fish: failed to load entries', err);
    setLoadError(supabaseInitError ||
      `Couldn't load the catalog (${err.message || err}). Your data is safe in storage — this looks like a connection hiccup, not lost data.`);
  }
  populateFilters();
  render();
}

$('retryLoadBtn').addEventListener('click', loadEntries);
$('search').addEventListener('input', render);
['fSeafood','fCountry','fShop','fTasted','fSort'].forEach(id => $(id).addEventListener('change', render));
$('importBtn').addEventListener('click', importCatalog);
$('toggleForm').addEventListener('click', () => {
  const t = $('ticket');
  if(t.classList.contains('open')){ closeForm(); return; }
  resetForm();
  t.classList.add('open');
  t.scrollIntoView({behavior:'smooth', block:'start'});
  $('f-name').focus();
});
$('cancelBtn').addEventListener('click', closeForm);
$('saveBtn').addEventListener('click', saveEntry);
setupAutocomplete('f-brand', 'f-brand-options');

loadEntries().then(openFromHash);
</script>

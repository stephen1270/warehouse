<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Restaurants</title>
<link rel="stylesheet" href="https://use.typekit.net/vvc0ewr.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --paper:#f4f1e8;
    --paper-dark:#e9e4d5;
    --ink:#2a2b26;
    --wine:#7c2e2e;
    --brass:#a6813f;
    --slate:#3f4a44;
    --line:#c9c2ab;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper-dark);
    color:var(--ink);
    font-family:'Courier New', ui-monospace, monospace;
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px 80px;}

  header{
    text-align:center;
    margin-bottom:28px;
    position:relative;
  }
  header .kicker{
    letter-spacing:.28em;
    font-size:11px;
    color:var(--wine);
    text-transform:uppercase;
  }
  header .kicker a{color:inherit;text-decoration:none;}
  header .kicker a:hover{text-decoration:underline;}
  header h1{
    font-family:'adobe-caslon-pro', Georgia, 'Times New Roman', serif;
    font-weight:400;
    font-style:italic;
    font-size:44px;
    margin:6px 0 4px;
    letter-spacing:.01em;
  }
  header .sub{
    font-size:12px;
    color:var(--slate);
    opacity:.75;
  }
  header .rule{
    margin:18px auto 0;
    width:100%;
    height:1px;
    background:repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 12px);
    opacity:.35;
  }

  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin:22px 0 14px;
    font-size:12px;
    gap:14px;
    flex-wrap:wrap;
  }
  .toolbar .count{color:var(--slate);opacity:.75;flex:none;}
  .toolbar #search{
    flex:1;min-width:160px;
    font-family:inherit;font-size:13px;
    background:transparent;border:none;
    border-bottom:1px solid var(--line);
    padding:4px 2px;color:var(--ink);
  }
  .toolbar #search:focus{outline:none;border-bottom:1px solid var(--wine);}
  .toolbar #search::placeholder{color:var(--slate);opacity:.5;}
  .newbtn{
    background:var(--wine);
    color:var(--paper);
    border:none;
    font-family:inherit;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:10px 16px;
    cursor:pointer;
    border-radius:2px;
  }
  .newbtn:hover{background:#682626;}

  .auth-control{
    display:flex;align-items:center;gap:8px;
    font-size:11px;color:var(--slate);
  }
  .auth-control form{display:flex;gap:6px;align-items:center;}
  .auth-control input[type=email], .auth-control input[type=password]{
    padding:6px 8px;font-size:13px;border:1px solid var(--line);border-radius:2px;
    background:var(--paper);color:var(--ink);width:120px;font-family:'Courier New', monospace;
  }
  .auth-control button{
    font-family:inherit;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    padding:6px 10px;cursor:pointer;border-radius:2px;
    border:1px solid var(--ink);background:transparent;color:var(--ink);
  }
  .auth-error{color:var(--wine);font-size:10px;}

  /* form ticket */
  .ticket{
    background:var(--paper);
    border:1px solid var(--line);
    padding:22px;
    margin-bottom:22px;
    position:relative;
    box-shadow:0 1px 2px rgba(0,0,0,.06);
    display:none;
  }
  .ticket.open{display:block;}
  .ticket::before, .ticket::after{
    content:"";
    position:absolute;
    left:0;right:0;
    height:10px;
    background:
      radial-gradient(circle 5px at 0 0, transparent 5px, var(--paper-dark) 5.5px) 0 0/16px 100% repeat-x;
  }
  .ticket::before{top:-6px;transform:rotate(180deg);}
  .ticket::after{bottom:-6px;}

  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--wine);
    margin-bottom:5px;
  }
  .field input, .field textarea, .field select{
    width:100%;
    font-family:inherit;
    font-size:14px;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    padding:6px 2px;
    color:var(--ink);
  }
  .field select{
    appearance:none;
    -webkit-appearance:none;
    -moz-appearance:none;
    border-radius:0;
    background-image:linear-gradient(45deg, transparent 50%, var(--slate) 50%), linear-gradient(135deg, var(--slate) 50%, transparent 50%);
    background-position: calc(100% - 14px) center, calc(100% - 9px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat:no-repeat;
    padding-right:24px;
  }
  .field input:focus, .field textarea:focus, .field select:focus{
    outline:none;
    border-bottom:1px solid var(--wine);
  }
  .field textarea{resize:vertical;min-height:54px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

  .autofill-field{
    background:var(--paper-dark);
    border:1px dashed var(--line);
    padding:14px 16px;
    border-radius:3px;
    margin-bottom:20px;
  }
  .autofill-row{display:flex;gap:8px;}
  .autofill-row input{flex:1;}
  .autofill-row button{
    font-family:inherit;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    padding:8px 14px;cursor:pointer;border-radius:2px;white-space:nowrap;
    border:1px solid var(--wine);background:var(--wine);color:var(--paper);
  }
  .autofill-row button:hover{background:#7a1420;}
  .autofill-row button:disabled{opacity:.5;cursor:default;}
  .field-hint{font-size:10px;color:var(--slate);opacity:.8;margin-top:4px;}
  #autofillStatus.err{color:var(--wine);}
  #autofillStatus.ok{color:var(--slate);}

  .location-picker{
    margin-top:10px;
    border-top:1px solid var(--line);
    padding-top:10px;
  }
  .location-picker .lp-label{
    font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--wine);margin-bottom:6px;display:block;
  }
  .location-picker button{
    display:block;width:100%;text-align:left;
    font-family:inherit;font-size:13px;
    background:var(--paper);border:1px solid var(--line);
    padding:8px 10px;margin-bottom:6px;cursor:pointer;color:var(--ink);
    border-radius:2px;
  }
  .location-picker button:hover{border-color:var(--wine);color:var(--wine);}
  .location-picker button.lp-skip{
    color:var(--slate);font-style:italic;border-style:dashed;
  }

  .dish-row{
    border-bottom:1px solid var(--line);
    padding-bottom:8px;
    margin-bottom:10px;
  }
  .dish-row-main{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:6px;
  }
  .dish-row-links{
    display:grid;
    grid-template-columns:1fr 1fr auto;
    gap:8px;
    align-items:center;
  }
  .dish-row-links-2{grid-template-columns:1fr auto;}
  .dish-row-links-1{display:flex;justify-content:flex-end;}

  .dish-photo-wrap{
    display:flex;align-items:center;gap:6px;
    min-width:0;
  }
  .dish-photo-wrap input.dish-photo{flex:1;min-width:0;}
  .dish-photo-upload{
    background:none;border:none;color:var(--slate);
    font-size:15px;cursor:pointer;padding:2px 4px;line-height:1;flex:none;
  }
  .dish-photo-upload:hover{color:var(--wine);}
  .dish-photo-thumb-preview{
    width:96px;height:96px;object-fit:cover;border-radius:2px;
    border:1px solid var(--line);flex:none;
  }
  .dish-photo-clear{
    background:none;border:none;color:var(--slate);
    font-size:13px;cursor:pointer;padding:0 2px;line-height:1;flex:none;
  }
  .dish-photo-clear:hover{color:var(--wine);}
  .dish-row input, .dish-row select{
    font-family:inherit;font-size:13px;
    background:transparent;border:none;border-bottom:1px solid var(--line);
    padding:5px 2px;color:var(--ink);
    width:100%;
  }
  .dish-row select{
    appearance:none;
    -webkit-appearance:none;
    -moz-appearance:none;
    border-radius:0;
    background-image:linear-gradient(45deg, transparent 50%, var(--slate) 50%), linear-gradient(135deg, var(--slate) 50%, transparent 50%);
    background-position: calc(100% - 14px) center, calc(100% - 9px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat:no-repeat;
    padding-right:24px;
  }
  .dish-row input:focus, .dish-row select:focus{outline:none;border-bottom:1px solid var(--wine);}
  .dish-row input.dish-name{font-weight:600;}
  .dish-row select.dish-cheese{color:var(--slate);}
  .dish-rm{
    background:none;border:none;color:var(--slate);
    font-size:15px;cursor:pointer;padding:0 4px;line-height:1;
  }
  .dish-rm:hover{color:var(--wine);}
  .ghost-inline{
    font-family:inherit;font-size:11px;letter-spacing:.04em;
    color:var(--slate);background:none;border:none;cursor:pointer;
    text-decoration:underline;padding:2px 0;
  }
  .ghost-inline:hover{color:var(--wine);}
  .add-row-choices{display:flex;gap:14px;flex-wrap:wrap;}

  .dish-list{margin-top:6px;}
  .dish-item{
    font-size:13px;line-height:1.6;color:var(--ink);
  }
  .dish-item .dish-item-note{color:var(--slate);}
  .dish-item .dish-cheese-link{
    margin-left:5px;text-decoration:none;font-size:12px;
  }
  .dish-item .dish-photo-link{
    display:inline-block;vertical-align:middle;margin-left:5px;
  }
  .dish-item .dish-photo-thumb{
    width:22px;height:22px;object-fit:cover;border-radius:2px;
    vertical-align:middle;border:1px solid var(--line);cursor:zoom-in;
  }
  /* In the lightbox detail view, dish/wine/cheese/spirit photos get a
     much larger treatment than the card's small inline icon. */
  .lightbox-notes .dish-photo-link{
    display:block;margin:6px 0 0 0;
  }
  .lightbox-notes .dish-photo-thumb{
    width:96px;height:96px;border-radius:4px;
  }

  .stars{display:flex;gap:4px;font-size:20px;cursor:pointer;user-select:none;}
  .stars span{opacity:.25;transition:opacity .1s;}
  .stars span.on{opacity:1;color:var(--wine);}

  .form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;}
  .form-actions button{
    font-family:inherit;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:9px 14px;
    cursor:pointer;
    border-radius:2px;
    border:1px solid var(--ink);
    background:transparent;
    color:var(--ink);
  }
  .form-actions button.save{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  /* entries */
  .entry{
    background:var(--paper);
    border:1px solid var(--line);
    padding:18px 20px;
    margin-bottom:14px;
    position:relative;
    text-align:left;
  }
  .entry-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    text-align:left;
  }
  .entry-name{
    font-family:'adobe-caslon-pro', Georgia, 'Times New Roman', serif;
    font-style:italic;
    font-size:22px;
    text-align:left;
  }
  .entry-name a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line);}
  .entry-name a:hover{border-color:var(--wine);color:var(--wine);}
  .entry-meta{
    font-size:11px;
    color:var(--slate);
    opacity:.8;
    margin-top:2px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .entry-rating{color:var(--wine);font-size:14px;white-space:nowrap;}
  .entry-notes{
    margin-top:8px;
    font-size:13px;
    line-height:1.55;
    color:var(--ink);
    white-space:pre-wrap;
  }
  .entry-tags{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;}
  .tag{
    font-size:10px;
    border:1px solid var(--line);
    padding:3px 8px;
    border-radius:10px;
    color:var(--slate);
    letter-spacing:.04em;
  }
  .entry-actions{
    position:absolute;
    top:14px;right:16px;
    display:flex;gap:8px;
  }
  .entry-actions button{
    background:none;border:none;
    font-family:inherit;
    font-size:11px;
    color:var(--slate);
    opacity:.5;
    cursor:pointer;
  }
  .entry-actions button:hover{opacity:1;color:var(--wine);}

  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--slate);
    opacity:.7;
    font-size:13px;
    line-height:1.7;
  }
  .empty .big{font-family:'adobe-caslon-pro', Georgia, 'Times New Roman', serif;font-style:italic;font-size:20px;display:block;margin-bottom:8px;opacity:1;color:var(--ink);}

  .loading{text-align:center;padding:40px;font-size:12px;color:var(--slate);}

  ::placeholder{color:var(--slate);opacity:.4;}

  /* entry photos + lightbox */
  .entry{cursor:pointer;}
  .entry-thumbs{
    display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;
  }
  .entry-thumbs img{
    width:56px;height:56px;object-fit:cover;
    border:1px solid var(--line);border-radius:2px;
  }

  .lightbox{
    display:none;
    position:fixed;inset:0;
    background:rgba(20,18,14,.88);
    z-index:100;
    align-items:flex-start;justify-content:center;
    overflow-y:auto;
    padding:40px 16px;
  }
  .lightbox.open{display:flex;}
  .lightbox-card{
    background:var(--paper);
    max-width:640px;width:100%;
    padding:24px;
    position:relative;
    border:1px solid var(--line);
  }
  .lightbox-close{
    position:absolute;top:12px;right:14px;
    background:none;border:none;
    font-family:inherit;font-size:13px;
    color:var(--slate);cursor:pointer;
  }
  .lightbox-close:hover{color:var(--wine);}
  .lightbox-copy-link{
    position:absolute;top:12px;left:14px;
    background:none;border:none;
    font-family:inherit;font-size:11px;
    color:var(--slate);cursor:pointer;
    letter-spacing:.04em;
  }
  .lightbox-copy-link:hover{color:var(--wine);}
  .lightbox-name{
    font-family:'adobe-caslon-pro', Georgia, 'Times New Roman', serif;
    font-style:italic;font-size:26px;margin-bottom:2px;
  }
  .lightbox-name a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line);}
  .lightbox-name a:hover{border-color:var(--wine);color:var(--wine);}
  .lightbox-meta{
    font-size:11px;color:var(--slate);opacity:.8;
    display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;
  }
  .lightbox-photos{
    display:grid;
    grid-template-columns:repeat(auto-fill,96px);
    gap:8px;margin-bottom:18px;
  }
  .lightbox-photos img{
    width:96px;height:96px;object-fit:cover;
    border:1px solid var(--line);border-radius:2px;
    cursor:zoom-in;
  }
  .lightbox-notes .lbl{
    color:var(--wine);font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;display:block;margin-bottom:4px;
  }
  .lightbox-notes{font-size:13px;line-height:1.55;margin-bottom:14px;}
  .note-block{margin-bottom:16px;}
  .note-block:last-child{margin-bottom:0;}
  .note-block p{margin:0;white-space:pre-wrap;}
  .note-photo{
    display:block;
    width:96px;height:96px;object-fit:cover;
    border:1px solid var(--line);border-radius:2px;
    margin-bottom:8px;cursor:zoom-in;
  }
  .lightbox-tags{display:flex;gap:6px;flex-wrap:wrap;}

  .photo-zoom{
    display:none;
    position:fixed;inset:0;
    background:rgba(0,0,0,.92);
    z-index:200;
    align-items:center;justify-content:center;
    padding:20px;
    cursor:zoom-out;
  }
  .photo-zoom.open{display:flex;}
  .photo-zoom img{max-width:100%;max-height:100%;object-fit:contain;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker"><a href="index.html">&larr; Warehouse</a> &middot; Est. In Practice</div>
    <h1>Restaurants</h1>
    <div class="sub">a running record of tables kept</div>
    <div id="authControl" class="auth-control" style="justify-content:center;margin-top:10px;"></div>
    <div class="rule"></div>
  </header>

  <div class="toolbar">
    <span class="count" id="count">loading…</span>
    <input type="text" id="search" placeholder="Search by restaurant, place, or tag…">
    <button class="newbtn" id="toggleForm">+ New Entry</button>
  </div>

  <div class="ticket" id="ticket">
    <div class="field autofill-field">
      <label>Autofill from URL</label>
      <div class="autofill-row">
        <input id="f-autofillUrl" type="text" placeholder="the-restaurant.com or a listing page">
        <button type="button" id="autofillBtn">Fetch</button>
      </div>
      <div class="field-hint" id="autofillStatus">Pulls whatever it can find — works best on a restaurant's own site; review everything before saving.</div>
      <div class="location-picker" id="locationPicker" style="display:none;"></div>
    </div>

    <div class="field">
      <label>Restaurant</label>
      <input id="f-name" type="text" placeholder="Bar Americano">
    </div>
    <div class="field">
      <label>Restaurant link (optional)</label>
      <input id="f-website" type="text" placeholder="the-restaurant.com">
    </div>
    <div class="row2">
      <div class="field">
        <label>Neighborhood</label>
        <input id="f-neighborhood" type="text" placeholder="Greenwich Village">
      </div>
      <div class="field">
        <label>City</label>
        <input id="f-place" type="text" placeholder="New York">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>State / Province</label>
        <input id="f-state" type="text" placeholder="NY">
      </div>
      <div class="field">
        <label>Country</label>
        <input id="f-country" type="text" placeholder="United States">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Date</label>
        <input id="f-date" type="date">
      </div>
      <div class="field">
        <label>Price</label>
        <select id="f-price">
          <option value="">—</option>
          <option>$</option>
          <option>$$</option>
          <option>$$$</option>
          <option>$$$$</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Rating</label>
      <div class="stars" id="f-stars">
        <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
      </div>
    </div>
    <div class="field">
      <label>Dishes had</label>
      <div id="dishesList"></div>
      <button type="button" id="addDishBtn" class="ghost-inline">+ Add dish</button>
    </div>
    <div class="field">
      <label>Wines had</label>
      <div id="winesList"></div>
      <div class="add-row-choices">
        <button type="button" id="addWineByNameBtn" class="ghost-inline">+ Add by name</button>
        <button type="button" id="addWineByUrlBtn" class="ghost-inline">+ Add by URL</button>
        <button type="button" id="addWineByPhotoBtn" class="ghost-inline">+ Add by photo</button>
        <input type="file" id="wineByPhotoInput" accept="image/*" style="display:none;">
      </div>
    </div>
    <div class="field">
      <label>Cheeses had</label>
      <div id="cheesesList"></div>
      <div class="add-row-choices">
        <button type="button" id="addCheeseBtn" class="ghost-inline">+ Add cheese</button>
        <button type="button" id="addCheeseByUrlBtn" class="ghost-inline">+ Add by URL</button>
      </div>
    </div>
    <div class="field">
      <label>Spirits had</label>
      <div id="spiritsList"></div>
      <div class="add-row-choices">
        <button type="button" id="addSpiritByNameBtn" class="ghost-inline">+ Add by name</button>
        <button type="button" id="addSpiritByUrlBtn" class="ghost-inline">+ Add by URL</button>
        <button type="button" id="addSpiritByPhotoBtn" class="ghost-inline">+ Add by photo</button>
        <input type="file" id="spiritByPhotoInput" accept="image/*" style="display:none;">
      </div>
    </div>
    <div class="field">
      <label>Notes</label>
      <textarea id="f-notes" placeholder="How it was, who with, what to order next time…"></textarea>
    </div>
    <div class="field">
      <label>Tags (comma separated)</label>
      <input id="f-tags" type="text" placeholder="aperitivo, date night, Fort Greene">
    </div>
    <div class="form-actions">
      <button id="cancelBtn">Cancel</button>
      <button class="save" id="saveBtn">Save Entry</button>
    </div>
  </div>

  <div id="entries" class="loading">loading…</div>
</div>

<div class="lightbox" id="lightbox">
  <div class="lightbox-card">
    <button class="lightbox-close" id="lightboxClose">close ✕</button>
    <button class="lightbox-copy-link" id="lightboxCopyLink">🔗 copy link</button>
    <div class="lightbox-name" id="lb-name"></div>
    <div class="lightbox-meta" id="lb-meta"></div>
    <div class="lightbox-photos" id="lb-photos"></div>
    <div class="lightbox-notes" id="lb-dishes-wrap" style="display:none;">
      <span class="lbl">Dishes</span><div id="lb-dishes"></div>
    </div>
    <div class="lightbox-notes" id="lb-wines-wrap" style="display:none;">
      <span class="lbl">Wines</span><div id="lb-wines"></div>
    </div>
    <div class="lightbox-notes" id="lb-cheeses-wrap" style="display:none;">

// Supabase-backed storage, shared with the rest of Warehouse, so entries
// sync across devices instead of being trapped in one browser. Falls back
// to localStorage if Supabase can't be reached, and to Claude's
// window.storage when running inside a Claude artifact.
const SUPABASE_URL = 'https://psbdjeyianlhfkgwwsvt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_fmEJD4dXEZF0elMTqgfhIg_nH-dCQn_';

const localStorageAdapter = {
  async get(key){
    const v = localStorage.getItem(key);
    if(v === null) throw new Error('not found');
    return {key, value: v};
  },
  async set(key, value){
    localStorage.setItem(key, value);
    return {key, value};
  },
  async delete(key){
    localStorage.removeItem(key);
    return {key, deleted: true};
  },
  async list(prefix){
    const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
    return {keys};
  }
};

let supabaseClient = null;

function makeSupabaseAdapter(){
  if(typeof window === 'undefined' || !window.supabase || !window.supabase.createClient){
    return null;
  }
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const client = supabaseClient;
  return {
    async get(key){
      const { data, error } = await client.from('kv_store').select('value').eq('key', key).maybeSingle();
      if(error) throw error;
      if(!data) throw new Error('not found');
      try{ localStorage.setItem(key, data.value); }catch(e){}
      return {key, value: data.value};
    },
    async set(key, value){
      const { error } = await client.from('kv_store').upsert({ key, value, updated_at: new Date().toISOString() });
      if(error) throw error;
      try{ localStorage.setItem(key, value); }catch(e){}
      return {key, value};
    },
    async delete(key){
      const { error } = await client.from('kv_store').delete().eq('key', key);
      if(error) throw error;
      try{ localStorage.removeItem(key); }catch(e){}
      return {key, deleted: true};
    },
    async list(prefix){
      let query = client.from('kv_store').select('key');
      if(prefix) query = query.like('key', prefix + '%');
      const { data, error } = await query;
      if(error) throw error;
      return { keys: (data||[]).map(r => r.key) };
    },
    // Fetches every key+value under a prefix in ONE request, instead of
    // list() + a get() per key. With hundreds of entries, one-request-per-
    // entry means hundreds of sequential round trips before the page can
    // render anything — this is what was making load slow.
    async listWithValues(prefix){
      let query = client.from('kv_store').select('key,value');
      if(prefix) query = query.like('key', prefix + '%');
      const { data, error } = await query;
      if(error) throw error;
      const items = data || [];
      try{
        for(const row of items) localStorage.setItem(row.key, row.value);
      }catch(e){ /* localStorage full/unavailable — safe to skip */ }
      return { items: items.map(r => ({ key: r.key, value: r.value })) };
    }
  };
}

// For photo sources specifically: accepts either a real http(s) URL

// Resizes/compresses an uploaded photo before storing it as base64 —
// mirrors cheese.html/wine.html's gallery upload pipeline. Restaurants
// never had a photo-upload mechanism before this (only paste-a-URL), so
// this is new here.
function resizeImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim/w); w = maxDim; }
        else if(h >= w && h > maxDim){ w = Math.round(w * maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// --- Autofill: asks the restaurant-autofill Edge Function to fetch a
// restaurant's own site or a listing page server-side and pull out
// best-guess fields. Deliberately narrow scope: Name, Place, Price, and
// Photo only — Notes and Tags stay untouched since those are personal
// (occasion, who-with, neighborhood-as-you-call-it) rather than something
// a webpage states. Only ever fills fields that are currently empty. ---
function setAutofillStatus(msg, cls){
  const el = $('autofillStatus');
  el.textContent = msg;
  el.className = 'field-hint' + (cls ? ' ' + cls : '');
}

// Accepts a bare domain ("bluehillfarm.com") as well as a full URL —
// prepends https:// if no scheme was typed, so the field doesn't demand
// people paste the "https://" prefix by hand.
function normalizeAutofillUrl(u){
  u = (u || '').trim();
  if(!u) return u;
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
  return u;
}

async function fetchAutofillData(url){
  const res = await fetch('https://psbdjeyianlhfkgwwsvt.supabase.co/functions/v1/restaurant-autofill', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer sb_publishable_fmEJD4dXEZF0elMTqgfhIg_nH-dCQn_',
      'apikey': 'sb_publishable_fmEJD4dXEZF0elMTqgfhIg_nH-dCQn_'
    },
    body: JSON.stringify({ url })
  });
  const data = await res.json();
  if(!res.ok || !data.ok) throw new Error(data.error || `Could not fetch that page (HTTP ${res.status}).`);
  return data;
}

function applyAutofillData(data){
  const filled = [];
  const fillIfEmpty = (id, value) => {
    if(value && !$(id).value.trim()){
      $(id).value = value;
      filled.push(id);
    }
  };
  fillIfEmpty('f-name', data.name);
  fillIfEmpty('f-website', data.sourceUrl);
  fillIfEmpty('f-neighborhood', data.neighborhood);
  fillIfEmpty('f-place', data.city);
  fillIfEmpty('f-state', data.state);
  fillIfEmpty('f-country', data.country);
  if(data.price && !$('f-price').value){
    $('f-price').value = data.price;
    filled.push('f-price');
  }
  // Note: no photo field here, deliberately. This entry has no general
  // top-level photo upload (only per-dish/per-wine), and forcing an
  // autofilled restaurant photo into an unrelated dish slot would be a
  // confusing, arbitrary place to put it — so a fetched og:image is
  // simply not used, rather than force-fit somewhere it doesn't belong.

  if(filled.length){
    const fallbackNote = data.usedFallbackPage ? ' (City came from a linked page — the one you pasted didn\'t have it.)' : '';
    setAutofillStatus(`Filled ${filled.length} field${filled.length>1?'s':''} — double-check them, especially City and Price.${fallbackNote}`, 'ok');
  } else {
    setAutofillStatus('Fetched the page but found nothing new to fill in — the rest is already set or wasn\'t on the page.', 'ok');
  }
}

function hideLocationPicker(){
  $('locationPicker').style.display = 'none';
  $('locationPicker').innerHTML = '';
}

// If the site lists multiple distinct venues (a restaurant group — e.g.
// Blue Hill has both a Greenwich Village and a Stone Barns location),
// show them as options rather than silently guessing which one this
// entry means. Picking one re-fetches that specific page for sharper
// Place/Price; skipping just applies whatever the original page had.
function showLocationPicker(generalData, locations){
  const wrap = $('locationPicker');
  wrap.innerHTML = '';
  const label = document.createElement('span');
  label.className = 'lp-label';
  label.textContent = 'This site has more than one location — which one is this entry?';
  wrap.appendChild(label);

  locations.forEach(loc => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = loc.label;
    btn.addEventListener('click', async () => {
      hideLocationPicker();
      setAutofillStatus(`Fetching ${loc.label}…`);
      const autofillBtn = $('autofillBtn');
      autofillBtn.disabled = true;
      try{
        const specificData = await fetchAutofillData(loc.url);
        applyAutofillData(specificData);
      }catch(err){
        console.error('Could not fetch the selected location', err);
        // Fall back to the general page's data rather than leaving the
        // form untouched after the person made a choice.
        setAutofillStatus('Could not fetch that specific location — using the general page info instead.', 'err');
        applyAutofillData(generalData);
      }finally{
        autofillBtn.disabled = false;
      }
    });
    wrap.appendChild(btn);
  });

  const skipBtn = document.createElement('button');
  skipBtn.type = 'button';
  skipBtn.className = 'lp-skip';
  skipBtn.textContent = 'Not sure / use the general page info';
  skipBtn.addEventListener('click', () => {
    hideLocationPicker();
    applyAutofillData(generalData);
  });
  wrap.appendChild(skipBtn);

  wrap.style.display = 'block';
}

async function runAutofill(){
  const url = normalizeAutofillUrl($('f-autofillUrl').value);
  if(!url){
    setAutofillStatus('Paste a URL first.', 'err');
    return;
  }
  const btn = $('autofillBtn');
  btn.disabled = true;
  setAutofillStatus('Fetching…');
  hideLocationPicker();

  let data;
  try{
    data = await fetchAutofillData(url);
  }catch(err){
    console.error('Autofill fetch failed', err);
    setAutofillStatus(err.message || 'Autofill request failed — check the URL and try again.', 'err');
    btn.disabled = false;
    return;
  }

  try{
    if(data.locations && data.locations.length > 1){
      setAutofillStatus('Found multiple locations on this site.', 'ok');
      showLocationPicker(data, data.locations);
    } else {
      applyAutofillData(data);
    }
  }catch(err){
    console.error('Autofill fetched OK but applying it to the form failed', err);
    setAutofillStatus('Fetched the page, but hit a problem filling in the form — check the browser console for details.', 'err');
  }finally{
    btn.disabled = false;
  }
}
$('autofillBtn').addEventListener('click', runAutofill);

});

function renderDishesList(){

async function refreshWineOptions(){
  wineOptions = [];
  if(!supabaseClient) return;
  try{
    const { data, error } = await supabaseClient.rpc('list_kv_names', { prefix: 'wine:' });

    wineOptions = (data || [])

async function createNewWine(name){
  if(!supabaseClient) throw new Error('Not connected to Supabase');
  const id = 'w' + Date.now() + Math.random().toString(36).slice(2,7);
  const entry = {
    id, name,
    photos: [],
    producer: '', producerUrl: '',
    winemaker: '',
    merchant: '', merchantUrl: '',
    type: '', vintage: '',
    region: '', country: '',
    pairedCheese: '', pairedCheeseUrl: '',
    restaurant: '', restaurantUrl: '',
    date: new Date().toISOString().slice(0,10),
    comment: ''
  };
  if(editingId){
    entry.restaurant = $('f-name').value.trim();
    entry.restaurantUrl = location.origin + location.pathname.replace(/restaurants\.html$/, '') + 'restaurants.html#' + editingId;
  }
  const { error } = await supabaseClient
    .from('kv_store')
    .upsert({ key: 'wine:' + id, value: JSON.stringify(entry), updated_at: new Date().toISOString() });
  if(error) throw error;
  return { id, name };
}

$('addWineByPhotoBtn').addEventListener('click', () => $('wineByPhotoInput').click());
$('wineByPhotoInput').addEventListener('change', async () => {
  const file = $('wineByPhotoInput').files[0];
  $('wineByPhotoInput').value = '';
  if(!file) return;
  const btn = $('addWineByPhotoBtn');
  const originalText = btn.textContent;
  let dataUrl;
  try{
    dataUrl = await resizeImage(file, 900, 0.7);
  }catch(err){
    console.error('Could not process photo', err);
    alert('Could not read that photo — please try another.');
    return;
  }

  // Try to identify the wine from the label (vision + web search), then
  // hand any URL it finds straight to wine-autofill for the full extract.
  // If identification isn't set up yet, fails, or comes back low-confidence,
  // this falls back to the original behavior: just attach the photo and
  // let the person type the name themselves.
  btn.textContent = 'Identifying…';
  btn.disabled = true;
  try{
    const lookupRes = await fetch('https://psbdjeyianlhfkgwwsvt.supabase.co/functions/v1/wine-label-lookup', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer sb_publishable_fmEJD4dXEZF0elMTqgfhIg_nH-dCQn_',
        'apikey': 'sb_publishable_fmEJD4dXEZF0elMTqgfhIg_nH-dCQn_'
      },
      body: JSON.stringify({ image: dataUrl })
    });
    const lookup = await lookupRes.json();

    if(lookup.ok && lookup.url && lookup.confidence !== 'low'){
      btn.textContent = 'Fetching details…';
      const created = await createWineFromUrl(lookup.url);
      wineOptions.push({ id: created.id, name: created.name });
      wineOptions.sort((a,b) => a.name.localeCompare(b.name));
      readWinesFromDom();
      currentWines.push({
        name: created.name,
        note: '',
        wineUrl: location.origin + location.pathname.replace(/restaurants\.html$/, '') + 'wine.html#' + created.id,
        photoUrl: dataUrl
      });
      renderWinesList();
    } else {
      // Couldn't confidently identify it (or lookup isn't configured) —
      // fall back to attaching just the photo, same as before.
      if(!lookup.ok) console.warn('Wine label lookup unavailable:', lookup.error);
      readWinesFromDom();
      currentWines.push({name: lookup.name || '', note:'', wineUrl:'', photoUrl:dataUrl});
      renderWinesList();
      if(!lookup.name){
        const rows = $('winesList').querySelectorAll('.dish-row');
        rows[rows.length-1].querySelector('.dish-name').focus();
      }
    }
  }catch(err){
    console.error('Wine photo lookup/autofill failed', err);
    // Still attach the photo even if identification broke entirely —
    // never lose the photo the person just took.
    readWinesFromDom();
    currentWines.push({name:'', note:'', wineUrl:'', photoUrl:dataUrl});
    renderWinesList();
    const rows = $('winesList').querySelectorAll('.dish-row');
    rows[rows.length-1].querySelector('.dish-name').focus();
  }finally{
    btn.textContent = originalText;
    btn.disabled = false;
  }
});

// Fetches wine-autofill for a URL and writes a real, populated Wine entry
// directly into the shared kv_store (not just a name stub) — reuses the
// exact same edge function wine.html's own Autofill button calls.
async function createWineFromUrl(url){
  if(!supabaseClient) throw new Error('Not connected to Supabase');
  const res = await fetch('https://psbdjeyianlhfkgwwsvt.supabase.co/functions/v1/wine-autofill', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer sb_publishable_fmEJD4dXEZF0elMTqgfhIg_nH-dCQn_',
      'apikey': 'sb_publishable_fmEJD4dXEZF0elMTqgfhIg_nH-dCQn_'
    },
    body: JSON.stringify({ url })
  });
  const data = await res.json();
  if(!res.ok || !data.ok) throw new Error(data.error || `Could not fetch that page (HTTP ${res.status}).`);
  if(!data.name) throw new Error('Could not find a wine name on that page.');

  const id = 'w' + Date.now() + Math.random().toString(36).slice(2,7);
  const entry = {
    id, name: data.name,
    photos: data.photo ? [data.photo] : [],
    producer: data.producer || '', producerUrl: data.producerUrl || '',
    winemaker: data.winemaker || '',
    merchant: data.merchant || '', merchantUrl: data.merchantUrl || '',
    type: data.type || '', vintage: data.vintage || '',
    region: data.region || '', country: data.country || '',
    pairedCheeses: [],
    restaurant: '', restaurantUrl: '',
    date: new Date().toISOString().slice(0,10),
    comment: data.comment || ''
  };
  if(editingId){
    entry.restaurant = $('f-name').value.trim();
    entry.restaurantUrl = location.origin + location.pathname.replace(/restaurants\.html$/, '') + 'restaurants.html#' + editingId;
  }
  const { error } = await supabaseClient
    .from('kv_store')
    .upsert({ key: 'wine:' + id, value: JSON.stringify(entry), updated_at: new Date().toISOString() });
  if(error) throw error;
  return { id, name: data.name };
}

async function createNewSpirit(name){
  if(!supabaseClient) throw new Error('Not connected to Supabase');
  const id = 's' + Date.now() + Math.random().toString(36).slice(2,7);
  const entry = {
    id, name,
    photos: [],
    producer: '', producerUrl: '',
    distiller: '',
    merchant: '', merchantUrl: '',
    type: '', abv: '',
    region: '', country: '',
    pairedCheeses: [],

// Fetches spirits-autofill for a URL and writes a real, populated Spirits
// entry directly into the shared kv_store — mirrors createWineFromUrl.
async function createSpiritFromUrl(url){
  if(!supabaseClient) throw new Error('Not connected to Supabase');
  const res = await fetch('https://psbdjeyianlhfkgwwsvt.supabase.co/functions/v1/spirits-autofill', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer sb_publishable_fmEJD4dXEZF0elMTqgfhIg_nH-dCQn_',
      'apikey': 'sb_publishable_fmEJD4dXEZF0elMTqgfhIg_nH-dCQn_'
    },
    body: JSON.stringify({ url })
  });
  const data = await res.json();
  if(!res.ok || !data.ok) throw new Error(data.error || `Could not fetch that page (HTTP ${res.status}).`);
  if(!data.name) throw new Error('Could not find a spirit name on that page.');

  const id = 's' + Date.now() + Math.random().toString(36).slice(2,7);
  const entry = {
    id, name: data.name,
    photos: data.photo ? [data.photo] : [],
    producer: data.producer || '', producerUrl: data.producerUrl || '',
    distiller: data.distiller || '',
    merchant: data.merchant || '', merchantUrl: data.merchantUrl || '',
    type: data.type || '', abv: data.abv || '',
    region: data.region || '', country: data.country || '',
    pairedCheeses: [],
    restaurant: '', restaurantUrl: '',
    date: new Date().toISOString().slice(0,10),
    comment: data.comment || ''
  };
  if(editingId){
    entry.restaurant = $('f-name').value.trim();
    entry.restaurantUrl = location.origin + location.pathname.replace(/restaurants\.html$/, '') + 'restaurants.html#' + editingId;
  }
  const { error } = await supabaseClient
    .from('kv_store')
    .upsert({ key: 'spirits:' + id, value: JSON.stringify(entry), updated_at: new Date().toISOString() });
  if(error) throw error;
  return { id, name: data.name };
}

function renderSpiritItemsHtml(e){

// Resolves an entry's dishes for display, whether it has the new
// structured dishItems array or only the old flat comma-separated
// `dishes` string (kept, never migrated in the database, so nothing
// existing is lost or silently rewritten).
function dishItemsOf(e){
  if(e.dishItems && e.dishItems.length) return e.dishItems;
  if(e.dishes) return e.dishes.split(/,\s*/).filter(Boolean).map(name => ({name}));
  return [];
}

function renderDishItemsHtml(e){
  const items = dishItemsOf(e);
  if(!items.length) return '';
  return `<div class="dish-list">${items.map(d => {
    const cheeseHref = safeUrl(d.cheeseUrl);
    const photoHref = safePhotoSrc(d.photoUrl);
    return `<div class="dish-item">
      <span class="dish-item-name">${escapeHtml(d.name)}</span>${d.note ? ` <span class="dish-item-note">— ${escapeHtml(d.note)}</span>` : ''}${cheeseHref ? ` <a class="dish-cheese-link" href="${escapeHtml(cheeseHref)}" target="_blank" rel="noopener" title="Linked cheese">\ud83e\uddc0</a>` : ''}${photoHref ? ` <a class="dish-photo-link" href="${escapeHtml(photoHref)}" target="_blank" rel="noopener" title="Photo of this dish"><img class="dish-photo-thumb" src="${escapeHtml(photoHref)}" alt=""></a>` : ''}
    </div>`;
  }).join('')}</div>`;
}

function stripPhotoTags(notes){
  return notes.replace(/\(photo:\s*[^)]+\)\s*/gi, '');
}

function renderNotesWithPhotos(e){
  if(!e.notes) return { html: '', leftoverPhotos: (e.photos || []) };

  const photos = e.photos || [];
  const used = new Set();
  const photoTagRe = /^\(photo:\s*([^)]+)\)\s*/i;

  const paragraphs = e.notes.split(/\n\n+/);

  const html = paragraphs.map(para => {
    const m = para.match(photoTagRe);
    let imgHtml = '';
    let text = para;

    if(m){
      text = para.slice(m[0].length);
      const wanted = m[1].trim().toLowerCase();
      let matchIdx = -1;
      photos.forEach((p, i) => {
        if(matchIdx !== -1 || used.has(i)) return;
        const cap = (p && typeof p === 'object' && p.caption) ? p.caption.toLowerCase() : '';
        if(cap && (cap.includes(wanted) || wanted.includes(cap))) matchIdx = i;
      });
      if(matchIdx !== -1){
        used.add(matchIdx);
        imgHtml = `<img class="note-photo" src="${photoUrl(photos[matchIdx])}" alt="">`;
      }
    }

    const textHtml = text.trim() ? `<p>${escapeHtml(text.trim())}</p>` : '';
    return `<div class="note-block">${imgHtml}${textHtml}</div>`;
  }).join('');

  const leftoverPhotos = photos.filter((_, i) => !used.has(i));
  return { html, leftoverPhotos };
}

function openLightbox(id){
  const e = entries.find(x => x.id === id);
  if(!e) return;
  currentLightboxId = id;

  const websiteHref = safeUrl(e.website);
  if(websiteHref){
    $('lb-name').innerHTML = `<a href="${escapeHtml(websiteHref)}" target="_blank" rel="noopener">${escapeHtml(e.name || 'Untitled')}</a>`;
  } else {
    $('lb-name').textContent = e.name || 'Untitled';
  }

  const metaBits = [];
  if(e.date) metaBits.push(fmtDate(e.date));
  if(placeLine(e)) metaBits.push(placeLine(e));
  if(e.rating) metaBits.push(starsHtml(e.rating));
  $('lb-meta').innerHTML = metaBits.map(m => `<span>${m}</span>`).join('');

  const { html: notesHtml, leftoverPhotos } = renderNotesWithPhotos(e);

  const dishItems = dishItemsOf(e);
  if(dishItems.length){
    $('lb-dishes-wrap').style.display = 'block';
    $('lb-dishes').innerHTML = renderDishItemsHtml(e);
  } else {
    $('lb-dishes-wrap').style.display = 'none';
  }

  const wineItems = wineItemsOf(e);
  if(wineItems.length){
    $('lb-wines-wrap').style.display = 'block';
    $('lb-wines').innerHTML = renderWineItemsHtml(e);
  } else {
    $('lb-wines-wrap').style.display = 'none';
  }

  const cheeseItems = cheeseItemsOf(e);
  if(cheeseItems.length){
    $('lb-cheeses-wrap').style.display = 'block';
    $('lb-cheeses').innerHTML = renderCheeseItemsHtml(e);
  } else {
    $('lb-cheeses-wrap').style.display = 'none';
  }

  const spiritItems = spiritItemsOf(e);
  if(spiritItems.length){
    $('lb-spirits-wrap').style.display = 'block';
    $('lb-spirits').innerHTML = renderSpiritItemsHtml(e);
  } else {
    $('lb-spirits-wrap').style.display = 'none';
  }

  if(e.notes){
    $('lb-notes-wrap').style.display = 'block';
    $('lb-notes').innerHTML = notesHtml;
  } else {
    $('lb-notes-wrap').style.display = 'none';
  }

  const photosWrap = $('lb-photos');
  if(leftoverPhotos && leftoverPhotos.length){
    photosWrap.style.display = 'grid';
    photosWrap.innerHTML = leftoverPhotos.map(p => `<img src="${photoUrl(p)}" alt="">`).join('');
  } else {
    photosWrap.style.display = 'none';
    photosWrap.innerHTML = '';
  }

  $('lightbox').querySelectorAll('.note-photo, #lb-photos img').forEach(img=>{
    img.addEventListener('click', ev => {
      ev.stopPropagation();
      openPhotoZoom(img.src);
    });
  });

  $('lb-tags').innerHTML = (e.tags && e.tags.length)
    ? e.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')
    : '';

  $('lightbox').classList.add('open');
}

  $('f-neighborhood').value = e.neighborhood || '';
  $('f-place').value = e.place || '';
  $('f-state').value = e.state || '';
  $('f-country').value = e.country || '';
  $('f-date').value = e.date || '';
  $('f-price').value = e.price || '';
  // Structured dishItems if present; otherwise convert the legacy flat
  // `dishes` string into rows as an editable starting point — nothing is
  // silently discarded or auto-migrated in the database, this only
  // affects what you see when you open the form.
  currentDishes = (e.dishItems && e.dishItems.length)
    ? e.dishItems.map(d => ({...d}))
    : (e.dishes ? e.dishes.split(/,\s*/).filter(Boolean).map(name => ({name, note:'', cheeseUrl:'', photoUrl:''})) : []);
  renderDishesList();
  currentWines = (e.wineItems && e.wineItems.length) ? e.wineItems.map(w => ({...w})) : [];
  renderWinesList();
  // Structured cheeseItems if present; otherwise pull forward any cheese
  // links still sitting on individual dishes from before Cheese moved out
  // into its own section, so the connection isn't lost on first re-edit.
  currentCheeses = (e.cheeseItems && e.cheeseItems.length)
    ? e.cheeseItems.map(c => ({...c}))
    : (e.dishItems || []).filter(d => d.cheeseUrl).map(d => ({ name: '', cheeseUrl: d.cheeseUrl, note: d.name ? `From dish: ${d.name}` : '' }));
  renderCheesesList();
  refreshCheeseOptions().then(() => { readCheesesFromDom(); renderCheesesList(); });
  refreshWineOptions().then(() => { readWinesFromDom(); renderWinesList(); });
  currentSpirits = (e.spiritItems && e.spiritItems.length) ? e.spiritItems.map(s => ({...s})) : [];
  renderSpiritsList();
  refreshSpiritOptions().then(() => { readSpiritsFromDom(); renderSpiritsList(); });
  $('f-notes').value = e.notes || '';
  $('f-tags').value = (e.tags||[]).join(', ');
  setStars(e.rating || 0);
  $('ticket').classList.add('open');
  $('ticket').scrollIntoView({behavior:'smooth', block:'start'});
}

async function loadEntries(){
  try{
    // Scoped to 'entry:e' — NOT the bare 'entry:' prefix. Restaurant entry
    // ids always start with 'e' (see saveEntry's id generation below), but
    // Music's entries also live in this same shared kv_store table under
    // 'entry:m-...'. A bare 'entry:' prefix here would match both, silently
    // pulling every Music track into this app's own entry list (this
    // actually happened — it's what was surfacing as "Untitled" cards).
    if(storage.listWithValues){
      // Fast path: one request for everything.
      const result = await storage.listWithValues('entry:e');
      entries = (result.items || [])
        .map(it => { try{ return JSON.parse(it.value); }catch(e){ return null; } })
        .filter(Boolean);
      render();
      return;
    }
    // Fallback for storage backends without a batch method (Claude artifact
    // storage, plain localStorage) — one request per entry.
    const result = await storage.list('entry:e');
    if(!result || !result.keys || result.keys.length === 0){
      entries = [];
      render();
      return;
    }
    const loaded = [];
    for(const key of result.keys){
      try{
        const r = await storage.get(key);
        if(r && r.value){
          loaded.push(JSON.parse(r.value));
        }
      }catch(err){ /* skip missing */ }
    }
    entries = loaded;
  }catch(err){
    entries = [];
  }
  render();
}

async function saveEntry(){
  const name = $('f-name').value.trim();
  if(!name){
    $('f-name').focus();
    return;
  }
  const id = editingId || ('e' + Date.now() + Math.random().toString(36).slice(2,7));
  const tags = $('f-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  readDishesFromDom();
  const dishItems = currentDishes.filter(d => d.name || d.photoUrl);
  readWinesFromDom();
  const wineItems = currentWines.filter(w => w.name || w.wineUrl || w.photoUrl);
  readCheesesFromDom();
  const cheeseItems = currentCheeses.filter(c => c.cheeseUrl);
  readSpiritsFromDom();
  const spiritItems = currentSpirits.filter(s => s.name || s.spiritUrl || s.photoUrl);
  const entry = {
    id,
    name,
    website: normalizeAutofillUrl($('f-website').value),
    neighborhood: $('f-neighborhood').value.trim(),
    place: $('f-place').value.trim(),
    state: $('f-state').value.trim(),
    country: $('f-country').value.trim(),
    date: $('f-date').value,
    price: $('f-price').value,
    rating: currentStars,
    dishItems,
    wineItems,
    cheeseItems,
    spiritItems,
    notes: $('f-notes').value.trim(),
    tags
  };
  try{
    await storage.set('entry:' + id, JSON.stringify(entry));
    if(editingId){
      const idx = entries.findIndex(e=>e.id===id);
      if(idx>-1) entries[idx] = entry; else entries.push(entry);
    } else {
      entries.push(entry);
    }
    render();
    closeForm();
  }catch(err){
    alert('Could not save entry. Please try again.');
    console.error(err);
  }
}

async function deleteEntry(id){
  try{
    await storage.delete('entry:' + id);
    entries = entries.filter(e=>e.id!==id);
    render();
  }catch(err){
    alert('Could not delete entry. Please try again.');
    console.error(err);
  }
}

function closeForm(){
  $('ticket').classList.remove('open');
  resetForm();
}

$('toggleForm').addEventListener('click', () => {
  const t = $('ticket');
  if(t.classList.contains('open')){
    closeForm();
  } else {
    resetForm();
    t.classList.add('open');
    t.scrollIntoView({behavior:'smooth', block:'start'});
    $('f-name').focus();
  }
});
$('cancelBtn').addEventListener('click', closeForm);
$('saveBtn').addEventListener('click', saveEntry);
document.querySelectorAll('#f-stars span').forEach(s=>{
  s.addEventListener('click', () => setStars(parseInt(s.dataset.v)));
});

$('search').addEventListener('input', render);

loadEntries().then(openFromHash);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Restaurants</title>
<link rel="stylesheet" href="https://use.typekit.net/vvc0ewr.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --paper:#f4f1e8;
    --paper-dark:#e9e4d5;
    --ink:#2a2b26;
    --wine:#7c2e2e;
    --brass:#a6813f;
    --slate:#3f4a44;
    --line:#c9c2ab;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper-dark);
    color:var(--ink);
    font-family:'Courier New', ui-monospace, monospace;
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px 80px;}

  header{
    text-align:center;
    margin-bottom:28px;
    position:relative;
  }
  header .kicker{
    letter-spacing:.28em;
    font-size:11px;
    color:var(--wine);
    text-transform:uppercase;
  }
  header .kicker a{color:inherit;text-decoration:none;}
  header .kicker a:hover{text-decoration:underline;}
  header h1{
    font-family:'adobe-caslon-pro', Georgia, 'Times New Roman', serif;
    font-weight:400;
    font-style:italic;
    font-size:44px;
    margin:6px 0 4px;
    letter-spacing:.01em;
  }
  header .sub{
    font-size:12px;
    color:var(--slate);
    opacity:.75;
  }
  header .rule{
    margin:18px auto 0;
    width:100%;
    height:1px;
    background:repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 12px);
    opacity:.35;
  }

  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin:22px 0 14px;
    font-size:12px;
  }
  .toolbar .count{color:var(--slate);opacity:.75;}
  .newbtn{
    background:var(--wine);
    color:var(--paper);
    border:none;
    font-family:inherit;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:10px 16px;
    cursor:pointer;
    border-radius:2px;
  }
  .newbtn:hover{background:#682626;}

  .auth-control{
    display:flex;align-items:center;gap:8px;
    font-size:11px;color:var(--slate);
  }
  .auth-control form{display:flex;gap:6px;align-items:center;}
  .auth-control input[type=email], .auth-control input[type=password]{
    padding:6px 8px;font-size:13px;border:1px solid var(--line);border-radius:2px;
    background:var(--paper);color:var(--ink);width:120px;font-family:'Courier New', monospace;
  }
  .auth-control button{
    font-family:inherit;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    padding:6px 10px;cursor:pointer;border-radius:2px;
    border:1px solid var(--ink);background:transparent;color:var(--ink);
  }
  .auth-error{color:var(--wine);font-size:10px;}

  /* form ticket */
  .ticket{
    background:var(--paper);
    border:1px solid var(--line);
    padding:22px;
    margin-bottom:22px;
    position:relative;
    box-shadow:0 1px 2px rgba(0,0,0,.06);
    display:none;
  }
  .ticket.open{display:block;}
  .ticket::before, .ticket::after{
    content:"";
    position:absolute;
    left:0;right:0;
    height:10px;
    background:
      radial-gradient(circle 5px at 0 0, transparent 5px, var(--paper-dark) 5.5px) 0 0/16px 100% repeat-x;
  }
  .ticket::before{top:-6px;transform:rotate(180deg);}
  .ticket::after{bottom:-6px;}

  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--wine);
    margin-bottom:5px;
  }
  .field input, .field textarea, .field select{
    width:100%;
    font-family:inherit;
    font-size:14px;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    padding:6px 2px;
    color:var(--ink);
  }
  .field select{
    appearance:none;
    -webkit-appearance:none;
    -moz-appearance:none;
    border-radius:0;
    background-image:linear-gradient(45deg, transparent 50%, var(--slate) 50%), linear-gradient(135deg, var(--slate) 50%, transparent 50%);
    background-position: calc(100% - 14px) center, calc(100% - 9px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat:no-repeat;
    padding-right:24px;
  }
  .field input:focus, .field textarea:focus, .field select:focus{
    outline:none;
    border-bottom:1px solid var(--wine);
  }
  .field textarea{resize:vertical;min-height:54px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

  .dish-row{
    border-bottom:1px solid var(--line);
    padding-bottom:8px;
    margin-bottom:10px;
  }
  .dish-row-main{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:6px;
  }
  .dish-row-links{
    display:grid;
    grid-template-columns:1fr 1fr auto;
    gap:8px;
    align-items:center;
  }
  .dish-row-links-2{grid-template-columns:1fr auto;}
  .dish-row-links-1{display:flex;justify-content:flex-end;}
  .dish-row input, .dish-row select{
    font-family:inherit;font-size:13px;
    background:transparent;border:none;border-bottom:1px solid var(--line);
    padding:5px 2px;color:var(--ink);
    width:100%;
  }
  .dish-row select{
    appearance:none;
    -webkit-appearance:none;
    -moz-appearance:none;
    border-radius:0;
    background-image:linear-gradient(45deg, transparent 50%, var(--slate) 50%), linear-gradient(135deg, var(--slate) 50%, transparent 50%);
    background-position: calc(100% - 14px) center, calc(100% - 9px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat:no-repeat;
    padding-right:24px;
  }
  .dish-row input:focus, .dish-row select:focus{outline:none;border-bottom:1px solid var(--wine);}
  .dish-row input.dish-name{font-weight:600;}
  .dish-row select.dish-cheese{color:var(--slate);}
  .dish-rm{
    background:none;border:none;color:var(--slate);
    font-size:15px;cursor:pointer;padding:0 4px;line-height:1;
  }
  .dish-rm:hover{color:var(--wine);}
  .ghost-inline{
    font-family:inherit;font-size:11px;letter-spacing:.04em;
    color:var(--slate);background:none;border:none;cursor:pointer;
    text-decoration:underline;padding:2px 0;
  }
  .ghost-inline:hover{color:var(--wine);}

  .dish-list{margin-top:6px;}
  .dish-item{
    font-size:13px;line-height:1.6;color:var(--ink);
  }
  .dish-item .dish-item-note{color:var(--slate);}
  .dish-item .dish-cheese-link{

  }
  .dish-item .dish-photo-link{
    display:inline-block;vertical-align:middle;margin-left:5px;

  .form-actions button{
    font-family:inherit;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:9px 14px;
    cursor:pointer;
    border-radius:2px;
    border:1px solid var(--ink);

    border:1px solid var(--line);

    margin-bottom:14px;
    position:relative;
    text-align:left;

  .entry-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    text-align:left;
  }
  .entry-name{
    font-family:'adobe-caslon-pro', Georgia, 'Times New Roman', serif;
    font-style:italic;
    font-size:22px;
    text-align:left;
  }
  .entry-meta{
    font-size:11px;
    color:var(--slate);
    opacity:.8;
    margin-top:2px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;

  .entry-rating{color:var(--wine);font-size:14px;white-space:nowrap;}
  .entry-notes{
    margin-top:8px;
    font-size:13px;
    line-height:1.55;
    color:var(--ink);
    white-space:pre-wrap;
  }
  .entry-tags{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;}
  .tag{
    font-size:10px;
    border:1px solid var(--line);
    padding:3px 8px;
    border-radius:10px;
    color:var(--slate);
    letter-spacing:.04em;
  }
  .entry-actions{
    position:absolute;
    top:14px;right:16px;
    display:flex;gap:8px;

  .entry-actions button{
    background:none;border:none;
    font-family:inherit;
    font-size:11px;
    color:var(--slate);
    opacity:.5;
    cursor:pointer;
  }
  .entry-actions button:hover{opacity:1;color:var(--wine);}

  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--slate);
    opacity:.7;
    font-size:13px;
    line-height:1.7;
  }
  .empty .big{font-family:'adobe-caslon-pro', Georgia, 'Times New Roman', serif;font-style:italic;font-size:20px;display:block;margin-bottom:8px;opacity:1;color:var(--ink);}

  .loading{text-align:center;padding:40px;font-size:12px;color:var(--slate);}

  ::placeholder{color:var(--slate);opacity:.4;}

  /* entry photos + lightbox */
  .entry{cursor:pointer;}
  .entry-thumbs{
    display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;
  }
  .entry-thumbs img{
    width:56px;height:56px;object-fit:cover;
    border:1px solid var(--line);border-radius:2px;
  }

  .lightbox{
    display:none;
    position:fixed;inset:0;
    background:rgba(20,18,14,.88);
    z-index:100;
    align-items:flex-start;justify-content:center;
    overflow-y:auto;
    padding:40px 16px;
  }
  .lightbox.open{display:flex;}
  .lightbox-card{
    background:var(--paper);
    max-width:640px;width:100%;
    padding:24px;
    position:relative;
    border:1px solid var(--line);
  }
  .lightbox-close{
    position:absolute;top:12px;right:14px;
    background:none;border:none;
    font-family:inherit;font-size:13px;
    color:var(--slate);cursor:pointer;
  }
  .lightbox-close:hover{color:var(--wine);}
  .lightbox-copy-link{
    position:absolute;top:12px;left:14px;
    background:none;border:none;
    font-family:inherit;font-size:11px;
    color:var(--slate);cursor:pointer;
    letter-spacing:.04em;
  }
  .lightbox-copy-link:hover{color:var(--wine);}
  .lightbox-name{
    font-family:'adobe-caslon-pro', Georgia, 'Times New Roman', serif;
    font-style:italic;font-size:26px;margin-bottom:2px;
  }
  .lightbox-meta{
    font-size:11px;color:var(--slate);opacity:.8;
    display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;
  }
  .lightbox-photos{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:8px;margin-bottom:18px;
  }
  .lightbox-photos img{
    width:100%;height:140px;object-fit:cover;
    border:1px solid var(--line);border-radius:2px;
    cursor:zoom-in;
  }
  .lightbox-notes .lbl{
    color:var(--wine);font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;display:block;margin-bottom:4px;
  }
  .lightbox-notes{font-size:13px;line-height:1.55;margin-bottom:14px;}
  .note-block{margin-bottom:16px;}
  .note-block:last-child{margin-bottom:0;}
  .note-block p{margin:0;white-space:pre-wrap;}
  .note-photo{
    display:block;
    width:100%;max-height:280px;object-fit:cover;
    border:1px solid var(--line);border-radius:2px;
    margin-bottom:8px;cursor:zoom-in;
  }
  .lightbox-tags{display:flex;gap:6px;flex-wrap:wrap;}

  .photo-zoom{
    display:none;
    position:fixed;inset:0;
    background:rgba(0,0,0,.92);
    z-index:200;
    align-items:center;justify-content:center;
    padding:20px;
    cursor:zoom-out;
  }
  .photo-zoom.open{display:flex;}
  .photo-zoom img{max-width:100%;max-height:100%;object-fit:contain;}
</style>

<body>
<div class="wrap">
  <header>
    <div class="kicker"><a href="index.html">&larr; Warehouse</a> &middot; Est. In Practice</div>
    <h1>Restaurants</h1>

    <div id="authControl" class="auth-control" style="justify-content:center;margin-top:10px;"></div>
    <div class="rule"></div>
  </header>

  <div class="toolbar">
    <span class="count" id="count">loading…</span>

  <div class="ticket" id="ticket">
    <div class="field">

    <div class="row2">

      <div class="field">

    <div class="row2">
      <div class="field">
        <label>Price</label>
        <select id="f-price">
          <option value="">—</option>
          <option>$</option>
          <option>$$</option>
          <option>$$$</option>
          <option>$$$$</option>
        </select>
      </div>
      <div class="field">
        <label>Rating</label>
        <div class="stars" id="f-stars">
          <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
        </div>
      </div>
    </div>
    <div class="field">
      <label>Dishes had</label>

    <div class="field">
      <label>Cheeses had</label>
      <div id="cheesesList"></div>
      <button type="button" id="addCheeseBtn" class="ghost-inline">+ Add cheese</button>

      <label>Notes</label>

  <div id="entries" class="loading">loading…</div>
</div>

<div class="lightbox" id="lightbox">
  <div class="lightbox-card">
    <button class="lightbox-close" id="lightboxClose">close ✕</button>
    <button class="lightbox-copy-link" id="lightboxCopyLink">🔗 copy link</button>
    <div class="lightbox-name" id="lb-name"></div>
    <div class="lightbox-meta" id="lb-meta"></div>
    <div class="lightbox-photos" id="lb-photos"></div>
    <div class="lightbox-notes" id="lb-dishes-wrap" style="display:none;">
      <span class="lbl">Dishes</span><div id="lb-dishes"></div>
    </div>
    <div class="lightbox-notes" id="lb-wines-wrap" style="display:none;">
      <span class="lbl">Wines</span><div id="lb-wines"></div>
    </div>
    <div class="lightbox-notes" id="lb-cheeses-wrap" style="display:none;">
      <span class="lbl">Cheeses</span><div id="lb-cheeses"></div>
    </div>
    <div class="lightbox-notes" id="lb-notes-wrap" style="display:none;">
      <span class="lbl">Notes</span><span id="lb-notes"></span>

  </div>
</div>

<div class="photo-zoom" id="photoZoom">
  <img id="photoZoomImg" src="" alt="">
</div>

<script>
let entries = [];
let editingId = null;
let currentStars = 0;
let currentLightboxId = null; // entry currently shown in the lightbox, for the copy-link button
let currentDishes = []; // {name, note, cheeseUrl} — working copy for the open form's dish rows
let currentWines = []; // {name, note, wineUrl} — working copy for the open form's wine rows
let currentCheeses = []; // {name, note, cheeseUrl} — working copy for the open form's cheese rows

const $ = (id) => document.getElementById(id);

// Supabase-backed storage, shared with the rest of Warehouse, so entries
// sync across devices instead of being trapped in one browser. Falls back
// to localStorage if Supabase can't be reached, and to Claude's
// window.storage when running inside a Claude artifact.
const SUPABASE_URL = 'https://psbdjeyianlhfkgwwsvt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_fmEJD4dXEZF0elMTqgfhIg_nH-dCQn_';

const localStorageAdapter = {
  async get(key){
    const v = localStorage.getItem(key);
    if(v === null) throw new Error('not found');
    return {key, value: v};
  },
  async set(key, value){
    localStorage.setItem(key, value);
    return {key, value};
  },
  async delete(key){
    localStorage.removeItem(key);
    return {key, deleted: true};
  },
  async list(prefix){
    const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
    return {keys};
  }
};

let supabaseClient = null;

function makeSupabaseAdapter(){
  if(typeof window === 'undefined' || !window.supabase || !window.supabase.createClient){
    return null;
  }
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const client = supabaseClient;
  return {
    async get(key){
      const { data, error } = await client.from('kv_store').select('value').eq('key', key).maybeSingle();
      if(error) throw error;
      if(!data) throw new Error('not found');
      try{ localStorage.setItem(key, data.value); }catch(e){}
      return {key, value: data.value};
    },
    async set(key, value){
      const { error } = await client.from('kv_store').upsert({ key, value, updated_at: new Date().toISOString() });
      if(error) throw error;
      try{ localStorage.setItem(key, value); }catch(e){}
      return {key, value};
    },
    async delete(key){
      const { error } = await client.from('kv_store').delete().eq('key', key);
      if(error) throw error;
      try{ localStorage.removeItem(key); }catch(e){}
      return {key, deleted: true};
    },
    async list(prefix){
      let query = client.from('kv_store').select('key');
      if(prefix) query = query.like('key', prefix + '%');
      const { data, error } = await query;
      if(error) throw error;
      return { keys: (data||[]).map(r => r.key) };
    },
    // Fetches every key+value under a prefix in ONE request, instead of
    // list() + a get() per key. With hundreds of entries, one-request-per-
    // entry means hundreds of sequential round trips before the page can
    // render anything — this is what was making load slow.
    async listWithValues(prefix){
      let query = client.from('kv_store').select('key,value');
      if(prefix) query = query.like('key', prefix + '%');
      const { data, error } = await query;
      if(error) throw error;
      const items = data || [];
      try{
        for(const row of items) localStorage.setItem(row.key, row.value);
      }catch(e){ /* localStorage full/unavailable — safe to skip */ }
      return { items: items.map(r => ({ key: r.key, value: r.value })) };
    }
  };
}

// Priority: Claude artifact storage > Supabase > localStorage
const storage = (typeof window !== 'undefined' && window.storage)
  ? window.storage
  : (makeSupabaseAdapter() || localStorageAdapter);

// --- Auth: read is public, only a signed-in session can add/edit/delete ---
let currentUser = null;

function renderAuthControl(){
  const el = document.getElementById('authControl');
  if(!supabaseClient){
    el.innerHTML = '';
    return;
  }
  if(currentUser){
    el.innerHTML = `
      <span>${currentUser.email}</span>
      <button id="signOutBtn">Sign out</button>`;
    document.getElementById('signOutBtn').addEventListener('click', async ()=>{
      await supabaseClient.auth.signOut();
    });
  } else {
    el.innerHTML = `
      <form id="signInForm">
        <input type="email" id="authEmail" placeholder="Email" required>
        <input type="password" id="authPassword" placeholder="Password" required>
        <button type="submit">Sign in</button>
      </form>
      <span class="auth-error" id="authError"></span>`;
    document.getElementById('signInForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      document.getElementById('authError').textContent = error ? 'Sign in failed' : '';
    });
  }
}

function applyAuthGating(){
  const loggedIn = !supabaseClient || !!currentUser; // if no Supabase, don't block (local/artifact mode)
  const newBtn = document.getElementById('toggleForm');
  if(newBtn) newBtn.style.display = loggedIn ? '' : 'none';
  document.querySelectorAll('.entry-actions').forEach(el=>{
    el.style.display = loggedIn ? '' : 'none';
  });
}

if(supabaseClient){
  supabaseClient.auth.getSession().then(({data})=>{
    currentUser = data.session ? data.session.user : null;
    renderAuthControl();
    applyAuthGating();
  });
  supabaseClient.auth.onAuthStateChange((_event, session)=>{
    currentUser = session ? session.user : null;
    renderAuthControl();
    applyAuthGating();
  });
} else {
  renderAuthControl();
}

function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

function starsHtml(n){
  let s = '';
  for(let i=1;i<=5;i++) s += i<=n ? '★' : '☆';
  return s;
}

function render(){
  const wrap = $('entries');
  $('count').textContent = entries.length === 0 ? 'no entries yet' :
    entries.length + (entries.length === 1 ? ' entry logged' : ' entries logged');

  if(entries.length === 0){
    wrap.innerHTML = `<div class="empty"><span class="big">The list is empty.</span>Log the first table.</div>`;
    applyAuthGating();
    return;
  }

  const sorted = [...entries].sort((a,b) => (b.date||'').localeCompare(a.date||''));

  wrap.innerHTML = sorted.map(e => `
    <div class="entry" data-id="${e.id}">
      <div class="entry-actions">
        <button class="editBtn">edit</button>
        <button class="delBtn">delete</button>
      </div>
      <div class="entry-top">
        <div>
          <div class="entry-name">${escapeHtml(e.name || 'Untitled')}</div>
          <div class="entry-meta">
            ${e.date ? `<span>${fmtDate(e.date)}</span>` : ''}
            ${e.place ? `<span>${escapeHtml(e.place)}</span>` : ''}
          </div>
        </div>
        ${e.rating ? `<div class="entry-rating">${starsHtml(e.rating)}</div>` : ''}
      </div>
      ${renderDishItemsHtml(e)}
      ${renderWineItemsHtml(e)}
      ${renderCheeseItemsHtml(e)}
      ${e.notes ? `<div class="entry-notes">${escapeHtml(stripPhotoTags(e.notes))}</div>` : ''}
      ${(e.photos && e.photos.length) ? `<div class="entry-thumbs">${e.photos.map(p=>`<img src="${photoUrl(p)}" alt="">`).join('')}</div>` : ''}
      ${(e.tags && e.tags.length) ? `<div class="entry-tags">${e.tags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
    </div>
  `).join('');

  wrap.querySelectorAll('.editBtn').forEach(btn=>{
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = e.target.closest('.entry').dataset.id;
      openForEdit(id);
    });
  });
  wrap.querySelectorAll('.delBtn').forEach(btn=>{
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const id = e.target.closest('.entry').dataset.id;
      if(confirm('Remove this entry?')){
        await deleteEntry(id);
      }
    });
  });
  wrap.querySelectorAll('.entry').forEach(card=>{
    card.addEventListener('click', e => {
      openLightbox(card.dataset.id);
    });
  });
  applyAuthGating();
}

function photoUrl(p){
  return (p && typeof p === 'object') ? p.url : p;
}

// Only allow http(s) URLs through as href values — guards against
// javascript: or other schemes sneaking into a pasted link field.
function safeUrl(u){
  if(!u) return null;
  const s = u.trim();
  if(/^https?:\/\//i.test(s)) return s;
  return null;
}

// Dish rows are built via DOM APIs (createElement + .value), not innerHTML
// string interpolation — escapeHtml() below doesn't escape quote
// characters, which is fine for text nodes but unsafe inside a value="..."
// attribute, so building elements directly sidesteps that entirely.

// Cheese options for the dish-row dropdown, fetched via the lightweight
// list_kv_names() RPC (name + key only — no photos, unlike a full cheese
// entry) so opening this form doesn't pull every cheese photo over the
// wire just to build a picker. Refetched each time the form opens, so a
// just-added cheese shows up without a full page reload.
let cheeseOptions = []; // {id, name}

async function refreshCheeseOptions(){
  cheeseOptions = [];
  if(!supabaseClient) return; // no live Supabase (local/artifact mode) — dropdown stays empty, still usable
  try{
    const { data, error } = await supabaseClient.rpc('list_kv_names', { prefix: 'cheese:' });
    if(error) throw error;
    cheeseOptions = (data || [])
      .map(r => ({ id: r.key.replace(/^cheese:/, ''), name: r.name || 'Untitled' }))
      .sort((a,b) => a.name.localeCompare(b.name));
  }catch(err){
    console.error('Could not load cheese list for the dish dropdown', err);
  }
}

// Creates a genuinely new Cheese entry (same schema cheese.html writes,
// same 'cheese:' key prefix) directly in the shared kv_store — not just a
// local label in this dropdown. Requires being signed in, same as every
// other write in this suite (RLS: public SELECT, authenticated
// INSERT/UPDATE/DELETE), so a failure here is most likely an auth issue.
async function createNewCheese(name){
  if(!supabaseClient) throw new Error('Not connected to Supabase');
  const id = 'c' + Date.now() + Math.random().toString(36).slice(2,7);
  const entry = {
    id, name,
    photos: [],
    producer: '', producerUrl: '',
    cheesemaker: '',
    cheesemonger: '', cheesemongerUrl: '',
    milkType: '', age: '', wrapped: '', wrappedDesc: '',
    region: '', country: '',
    restaurant: '', restaurantUrl: '',
    date: new Date().toISOString().slice(0,10),
    comment: ''
  };
  // If this restaurant entry has already been saved (has a stable id), fill
  // in the new cheese's Restaurant back-link automatically — it completes
  // the reciprocal connection for free. A brand-new, not-yet-saved entry
  // has no stable URL to give it yet, so this is skipped in that case.
  if(editingId){
    entry.restaurant = $('f-name').value.trim();
    entry.restaurantUrl = location.origin + location.pathname.replace(/restaurants\.html$/, '') + 'restaurants.html#' + editingId;
  }
  const { error } = await supabaseClient
    .from('kv_store')
    .upsert({ key: 'cheese:' + id, value: JSON.stringify(entry), updated_at: new Date().toISOString() });
  if(error) throw error;
  return { id, name };
}

// Resolves an entry's dishes for display, whether it has the new
// structured dishItems array or only the old flat comma-separated
// `dishes` string (kept, never migrated in the database, so nothing
// existing is lost or silently rewritten).
function dishItemsOf(e){
  if(e.dishItems && e.dishItems.length) return e.dishItems;
  if(e.dishes) return e.dishes.split(/,\s*/).filter(Boolean).map(name => ({name}));

    </div>`;
  }).join('')}</div>`;

function stripPhotoTags(notes){
  return notes.replace(/\(photo:\s*[^)]+\)\s*/gi, '');
}

function renderNotesWithPhotos(e){
  if(!e.notes) return { html: '', leftoverPhotos: (e.photos || []) };

  const photos = e.photos || [];
  const used = new Set();
  const photoTagRe = /^\(photo:\s*([^)]+)\)\s*/i;

  const paragraphs = e.notes.split(/\n\n+/);

  const html = paragraphs.map(para => {
    const m = para.match(photoTagRe);
    let imgHtml = '';
    let text = para;

    if(m){
      text = para.slice(m[0].length);
      const wanted = m[1].trim().toLowerCase();
      let matchIdx = -1;
      photos.forEach((p, i) => {
        if(matchIdx !== -1 || used.has(i)) return;
        const cap = (p && typeof p === 'object' && p.caption) ? p.caption.toLowerCase() : '';
        if(cap && (cap.includes(wanted) || wanted.includes(cap))) matchIdx = i;
      });
      if(matchIdx !== -1){
        used.add(matchIdx);
        imgHtml = `<img class="note-photo" src="${photoUrl(photos[matchIdx])}" alt="">`;
      }
    }

    const textHtml = text.trim() ? `<p>${escapeHtml(text.trim())}</p>` : '';
    return `<div class="note-block">${imgHtml}${textHtml}</div>`;
  }).join('');

  const leftoverPhotos = photos.filter((_, i) => !used.has(i));
  return { html, leftoverPhotos };
}

function openLightbox(id){
  const e = entries.find(x => x.id === id);
  if(!e) return;
  currentLightboxId = id;

  $('lb-name').textContent = e.name || 'Untitled';

  const metaBits = [];
  if(e.date) metaBits.push(fmtDate(e.date));
  if(e.place) metaBits.push(e.place);
  if(e.rating) metaBits.push(starsHtml(e.rating));
  $('lb-meta').innerHTML = metaBits.map(m => `<span>${m}</span>`).join('');

  const { html: notesHtml, leftoverPhotos } = renderNotesWithPhotos(e);

  const dishItems = dishItemsOf(e);
  if(dishItems.length){
    $('lb-dishes-wrap').style.display = 'block';
    $('lb-dishes').innerHTML = renderDishItemsHtml(e);
  } else {
    $('lb-dishes-wrap').style.display = 'none';
  }

  const wineItems = wineItemsOf(e);
  if(wineItems.length){
    $('lb-wines-wrap').style.display = 'block';
    $('lb-wines').innerHTML = renderWineItemsHtml(e);
  } else {
    $('lb-wines-wrap').style.display = 'none';
  }

  const cheeseItems = cheeseItemsOf(e);
  if(cheeseItems.length){
    $('lb-cheeses-wrap').style.display = 'block';
    $('lb-cheeses').innerHTML = renderCheeseItemsHtml(e);
  } else {
    $('lb-cheeses-wrap').style.display = 'none';
  }

  if(e.notes){
    $('lb-notes-wrap').style.display = 'block';
    $('lb-notes').innerHTML = notesHtml;
  } else {
    $('lb-notes-wrap').style.display = 'none';
  }

  const photosWrap = $('lb-photos');
  if(leftoverPhotos && leftoverPhotos.length){
    photosWrap.style.display = 'grid';
    photosWrap.innerHTML = leftoverPhotos.map(p => `<img src="${photoUrl(p)}" alt="">`).join('');
  } else {
    photosWrap.style.display = 'none';
    photosWrap.innerHTML = '';
  }

  $('lightbox').querySelectorAll('.note-photo, #lb-photos img').forEach(img=>{
    img.addEventListener('click', ev => {
      ev.stopPropagation();
      openPhotoZoom(img.src);
    });
  });

  $('lb-tags').innerHTML = (e.tags && e.tags.length)
    ? e.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')
    : '';

  $('lightbox').classList.add('open');
}

function closeLightbox(){
  $('lightbox').classList.remove('open');
  currentLightboxId = null;
}

$('lightboxCopyLink').addEventListener('click', async e => {
  e.stopPropagation();
  if(!currentLightboxId) return;
  const url = location.origin + location.pathname + '#' + currentLightboxId;
  const btn = $('lightboxCopyLink');
  try{
    await navigator.clipboard.writeText(url);
    btn.textContent = '✓ copied';
  }catch(err){
    // Clipboard API can be blocked (permissions, non-HTTPS, older Safari) —
    // fall back to showing the URL so it can be copied by hand.
    prompt('Copy this link:', url);
  }
  setTimeout(()=>{ btn.textContent = '🔗 copy link'; }, 1500);
});

// Deep link: if the page was opened with #<entryId> (e.g. pasted from
// another Warehouse app's "link to this restaurant visit" field), open
// that entry's lightbox automatically once entries have loaded.
function openFromHash(){
  const id = location.hash.replace(/^#/, '');
  if(id && entries.some(e => e.id === id)){
    openLightbox(id);
    document.querySelector(`.entry[data-id="${id}"]`)?.scrollIntoView({behavior:'smooth', block:'center'});
  }
}

function openPhotoZoom(src){
  $('photoZoomImg').src = src;
  $('photoZoom').classList.add('open');
}

function closePhotoZoom(){
  $('photoZoom').classList.remove('open');
  $('photoZoomImg').src = '';
}

$('lightboxClose').addEventListener('click', e => {
  e.stopPropagation();
  closeLightbox();
});
$('lightbox').addEventListener('click', e => {
  if(e.target.id === 'lightbox') closeLightbox();
});
$('photoZoom').addEventListener('click', closePhotoZoom);
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    closePhotoZoom();
    closeLightbox();
  }
});

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function resetForm(){
  $('f-name').value='';
  $('f-place').value='';
  $('f-date').value=new Date().toISOString().slice(0,10);
  $('f-price').value='';
  currentDishes = [];
  renderDishesList();
  currentWines = [];
  renderWinesList();
  currentCheeses = [];
  renderCheesesList();
  // Cheese/wine options are fetched async so opening the form never waits
  // on a network round trip; re-render in place once they land. Reads
  // whatever was typed in the meantime first, so a fast typer doesn't
  // lose input.
  refreshCheeseOptions().then(() => { readCheesesFromDom(); renderCheesesList(); });
  refreshWineOptions().then(() => { readWinesFromDom(); renderWinesList(); });
  $('f-notes').value='';
  $('f-tags').value='';
  setStars(0);
  editingId = null;
}

function setStars(n){
  currentStars = n;
  document.querySelectorAll('#f-stars span').forEach(s=>{
    s.classList.toggle('on', parseInt(s.dataset.v) <= n);
  });
}

function openForEdit(id){
  const e = entries.find(x=>x.id===id);
  if(!e) return;
  editingId = id;
  $('f-name').value = e.name || '';
  $('f-place').value = e.place || '';
  $('f-date').value = e.date || '';
  $('f-price').value = e.price || '';
  // Structured dishItems if present; otherwise convert the legacy flat
  // `dishes` string into rows as an editable starting point — nothing is
  // silently discarded or auto-migrated in the database, this only
  // affects what you see when you open the form.
  currentDishes = (e.dishItems && e.dishItems.length)
    ? e.dishItems.map(d => ({...d}))
    : (e.dishes ? e.dishes.split(/,\s*/).filter(Boolean).map(name => ({name, note:'', cheeseUrl:'', photoUrl:''})) : []);
  renderDishesList();
  currentWines = (e.wineItems && e.wineItems.length) ? e.wineItems.map(w => ({...w})) : [];
  renderWinesList();
  // Structured cheeseItems if present; otherwise pull forward any cheese
  // links still sitting on individual dishes from before Cheese moved out
  // into its own section, so the connection isn't lost on first re-edit.
  currentCheeses = (e.cheeseItems && e.cheeseItems.length)
    ? e.cheeseItems.map(c => ({...c}))
    : (e.dishItems || []).filter(d => d.cheeseUrl).map(d => ({ name: '', cheeseUrl: d.cheeseUrl, note: d.name ? `From dish: ${d.name}` : '' }));
  renderCheesesList();
  refreshCheeseOptions().then(() => { readCheesesFromDom(); renderCheesesList(); });
  refreshWineOptions().then(() => { readWinesFromDom(); renderWinesList(); });
  $('f-notes').value = e.notes || '';
  $('f-tags').value = (e.tags||[]).join(', ');
  setStars(e.rating || 0);
  $('ticket').classList.add('open');
  $('ticket').scrollIntoView({behavior:'smooth', block:'start'});
}

async function loadEntries(){
  try{
    // Scoped to 'entry:e' — NOT the bare 'entry:' prefix. Restaurant entry
    // ids always start with 'e' (see saveEntry's id generation below), but
    // Music's entries also live in this same shared kv_store table under
    // 'entry:m-...'. A bare 'entry:' prefix here would match both, silently
    // pulling every Music track into this app's own entry list (this
    // actually happened — it's what was surfacing as "Untitled" cards).
    if(storage.listWithValues){
      // Fast path: one request for everything.
      const result = await storage.listWithValues('entry:e');
      entries = (result.items || [])
        .map(it => { try{ return JSON.parse(it.value); }catch(e){ return null; } })
        .filter(Boolean);
      render();
      return;
    }
    // Fallback for storage backends without a batch method (Claude artifact
    // storage, plain localStorage) — one request per entry.
    const result = await storage.list('entry:e');
    if(!result || !result.keys || result.keys.length === 0){
      entries = [];
      render();
      return;
    }
    const loaded = [];
    for(const key of result.keys){
      try{
        const r = await storage.get(key);
        if(r && r.value){
          loaded.push(JSON.parse(r.value));
        }
      }catch(err){ /* skip missing */ }
    }
    entries = loaded;
  }catch(err){
    entries = [];
  }
  render();
}

async function saveEntry(){
  const name = $('f-name').value.trim();
  if(!name){
    $('f-name').focus();
    return;
  }
  const id = editingId || ('e' + Date.now() + Math.random().toString(36).slice(2,7));
  const tags = $('f-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  readDishesFromDom();
  const dishItems = currentDishes.filter(d => d.name);
  readWinesFromDom();
  const wineItems = currentWines.filter(w => w.name);
  readCheesesFromDom();
  const cheeseItems = currentCheeses.filter(c => c.cheeseUrl);
  const entry = {
    id,
    name,
    place: $('f-place').value.trim(),
    date: $('f-date').value,
    price: $('f-price').value,
    rating: currentStars,
    dishItems,
    wineItems,
    cheeseItems,
    notes: $('f-notes').value.trim(),
    tags
  };
  try{
    await storage.set('entry:' + id, JSON.stringify(entry));
    if(editingId){
      const idx = entries.findIndex(e=>e.id===id);
      if(idx>-1) entries[idx] = entry; else entries.push(entry);
    } else {
      entries.push(entry);
    }
    render();
    closeForm();
  }catch(err){
    alert('Could not save entry. Please try again.');
    console.error(err);
  }
}

async function deleteEntry(id){
  try{
    await storage.delete('entry:' + id);
    entries = entries.filter(e=>e.id!==id);
    render();
  }catch(err){
    alert('Could not delete entry. Please try again.');
    console.error(err);
  }
}

function closeForm(){
  $('ticket').classList.remove('open');
  resetForm();
}

$('toggleForm').addEventListener('click', () => {
  const t = $('ticket');
  if(t.classList.contains('open')){
    closeForm();
  } else {
    resetForm();
    t.classList.add('open');
    t.scrollIntoView({behavior:'smooth', block:'start'});
    $('f-name').focus();
  }
});
$('cancelBtn').addEventListener('click', closeForm);
$('saveBtn').addEventListener('click', saveEntry);
document.querySelectorAll('#f-stars span').forEach(s=>{
  s.addEventListener('click', () => setStars(parseInt(s.dataset.v)));
});

loadEntries().then(openFromHash);
</script>
</body>
</html>

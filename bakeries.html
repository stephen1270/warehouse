<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bakeries</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://use.typekit.net/vvc0ewr.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="common.js"></script>
<style>
  :root{
    --paper:#f4f1e8;
    --paper-dark:#e9e4d5;
    --ink:#2a2b26;
    --wine:#7c2e2e;
    --brass:#a6813f;
    --slate:#3f4a44;
    --line:#c9c2ab;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper-dark);
    color:var(--ink);
    font-family:'Courier New', ui-monospace, monospace;
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px 80px;}

  header{
    text-align:center;
    margin-bottom:28px;
    position:relative;
  }
  header .kicker{
    letter-spacing:.28em;
    font-size:11px;
    color:var(--wine);
    text-transform:uppercase;
  }
  header .kicker a{color:inherit;text-decoration:none;}
  header .kicker a:hover{text-decoration:underline;}
  header h1{
    font-family:'adobe-caslon-pro', Georgia, 'Times New Roman', serif;
    font-weight:400;
    font-style:italic;
    font-size:44px;
    margin:6px 0 4px;
    letter-spacing:.01em;
  }
  header .sub{
    font-size:12px;
    color:var(--slate);
    opacity:.75;
  }
  header .rule{
    margin:18px auto 0;
    width:100%;
    height:1px;
    background:repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 12px);
    opacity:.35;
  }

  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin:22px 0 14px;
    font-size:12px;
    gap:14px;
    flex-wrap:wrap;
  }
  .toolbar .count{color:var(--slate);opacity:.75;flex:none;}
  .toolbar #search{
    flex:1;min-width:160px;
    font-family:inherit;font-size:13px;
    background:transparent;border:none;
    border-bottom:1px solid var(--line);
    padding:4px 2px;color:var(--ink);
  }
  .toolbar #search:focus{outline:none;border-bottom:1px solid var(--wine);}
  .toolbar #search::placeholder{color:var(--slate);opacity:.5;}
  .newbtn{
    background:var(--wine);
    color:var(--paper);
    border:none;
    font-family:inherit;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:10px 16px;
    cursor:pointer;
    border-radius:2px;
  }
  .newbtn:hover{background:#682626;}

  .auth-control{
    display:flex;align-items:center;gap:8px;
    font-size:11px;color:var(--slate);
  }
  .auth-control form{display:flex;gap:6px;align-items:center;}
  .auth-control input[type=email], .auth-control input[type=password]{
    padding:6px 8px;font-size:13px;border:1px solid var(--line);border-radius:2px;
    background:var(--paper);color:var(--ink);width:120px;font-family:'Courier New', monospace;
  }
  .auth-control button{
    font-family:inherit;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    padding:6px 10px;cursor:pointer;border-radius:2px;
    border:1px solid var(--ink);background:transparent;color:var(--ink);
  }
  .auth-error{color:var(--wine);font-size:10px;}

  /* form ticket */
  .ticket{
    background:var(--paper);
    border:1px solid var(--line);
    padding:22px;
    margin-bottom:22px;
    position:relative;
    box-shadow:0 1px 2px rgba(0,0,0,.06);
    display:none;
  }
  .ticket.open{display:block;}
  .ticket::before, .ticket::after{
    content:"";
    position:absolute;
    left:0;right:0;
    height:10px;
    background:
      radial-gradient(circle 5px at 0 0, transparent 5px, var(--paper-dark) 5.5px) 0 0/16px 100% repeat-x;
  }
  .ticket::before{top:-6px;transform:rotate(180deg);}
  .ticket::after{bottom:-6px;}

  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--wine);
    margin-bottom:5px;
  }
  .field input, .field textarea, .field select{
    width:100%;
    font-family:inherit;
    font-size:14px;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    padding:6px 2px;
    color:var(--ink);
  }
  .field select{
    appearance:none;
    -webkit-appearance:none;
    -moz-appearance:none;
    border-radius:0;
    background-image:linear-gradient(45deg, transparent 50%, var(--slate) 50%), linear-gradient(135deg, var(--slate) 50%, transparent 50%);
    background-position: calc(100% - 14px) center, calc(100% - 9px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat:no-repeat;
    padding-right:24px;
  }
  .field input:focus, .field textarea:focus, .field select:focus{
    outline:none;
    border-bottom:1px solid var(--wine);
  }
  .field textarea{resize:vertical;min-height:54px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

  .autofill-field{
    background:var(--paper-dark);
    border:1px dashed var(--line);
    padding:14px 16px;
    border-radius:3px;
    margin-bottom:20px;
  }
  .autofill-row{display:flex;gap:8px;}
  .autofill-row input{flex:1;}
  .autofill-row button{
    font-family:inherit;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    padding:8px 14px;cursor:pointer;border-radius:2px;white-space:nowrap;
    border:1px solid var(--wine);background:var(--wine);color:var(--paper);
  }
  .autofill-row button:hover{background:#7a1420;}
  .autofill-row button:disabled{opacity:.5;cursor:default;}
  .field-hint{font-size:10px;color:var(--slate);opacity:.8;margin-top:4px;}
  #autofillStatus.err{color:var(--wine);}
  #autofillStatus.ok{color:var(--slate);}

  .location-picker{
    margin-top:10px;
    border-top:1px solid var(--line);
    padding-top:10px;
  }
  .location-picker .lp-label{
    font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--wine);margin-bottom:6px;display:block;
  }
  .location-picker button{
    display:block;width:100%;text-align:left;
    font-family:inherit;font-size:13px;
    background:var(--paper);border:1px solid var(--line);
    padding:8px 10px;margin-bottom:6px;cursor:pointer;color:var(--ink);
    border-radius:2px;
  }
  .location-picker button:hover{border-color:var(--wine);color:var(--wine);}
  .location-picker button.lp-skip{
    color:var(--slate);font-style:italic;border-style:dashed;
  }

  .dish-row{
    border-bottom:1px solid var(--line);
    padding-bottom:8px;
    margin-bottom:10px;
  }
  .dish-row-main{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:6px;
  }
  .dish-row-links{
    display:grid;
    grid-template-columns:1fr 1fr auto;
    gap:8px;
    align-items:center;
  }
  .dish-row-links-2{grid-template-columns:1fr auto;}
  .dish-row-links-1{display:flex;justify-content:flex-end;}

  .dish-photo-wrap{
    display:flex;align-items:center;gap:6px;
    min-width:0;
  }
  .dish-photo-wrap input.dish-photo{flex:1;min-width:0;}
  .dish-photo-upload{
    background:none;border:none;color:var(--slate);
    font-size:15px;cursor:pointer;padding:2px 4px;line-height:1;flex:none;
  }
  .dish-photo-upload:hover{color:var(--wine);}
  .dish-photo-thumb-preview{
    width:26px;height:26px;object-fit:cover;border-radius:2px;
    border:1px solid var(--line);flex:none;
  }
  .dish-photo-clear{
    background:none;border:none;color:var(--slate);
    font-size:13px;cursor:pointer;padding:0 2px;line-height:1;flex:none;
  }
  .dish-photo-clear:hover{color:var(--wine);}

  .attachment-item{
    display:flex;align-items:center;gap:10px;
    padding:6px 0;border-bottom:1px solid var(--line);
  }
  .attachment-item img.attachment-thumb{
    width:36px;height:36px;object-fit:cover;border-radius:2px;
    border:1px solid var(--line);flex:none;
  }
  .attachment-item .attachment-pdf-icon{
    width:36px;height:36px;flex:none;
    display:flex;align-items:center;justify-content:center;
    background:var(--paper-dark);border:1px solid var(--line);border-radius:2px;
    font-size:11px;letter-spacing:.02em;color:var(--wine);font-weight:bold;
  }
  .attachment-item .attachment-open{
    flex:none;font-size:15px;text-decoration:none;line-height:1;
    padding:0 2px;
  }
  .attachment-item .attachment-name-input{
    flex:1;min-width:0;font-size:13px;color:var(--ink);
    font-family:inherit;background:transparent;
    border:none;border-bottom:1px solid var(--line);
    padding:4px 2px;
  }
  .attachment-item .attachment-name-input:focus{outline:none;border-color:var(--wine);}
  .attachment-item .attachment-remove{
    background:none;border:none;color:var(--slate);
    font-size:15px;cursor:pointer;padding:0 4px;line-height:1;flex:none;
  }
  .attachment-item .attachment-remove:hover{color:var(--wine);}
  .dish-row input, .dish-row select{
    font-family:inherit;font-size:13px;
    background:transparent;border:none;border-bottom:1px solid var(--line);
    padding:5px 2px;color:var(--ink);
    width:100%;
  }
  .dish-row select{
    appearance:none;
    -webkit-appearance:none;
    -moz-appearance:none;
    border-radius:0;
    background-image:linear-gradient(45deg, transparent 50%, var(--slate) 50%), linear-gradient(135deg, var(--slate) 50%, transparent 50%);
    background-position: calc(100% - 14px) center, calc(100% - 9px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat:no-repeat;
    padding-right:24px;
  }
  .dish-row input:focus, .dish-row select:focus{outline:none;border-bottom:1px solid var(--wine);}
  .dish-row input.dish-name{font-weight:600;}
  .dish-row select.dish-cheese{color:var(--slate);}
  .dish-rm{
    background:none;border:none;color:var(--slate);
    font-size:15px;cursor:pointer;padding:0 4px;line-height:1;
  }
  .dish-rm:hover{color:var(--wine);}
  .dish-row-links .dish-cheese-link{
    text-decoration:none;font-size:15px;line-height:1;
    display:inline-flex;align-items:center;padding:0 2px;
  }
  .ghost-inline{
    font-family:inherit;font-size:11px;letter-spacing:.04em;
    color:var(--slate);background:none;border:none;cursor:pointer;
    text-decoration:underline;padding:2px 0;
  }
  .ghost-inline:hover{color:var(--wine);}
  .add-row-choices{display:flex;gap:14px;flex-wrap:wrap;}

  .dish-list{margin-top:6px;}
  .dish-item{
    font-size:13px;line-height:1.6;color:var(--ink);
  }
  .dish-item .dish-item-note{color:var(--slate);}
  .dish-item .dish-cheese-link{
    margin-left:5px;text-decoration:none;font-size:12px;
  }
  .dish-item .dish-photo-link{
    display:inline-block;vertical-align:middle;margin-left:5px;
  }
  .dish-item .dish-photo-thumb{
    width:22px;height:22px;object-fit:cover;border-radius:2px;
    vertical-align:middle;border:1px solid var(--line);cursor:zoom-in;
  }

  .stars{display:flex;gap:4px;font-size:20px;cursor:pointer;user-select:none;}
  .stars span{opacity:.25;transition:opacity .1s;}
  .stars span.on{opacity:1;color:var(--wine);}

  .form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;}
  .form-actions button{
    font-family:inherit;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:9px 14px;
    cursor:pointer;
    border-radius:2px;
    border:1px solid var(--ink);
    background:transparent;
    color:var(--ink);
  }
  .form-actions button.save{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  /* entries */
  .entry{
    background:var(--paper);
    border:1px solid var(--line);
    padding:18px 20px;
    margin-bottom:14px;
    position:relative;
    text-align:left;
  }
  .entry-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    text-align:left;
  }
  .entry-name{
    font-family:'adobe-caslon-pro', Georgia, 'Times New Roman', serif;
    font-style:italic;
    font-size:22px;
    text-align:left;
  }
  .entry-name a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line);}
  .entry-name a:hover{border-color:var(--wine);color:var(--wine);}
  .entry-meta{
    font-size:11px;
    color:var(--slate);
    opacity:.8;
    margin-top:2px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .entry-rating{color:var(--wine);font-size:14px;white-space:nowrap;}
  .entry-notes{
    margin-top:8px;
    font-size:13px;
    line-height:1.55;
    color:var(--ink);
    white-space:pre-wrap;
  }
  .entry-tags{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;}
  .tag{
    font-size:10px;
    border:1px solid var(--line);
    padding:3px 8px;
    border-radius:10px;
    color:var(--slate);
    letter-spacing:.04em;
  }
  .entry-actions{
    position:absolute;
    top:14px;right:16px;
    display:flex;gap:8px;
  }
  .entry-actions button{
    background:none;border:none;
    font-family:inherit;
    font-size:11px;
    color:var(--slate);
    opacity:.5;
    cursor:pointer;
  }
  .entry-actions button:hover{opacity:1;color:var(--wine);}

  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--slate);
    opacity:.7;
    font-size:13px;
    line-height:1.7;
  }
  .empty .big{font-family:'adobe-caslon-pro', Georgia, 'Times New Roman', serif;font-style:italic;font-size:20px;display:block;margin-bottom:8px;opacity:1;color:var(--ink);}

  .loading{text-align:center;padding:40px;font-size:12px;color:var(--slate);}

  ::placeholder{color:var(--slate);opacity:.4;}

  /* entry photos + lightbox */
  .entry{cursor:pointer;}
  .entry-thumbs{
    display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;
  }
  .entry-thumbs img{
    width:56px;height:56px;object-fit:cover;
    border:1px solid var(--line);border-radius:2px;
  }

  .lightbox{
    display:none;
    position:fixed;inset:0;
    background:rgba(20,18,14,.88);
    z-index:100;
    align-items:flex-start;justify-content:center;
    overflow-y:auto;
    padding:40px 16px;
  }
  .lightbox.open{display:flex;}
  .lightbox-card{
    background:var(--paper);
    max-width:640px;width:100%;
    padding:24px;
    position:relative;
    border:1px solid var(--line);
  }
  .lightbox-close{
    position:absolute;top:12px;right:14px;
    background:none;border:none;
    font-family:inherit;font-size:13px;
    color:var(--slate);cursor:pointer;
  }
  .lightbox-close:hover{color:var(--wine);}
  .lightbox-copy-link{
    position:absolute;top:12px;left:14px;
    background:none;border:none;
    font-family:inherit;font-size:11px;
    color:var(--slate);cursor:pointer;
    letter-spacing:.04em;
  }
  .lightbox-copy-link:hover{color:var(--wine);}
  .lightbox-name{
    font-family:'adobe-caslon-pro', Georgia, 'Times New Roman', serif;
    font-style:italic;font-size:26px;margin-bottom:2px;
  }
  .lightbox-name a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line);}
  .lightbox-name a:hover{border-color:var(--wine);color:var(--wine);}
  .lightbox-meta{
    font-size:11px;color:var(--slate);opacity:.8;
    display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;
  }
  .lightbox-photos{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:8px;margin-bottom:18px;
  }
  .lightbox-photos img{
    width:100%;height:140px;object-fit:cover;
    border:1px solid var(--line);border-radius:2px;
    cursor:zoom-in;
  }
  .lightbox-notes .lbl{
    color:var(--wine);font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;display:block;margin-bottom:4px;
  }
  .lightbox-notes{font-size:13px;line-height:1.55;margin-bottom:14px;}
  .visit-block{padding-top:14px;border-top:1px solid var(--line);margin-bottom:18px;}
  .visit-block:first-child{padding-top:0;border-top:none;}
  .visit-block .entry-actions button{font-size:10px;}
  .note-block{margin-bottom:16px;}
  .note-block:last-child{margin-bottom:0;}
  .note-block p{margin:0;white-space:pre-wrap;}
  .note-photo{
    display:block;
    width:100%;max-height:280px;object-fit:cover;
    border:1px solid var(--line);border-radius:2px;
    margin-bottom:8px;cursor:zoom-in;
  }
  .lightbox-tags{display:flex;gap:6px;flex-wrap:wrap;}

  .photo-zoom{
    display:none;
    position:fixed;inset:0;
    background:rgba(0,0,0,.92);
    z-index:200;
    align-items:center;justify-content:center;
    padding:20px;
    cursor:zoom-out;
  }
  .photo-zoom.open{display:flex;}
  .photo-zoom img{max-width:100%;max-height:100%;object-fit:contain;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker"><a href="index.html">&larr; Warehouse</a> &middot; Est. In Practice</div>
    <h1>Bakeries</h1>
    <div class="sub">a running record of loaves, laminated things, and slices</div>
    <div id="authControl" class="auth-control" style="justify-content:center;margin-top:10px;"></div>
    <div class="rule"></div>
  </header>

  <div class="toolbar">
    <span class="count" id="count">loading…</span>
    <input type="text" id="search" placeholder="Search by bakery, place, or tag…">
    <button class="newbtn" id="toggleForm">+ New Entry</button>
  </div>

  <div class="ticket" id="ticket">
    <div class="field autofill-field">
      <label>Autofill from URL</label>
      <div class="autofill-row">
        <input id="f-autofillUrl" type="text" placeholder="the-bakery.com or a listing page">
        <button type="button" id="autofillBtn">Fetch</button>
      </div>
      <div class="field-hint" id="autofillStatus">Pulls whatever it can find — works best on a bakery's own site; review everything before saving.</div>
      <div class="location-picker" id="locationPicker" style="display:none;"></div>
    </div>

    <div class="field">
      <label>Bakery</label>
      <input id="f-name" type="text" placeholder="Lodge Bread Co.">
    </div>
    <div class="field">
      <label>Bakery link (optional)</label>
      <input id="f-website" type="text" placeholder="the-bakery.com">
    </div>
    <div class="row2">
      <div class="field">
        <label>Neighborhood</label>
        <input id="f-neighborhood" type="text" placeholder="Greenwich Village">
      </div>
      <div class="field">
        <label>City</label>
        <input id="f-place" type="text" placeholder="New York">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>State / Province</label>
        <input id="f-state" type="text" placeholder="NY">
      </div>
      <div class="field">
        <label>Country</label>
        <input id="f-country" type="text" placeholder="United States">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Date</label>
        <input id="f-date" type="date">
      </div>
      <div class="field">
        <label>Price</label>
        <select id="f-price">
          <option value="">—</option>
          <option>$</option>
          <option>$$</option>
          <option>$$$</option>
          <option>$$$$</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Rating</label>
      <div class="stars" id="f-stars">
        <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
      </div>
    </div>
    <div class="field">
      <label>Attachments (photos, receipts, menus)</label>
      <div id="attachmentsList"></div>
      <button type="button" id="addAttachmentBtn" class="ghost-inline">+ Add attachment</button>
      <input type="file" id="attachmentInput" accept="image/jpeg,application/pdf" multiple style="display:none;">
      <div class="field-hint">JPEG or PDF, up to 4MB each.</div>
    </div>
    <div class="field">
      <label>Breads had</label>
      <div id="breadsList"></div>
      <div class="add-row-choices">
        <button type="button" id="addBreadBtn" class="ghost-inline">+ Add bread</button>
        <button type="button" id="addBreadByUrlBtn" class="ghost-inline">+ Add by URL</button>
      </div>
    </div>
    <div class="field">
      <label>Pastries had</label>
      <div id="pastriesList"></div>
      <div class="add-row-choices">
        <button type="button" id="addPastryBtn" class="ghost-inline">+ Add pastry</button>
        <button type="button" id="addPastryByUrlBtn" class="ghost-inline">+ Add by URL</button>
      </div>
    </div>
    <div class="field">
      <label>Pies had</label>
      <div id="piesList"></div>
      <div class="add-row-choices">
        <button type="button" id="addPieBtn" class="ghost-inline">+ Add pie</button>

<script>
let entries = []; // each entry is a restaurant record: {id, name, website, neighborhood, place, state, country, tags, visits:[...]}
let editingId = null; // restaurant id being edited/added-to (null = brand new restaurant)
let editingVisitId = null; // null = appending a new visit to editingId's restaurant; set = editing that specific past visit in place
let currentStars = 0;
let currentLightboxId = null; // entry currently shown in the lightbox, for the copy-link button
let currentBreads = []; // {name, note, breadUrl} — working copy for the open form's bread rows
let currentPastrys = []; // {name, note, pastryUrl} — working copy for the open form's pastry rows
let currentPies = []; // {name, note, pieUrl} — working copy for the open form's pie rows

const $ = (id) => document.getElementById(id);

// Supabase-backed storage, shared with the rest of Warehouse, so entries
// sync across devices instead of being trapped in one browser. Falls back
// to localStorage if Supabase can't be reached, and to Claude's
// window.storage when running inside a Claude artifact.

// --- Auth: read is public, only a signed-in session can add/edit/delete.
// 2FA (TOTP) enrollment lives in Pantry (one-time setup), but the
// sign-in-time challenge check below applies here too, since it's the
// same underlying Supabase Auth account. ---
let currentUser = null;
let mfaSatisfied = true; // becomes false when a factor is enrolled but this session hasn't cleared the challenge yet

async function checkMfaStatus(){
  if(!currentUser || !supabaseClient){ mfaSatisfied = true; return; }
  const { data, error } = await supabaseClient.auth.mfa.getAuthenticatorAssuranceLevel();
  mfaSatisfied = error ? true : (data.currentLevel === data.nextLevel);
}

function renderAuthControl(){
  const el = document.getElementById('authControl');
  if(!supabaseClient){
    el.innerHTML = '';
    return;
  }
  if(currentUser && !mfaSatisfied){
    el.innerHTML = `
      <form id="mfaChallengeForm">
        <input type="text" id="mfaChallengeCode" placeholder="6-digit code" inputmode="numeric" maxlength="6" required autocomplete="one-time-code">
        <button type="submit">Verify</button>
      </form>
      <span class="auth-error" id="mfaChallengeError"></span>`;
    document.getElementById('mfaChallengeForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const code = document.getElementById('mfaChallengeCode').value.trim();
      const errEl = document.getElementById('mfaChallengeError');
      const { data: factors, error: listErr } = await supabaseClient.auth.mfa.listFactors();
      const factor = listErr ? null : (factors.totp || []).find(f => f.status === 'verified');
      if(!factor){ errEl.textContent = 'No 2FA factor found on this account.'; return; }
      const { error } = await supabaseClient.auth.mfa.challengeAndVerify({ factorId: factor.id, code });
      if(error){ errEl.textContent = 'Incorrect code — try again.'; return; }
      await checkMfaStatus();
      renderAuthControl();
      applyAuthGating();
    });
    return;
  }
  if(currentUser){
    el.innerHTML = `
      <span>${currentUser.email}</span>
      <button id="signOutBtn">Sign out</button>`;
    document.getElementById('signOutBtn').addEventListener('click', async ()=>{
      await supabaseClient.auth.signOut();
    });
  } else {
    el.innerHTML = `
      <form id="signInForm">
        <input type="email" id="authEmail" placeholder="Email" required>
        <input type="password" id="authPassword" placeholder="Password" required>
        <button type="submit">Sign in</button>
      </form>
      <span class="auth-error" id="authError"></span>`;
    document.getElementById('signInForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      document.getElementById('authError').textContent = error ? 'Sign in failed' : '';
    });
  }
}

function applyAuthGating(){
  const loggedIn = !supabaseClient || (!!currentUser && mfaSatisfied); // if no Supabase, don't block (local/artifact mode)
  const newBtn = document.getElementById('toggleForm');
  if(newBtn) newBtn.style.display = loggedIn ? '' : 'none';
  document.querySelectorAll('.entry-actions').forEach(el=>{
    el.style.display = loggedIn ? '' : 'none';
  });
}

if(supabaseClient){
  supabaseClient.auth.getSession().then(async ({data})=>{
    currentUser = data.session ? data.session.user : null;
    await checkMfaStatus();
    renderAuthControl();
    applyAuthGating();
  });
  supabaseClient.auth.onAuthStateChange(async (_event, session)=>{
    currentUser = session ? session.user : null;
    await checkMfaStatus();
    renderAuthControl();
    applyAuthGating();
  });
} else {
  renderAuthControl();
}

// Combines Neighborhood/City/State/Country into one display line, skipping
// any that are blank — "Greenwich Village, New York, New York, United
// States", or just "New York" if only City was ever filled in.
function placeLine(e){
  return [e.neighborhood, e.place, e.state, e.country].filter(Boolean).join(', ');
}

function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

function starsHtml(n){
  let s = '';
  for(let i=1;i<=5;i++) s += i<=n ? '★' : '☆';
  return s;
}

function render(){
  const wrap = $('entries');
  const rawQuery = ($('search').value || '').trim();
  const query = rawQuery.toLowerCase();

  // Search matches Restaurant name, Place, and Tags — typing a restaurant
  // name here is how you pull up "history of meals" at that place, since
  // entries are already sorted most-recent-first below.
  const filtered = query ? entries.filter(e => {
    const haystack = [e.name, e.neighborhood, e.place, e.state, e.country, ...(e.tags || [])].filter(Boolean).join(' ').toLowerCase();
    return haystack.includes(query);
  }) : entries;

  $('count').textContent = entries.length === 0
    ? 'no entries yet'
    : query
      ? `${filtered.length} of ${entries.length} match "${rawQuery}"`
      : entries.length + (entries.length === 1 ? ' entry logged' : ' entries logged');

  if(entries.length === 0){
    wrap.innerHTML = `<div class="empty"><span class="big">The list is empty.</span>Log the first bakery.</div>`;
    applyAuthGating();
    return;
  }

  if(query && filtered.length === 0){
    wrap.innerHTML = `<div class="empty"><span class="big">No matches.</span>Try a different search, or clear it to see everything.</div>`;
    applyAuthGating();
    return;
  }

  // Sort restaurants by their most recent visit, most recent first.
  const sorted = [...filtered].sort((a,b) => (latestVisit(b).date||'').localeCompare(latestVisit(a).date||''));

  wrap.innerHTML = sorted.map(r => {
    const v = latestVisit(r);
    const visitCount = (r.visits || []).length;
    return `
    <div class="entry" data-id="${r.id}">
      <div class="entry-actions">
        <button class="visitBtn">+ visit</button>
        <button class="editBtn">edit</button>
        <button class="delBtn">delete</button>
      </div>
      <div class="entry-top">
        <div>
          <div class="entry-name">${safeUrl(r.website) ? `<a href="${escapeHtml(safeUrl(r.website))}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${escapeHtml(r.name || 'Untitled')}</a>` : escapeHtml(r.name || 'Untitled')}</div>
          <div class="entry-meta">
            ${v.date ? `<span>${fmtDate(v.date)}</span>` : ''}
            ${placeLine(r) ? `<span>${escapeHtml(placeLine(r))}</span>` : ''}
            ${visitCount > 1 ? `<span>${visitCount} visits</span>` : ''}
          </div>
        </div>
        ${v.rating ? `<div class="entry-rating">${starsHtml(v.rating)}</div>` : ''}
      </div>
      ${renderBreadItemsHtml(v)}
      ${renderPastryItemsHtml(v)}
      ${renderPieItemsHtml(v)}
      ${renderAttachmentsHtml(v)}
      ${v.notes ? `<div class="entry-notes">${escapeHtml(stripPhotoTags(v.notes))}</div>` : ''}
      ${(v.photos && v.photos.length) ? `<div class="entry-thumbs">${v.photos.map(p=>`<img src="${photoUrl(p)}" alt="">`).join('')}</div>` : ''}
      ${(r.tags && r.tags.length) ? `<div class="entry-tags">${r.tags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
    </div>
  `;
  }).join('');

  wrap.querySelectorAll('.visitBtn').forEach(btn=>{
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = e.target.closest('.entry').dataset.id;
      openForNewVisit(id);
    });
  });
  wrap.querySelectorAll('.editBtn').forEach(btn=>{
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = e.target.closest('.entry').dataset.id;
      const r = entries.find(x=>x.id===id);
      if(r) openForEditVisit(id, latestVisit(r).id);
    });
  });
  wrap.querySelectorAll('.delBtn').forEach(btn=>{
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const id = e.target.closest('.entry').dataset.id;
      const r = entries.find(x=>x.id===id);
      const visitCount = r ? (r.visits||[]).length : 0;
      const msg = visitCount > 1 ? `Remove this bakery and all ${visitCount} visits?` : 'Remove this entry?';
      if(confirm(msg)){
        await deleteEntry(id);
      }
    });
  });
  wrap.querySelectorAll('.entry').forEach(card=>{
    card.addEventListener('click', e => {
      openLightbox(card.dataset.id);
    });
  });
  applyAuthGating();
}

function photoUrl(p){
  return (p && typeof p === 'object') ? p.url : p;
}

// Only allow http(s) URLs through as href values — guards against
// javascript: or other schemes sneaking into a pasted link field.
function safeUrl(u){
  if(!u) return null;
  const s = u.trim();
  if(/^https?:\/\//i.test(s)) return s;
  return null;
}

// For photo sources specifically: accepts either a real http(s) URL
// (pasted link) or a data: image URI (uploaded + resized locally) — kept
// separate from safeUrl() above, which stays link-field-only (http/https),
// since a data: URI has no business being used as a clickable <a href>
// for a cheese/wine/restaurant link, only as an <img src>.
function safePhotoSrc(u){
  if(!u) return null;
  const s = u.trim();
  if(/^https?:\/\//i.test(s)) return s;
  if(/^data:image\//i.test(s)) return s;
  return null;
}

// Dish rows are built via DOM APIs (createElement + .value), not innerHTML
// string interpolation — escapeHtml() below doesn't escape quote
// characters, which is fine for text nodes but unsafe inside a value="..."

// list_kv_names() RPC (name + key only — no photos, unlike a full cheese

async function refreshBreadOptions(){
  breadOptions = [];
  if(!supabaseClient) return; // no live Supabase (local/artifact mode) — dropdown stays empty, still usable
  try{

    breadOptions = (data || [])

async function createBreadFromUrl(url){

    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer sb_publishable_fmEJD4dXEZF0elMTqgfhIg_nH-dCQn_',

  const { error } = await supabaseClient
    .from('kv_store')
    .upsert({ key: 'bread:' + id, value: JSON.stringify(entry), updated_at: new Date().toISOString() });

  return { id, name: data.name };
}

function readFileAsDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// --- Attachments: a general-purpose upload for the entry itself (not
// tied to a specific dish/wine/etc.) — receipts, menus, or photos of the
// visit. Accepts JPEG (resized/compressed like every other photo in this
// app) and PDF (stored as-is, since it can't be resized — capped at 4MB
// raw to keep entries from ballooning; PDFs are usually larger than
// photos, so this is a looser cap than the 1.5MB used for og:image
// fetches elsewhere in the suite). ---
let currentAttachments = []; // {name, type: 'image'|'pdf', dataUrl}
const MAX_ATTACHMENT_BYTES = 4 * 1024 * 1024;

function renderAttachmentsList(){
  const wrap = $('attachmentsList');
  wrap.innerHTML = '';
  currentAttachments.forEach((a, i) => {
    const row = document.createElement('div');

// --- Autofill: asks the restaurant-autofill Edge Function to fetch a
// restaurant's own site or a listing page server-side and pull out
// best-guess fields. Deliberately narrow scope: Name, Place, Price, and
// Photo only — Notes and Tags stay untouched since those are personal
// (occasion, who-with, neighborhood-as-you-call-it) rather than something
// a webpage states. Only ever fills fields that are currently empty. ---
function setAutofillStatus(msg, cls){
  const el = $('autofillStatus');
  el.textContent = msg;
  el.className = 'field-hint' + (cls ? ' ' + cls : '');
}

// Accepts a bare domain ("bluehillfarm.com") as well as a full URL —
// prepends https:// if no scheme was typed, so the field doesn't demand
// people paste the "https://" prefix by hand.
function normalizeAutofillUrl(u){
  u = (u || '').trim();
  if(!u) return u;
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
  return u;
}

async function fetchAutofillData(url){
  const res = await fetch('https://psbdjeyianlhfkgwwsvt.supabase.co/functions/v1/bakery-autofill', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer sb_publishable_fmEJD4dXEZF0elMTqgfhIg_nH-dCQn_',
      'apikey': 'sb_publishable_fmEJD4dXEZF0elMTqgfhIg_nH-dCQn_'
    },
    body: JSON.stringify({ url })
  });
  const data = await res.json();
  if(!res.ok || !data.ok) throw new Error(data.error || `Could not fetch that page (HTTP ${res.status}).`);
  return data;
}

function applyAutofillData(data){
  const filled = [];
  const fillIfEmpty = (id, value) => {
    if(value && !$(id).value.trim()){
      $(id).value = value;
      filled.push(id);
    }
  };
  fillIfEmpty('f-name', data.name);
  fillIfEmpty('f-website', data.sourceUrl);
  fillIfEmpty('f-neighborhood', data.neighborhood);
  fillIfEmpty('f-place', data.city);
  fillIfEmpty('f-state', data.state);
  fillIfEmpty('f-country', data.country);
  if(data.price && !$('f-price').value){
    $('f-price').value = data.price;
    filled.push('f-price');
  }
  // Note: no photo field here, deliberately. This entry has no general
  // top-level photo upload (only per-dish/per-wine), and forcing an
  // autofilled restaurant photo into an unrelated dish slot would be a
  // confusing, arbitrary place to put it — so a fetched og:image is
  // simply not used, rather than force-fit somewhere it doesn't belong.

  if(filled.length){
    const fallbackNote = data.usedFallbackPage ? ' (City came from a linked page — the one you pasted didn\'t have it.)' : '';
    setAutofillStatus(`Filled ${filled.length} field${filled.length>1?'s':''} — double-check them, especially City and Price.${fallbackNote}`, 'ok');
  } else {
    setAutofillStatus('Fetched the page but found nothing new to fill in — the rest is already set or wasn\'t on the page.', 'ok');
  }
}

function hideLocationPicker(){
  $('locationPicker').style.display = 'none';
  $('locationPicker').innerHTML = '';
}

// If the site lists multiple distinct venues (a restaurant group — e.g.
// Blue Hill has both a Greenwich Village and a Stone Barns location),
// show them as options rather than silently guessing which one this
// entry means. Picking one re-fetches that specific page for sharper
// Place/Price; skipping just applies whatever the original page had.
function showLocationPicker(generalData, locations){
  const wrap = $('locationPicker');
  wrap.innerHTML = '';
  const label = document.createElement('span');
  label.className = 'lp-label';
  label.textContent = 'This site has more than one location — which one is this entry?';
  wrap.appendChild(label);

  locations.forEach(loc => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = loc.label;
    btn.addEventListener('click', async () => {
      hideLocationPicker();
      setAutofillStatus(`Fetching ${loc.label}…`);
      const autofillBtn = $('autofillBtn');
      autofillBtn.disabled = true;
      try{
        const specificData = await fetchAutofillData(loc.url);
        applyAutofillData(specificData);
      }catch(err){
        console.error('Could not fetch the selected location', err);
        // Fall back to the general page's data rather than leaving the
        // form untouched after the person made a choice.
        setAutofillStatus('Could not fetch that specific location — using the general page info instead.', 'err');
        applyAutofillData(generalData);
      }finally{
        autofillBtn.disabled = false;
      }
    });
    wrap.appendChild(btn);
  });

  const skipBtn = document.createElement('button');
  skipBtn.type = 'button';
  skipBtn.className = 'lp-skip';
  skipBtn.textContent = 'Not sure / use the general page info';
  skipBtn.addEventListener('click', () => {
    hideLocationPicker();
    applyAutofillData(generalData);
  });
  wrap.appendChild(skipBtn);

  wrap.style.display = 'block';
}

async function runAutofill(){
  const url = normalizeAutofillUrl($('f-autofillUrl').value);
  if(!url){
    setAutofillStatus('Paste a URL first.', 'err');
    return;
  }
  const btn = $('autofillBtn');
  btn.disabled = true;
  setAutofillStatus('Fetching…');
  hideLocationPicker();

  let data;
  try{
    data = await fetchAutofillData(url);
  }catch(err){
    console.error('Autofill fetch failed', err);
    setAutofillStatus(err.message || 'Autofill request failed — check the URL and try again.', 'err');
    btn.disabled = false;
    return;
  }

  try{
    if(data.locations && data.locations.length > 1){
      setAutofillStatus('Found multiple locations on this site.', 'ok');
      showLocationPicker(data, data.locations);
    } else {
      applyAutofillData(data);
    }
  }catch(err){
    console.error('Autofill fetched OK but applying it to the form failed', err);
    setAutofillStatus('Fetched the page, but hit a problem filling in the form — check the browser console for details.', 'err');
  }finally{
    btn.disabled = false;
  }
}
$('autofillBtn').addEventListener('click', runAutofill);
$('f-autofillUrl').addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    e.preventDefault();
    runAutofill();
  }
});

      name: created.name,
      note: '',
      pieUrl: location.origin + location.pathname.replace(/bakeries\.html$/, '') + 'pie.html#' + created.id
    });
    renderPiesList();
  }catch(err){
    console.error('Could not add pie from URL', err);
    alert(err.message || 'Could not fetch that page — make sure you\u2019re signed in and the link is correct.');
  }finally{
    btn.textContent = originalText;
    btn.disabled = false;
  }
});

function pieItemsOf(e){
  return (e.pieItems && e.pieItems.length) ? e.pieItems : [];
}

function renderPieItemsHtml(e){
  const items = pieItemsOf(e);
  if(!items.length) return '';
  return `<div class="dish-list">${items.map(c => {
    const linkHref = safeUrl(c.pieUrl);
    return `<div class="dish-item">
      <span class="dish-item-name">${escapeHtml(c.name)}</span>${c.note ? ` <span class="dish-item-note">— ${escapeHtml(c.note)}</span>` : ''}${linkHref ? ` <a class="dish-cheese-link" href="${escapeHtml(linkHref)}" target="_blank" rel="noopener" title="Linked pie">🥧</a>` : ''}
    </div>`;
  }).join('')}</div>`;
}

function renderAttachmentsHtml(e){
  const items = (e.attachments && e.attachments.length) ? e.attachments : [];
  if(!items.length) return '';
  return `<div class="dish-list">${items.map(a => {
    const isPdf = a.type === 'pdf';
    const href = (a.dataUrl || '').startsWith('data:') ? a.dataUrl : safeUrl(a.dataUrl);
    if(!href) return '';
    const thumb = isPdf
      ? `<span style="display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;font-size:9px;font-weight:bold;background:var(--paper-dark);border:1px solid var(--line);border-radius:2px;vertical-align:middle;">PDF</span>`
      : `<img class="dish-photo-thumb" src="${escapeHtml(href)}" alt="">`;
    return `<div class="dish-item">
      <a href="${escapeHtml(href)}" target="_blank" rel="noopener" title="${escapeHtml(a.name || '')}" style="text-decoration:none;">${thumb} <span class="dish-item-name">${escapeHtml(a.name || (isPdf ? 'document.pdf' : 'photo.jpg'))}</span></a>
    </div>`;
  }).join('')}</div>`;
}

// Resolves an entry's dishes for display, whether it has the new
// structured dishItems array or only the old flat comma-separated
// `dishes` string (kept, never migrated in the database, so nothing
// existing is lost or silently rewritten).
function stripPhotoTags(notes){
  return notes.replace(/\(photo:\s*[^)]+\)\s*/gi, '');
}

function renderNotesWithPhotos(e){
  if(!e.notes) return { html: '', leftoverPhotos: (e.photos || []) };

  const photos = e.photos || [];
  const used = new Set();
  const photoTagRe = /^\(photo:\s*([^)]+)\)\s*/i;

  const paragraphs = e.notes.split(/\n\n+/);

  const html = paragraphs.map(para => {
    const m = para.match(photoTagRe);
    let imgHtml = '';
    let text = para;

    if(m){
      text = para.slice(m[0].length);
      const wanted = m[1].trim().toLowerCase();
      let matchIdx = -1;
      photos.forEach((p, i) => {
        if(matchIdx !== -1 || used.has(i)) return;
        const cap = (p && typeof p === 'object' && p.caption) ? p.caption.toLowerCase() : '';
        if(cap && (cap.includes(wanted) || wanted.includes(cap))) matchIdx = i;
      });
      if(matchIdx !== -1){
        used.add(matchIdx);
        imgHtml = `<img class="note-photo" src="${photoUrl(photos[matchIdx])}" alt="">`;
      }
    }

    const textHtml = text.trim() ? `<p>${escapeHtml(text.trim())}</p>` : '';
    return `<div class="note-block">${imgHtml}${textHtml}</div>`;
  }).join('');

  const leftoverPhotos = photos.filter((_, i) => !used.has(i));
  return { html, leftoverPhotos };
}

// Builds the markup for a single visit within the lightbox: its own
// date/price/rating header (with edit/delete just for that visit), then
// the same dish/wine/cheese/spirit/charcuterie/attachment/notes sections
// the single-visit view always had — those renderers just read whatever
// object they're handed, so passing a visit instead of a whole entry
// works unchanged.
function renderVisitBlockHtml(restaurantId, visit){
  const metaBits = [];
  if(visit.date) metaBits.push(fmtDate(visit.date));
  if(visit.price) metaBits.push(visit.price);
  const { html: notesHtml, leftoverPhotos } = renderNotesWithPhotos(visit);
  const breadsHtml = renderBreadItemsHtml(visit);
  const pastriesHtml = renderPastryItemsHtml(visit);
  const piesHtml = renderPieItemsHtml(visit);
  const attachmentsHtml = renderAttachmentsHtml(visit);
  return `
    <div class="lightbox-notes visit-block" data-visit-id="${escapeHtml(visit.id)}">
      <div class="entry-top" style="margin-bottom:6px;">
        <span class="lbl" style="margin:0;">${metaBits.map(escapeHtml).join(' · ') || 'Visit'}</span>
        ${visit.rating ? `<div class="entry-rating">${starsHtml(visit.rating)}</div>` : ''}
      </div>
      ${breadsHtml ? `<div><span class="lbl">Breads</span>${breadsHtml}</div>` : ''}
      ${pastriesHtml ? `<div><span class="lbl">Pastries</span>${pastriesHtml}</div>` : ''}
      ${piesHtml ? `<div><span class="lbl">Pies</span>${piesHtml}</div>` : ''}
      ${attachmentsHtml ? `<div><span class="lbl">Attachments</span>${attachmentsHtml}</div>` : ''}
      ${notesHtml ? `<div><span class="lbl">Notes</span>${notesHtml}</div>` : ''}
      ${(leftoverPhotos && leftoverPhotos.length) ? `<div class="lightbox-photos" style="display:grid;">${leftoverPhotos.map(p=>`<img src="${photoUrl(p)}" alt="">`).join('')}</div>` : ''}
      <div class="entry-actions" style="position:static;display:flex;gap:8px;margin-top:6px;">
        <button type="button" class="visitEditBtn">edit visit</button>
        <button type="button" class="visitDelBtn">delete visit</button>
      </div>
    </div>`;
}

function openLightbox(id){
  const r = entries.find(x => x.id === id);
  if(!r) return;
  currentLightboxId = id;

  const websiteHref = safeUrl(r.website);
  if(websiteHref){
    $('lb-name').innerHTML = `<a href="${escapeHtml(websiteHref)}" target="_blank" rel="noopener">${escapeHtml(r.name || 'Untitled')}</a>`;
  } else {
    $('lb-name').textContent = r.name || 'Untitled';
  }

  const visits = [...(r.visits || [])].sort((a,b) => (b.date||'').localeCompare(a.date||''));
  const metaBits = [];
  if(placeLine(r)) metaBits.push(placeLine(r));
  metaBits.push(visits.length + (visits.length === 1 ? ' visit' : ' visits'));
  $('lb-meta').innerHTML = metaBits.map(m => `<span>${escapeHtml(m)}</span>`).join('');

  $('lb-tags').innerHTML = (r.tags && r.tags.length)
    ? r.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')
    : '';

  $('lb-visits').innerHTML = visits.map(v => renderVisitBlockHtml(r.id, v)).join('');

  $('lightbox').querySelectorAll('.note-photo, .lightbox-photos img').forEach(img=>{
    img.addEventListener('click', ev => {
      ev.stopPropagation();
      openPhotoZoom(img.src);
    });
  });

  $('lb-visits').querySelectorAll('.visitEditBtn').forEach(btn=>{
    btn.addEventListener('click', ev => {
      ev.stopPropagation();
      const visitId = btn.closest('.visit-block').dataset.visitId;
      closeLightbox();
      openForEditVisit(r.id, visitId);
    });
  });
  $('lb-visits').querySelectorAll('.visitDelBtn').forEach(btn=>{
    btn.addEventListener('click', async ev => {
      ev.stopPropagation();
      const visitId = btn.closest('.visit-block').dataset.visitId;
      const restaurant = entries.find(x=>x.id===r.id);
      const only = restaurant && (restaurant.visits||[]).length <= 1;
      const msg = only ? 'This is the only visit — deleting it removes the whole bakery entry. Continue?' : 'Remove this visit?';
      if(confirm(msg)){
        await deleteVisit(r.id, visitId);
      }
    });
  });

  $('lightbox').classList.add('open');
}

function closeLightbox(){
  $('lightbox').classList.remove('open');
  currentLightboxId = null;
}

$('lightboxCopyLink').addEventListener('click', async e => {
  e.stopPropagation();
  if(!currentLightboxId) return;
  const url = location.origin + location.pathname + '#' + currentLightboxId;
  const btn = $('lightboxCopyLink');
  try{
    await navigator.clipboard.writeText(url);
    btn.textContent = '✓ copied';
  }catch(err){
    // Clipboard API can be blocked (permissions, non-HTTPS, older Safari) —
    // fall back to showing the URL so it can be copied by hand.
    prompt('Copy this link:', url);
  }
  setTimeout(()=>{ btn.textContent = '🔗 copy link'; }, 1500);
});

// Deep link: if the page was opened with #<entryId> (e.g. pasted from
// another Warehouse app's "link to this restaurant visit" field), open
// that entry's lightbox automatically once entries have loaded.
function openFromHash(){
  const id = location.hash.replace(/^#/, '');
  if(id && entries.some(e => e.id === id)){
    openLightbox(id);
    document.querySelector(`.entry[data-id="${id}"]`)?.scrollIntoView({behavior:'smooth', block:'center'});
  }
}

function openPhotoZoom(src){
  $('photoZoomImg').src = src;
  $('photoZoom').classList.add('open');
}

function closePhotoZoom(){
  $('photoZoom').classList.remove('open');
  $('photoZoomImg').src = '';
}

$('lightboxClose').addEventListener('click', e => {
  e.stopPropagation();
  closeLightbox();
});
$('lightbox').addEventListener('click', e => {
  if(e.target.id === 'lightbox') closeLightbox();
});
$('photoZoom').addEventListener('click', closePhotoZoom);
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    closePhotoZoom();
    closeLightbox();
  }
});

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function resetForm(){
  $('f-autofillUrl').value='';
  setAutofillStatus('Pulls whatever it can find — works best on a bakery\'s own site; review everything before saving.');
  hideLocationPicker();
  $('f-name').value='';
  $('f-website').value='';
  $('f-neighborhood').value='';
  $('f-place').value='';
  $('f-state').value='';
  $('f-country').value='';
  $('f-date').value=new Date().toISOString().slice(0,10);
  $('f-price').value='';
  currentBreads = [];
  renderBreadsList();
  currentPastrys = [];
  renderPastrysList();
  currentPies = [];
  renderPiesList();
  currentAttachments = [];
  renderAttachmentsList();
  // Bread/Pastry/Pie options are fetched async so opening the form never
  // waits on a network round trip; re-render in place once they land. Reads
  // whatever was typed in the meantime first, so a fast typer doesn't lose
  // input.
  refreshBreadOptions().then(() => { readBreadsFromDom(); renderBreadsList(); });
  refreshPastryOptions().then(() => { readPastrysFromDom(); renderPastrysList(); });
  refreshPieOptions().then(() => { readPiesFromDom(); renderPiesList(); });
  $('f-notes').value='';
  $('f-tags').value='';
  setStars(0);
  editingId = null;
  editingVisitId = null;
  $('saveBtn').textContent = 'Save Entry';
}

// Fills just the bakery-level fields (name/website/location/tags) from
// an existing bakery record — shared by both "add a visit" and
// "edit a past visit", since both keep those fields editable alongside
// whichever visit is being worked on.
function fillRestaurantFields(r){
  $('f-name').value = r.name || '';
  $('f-website').value = r.website || '';
  $('f-neighborhood').value = r.neighborhood || '';
  $('f-place').value = r.place || '';
  $('f-state').value = r.state || '';
  $('f-country').value = r.country || '';
  $('f-tags').value = (r.tags||[]).join(', ');
}

// Fills the visit-level fields (date/price/rating/dishes/wines/.../notes)
// from a given visit object — everything that's unique to one meal there,
// as opposed to the restaurant itself.
function fillVisitFields(v){
  $('f-date').value = v.date || '';
  $('f-price').value = v.price || '';
  currentBreads = (v.breadItems && v.breadItems.length) ? v.breadItems.map(b => ({...b})) : [];
  renderBreadsList();
  refreshBreadOptions().then(() => { readBreadsFromDom(); renderBreadsList(); });
  currentPastrys = (v.pastryItems && v.pastryItems.length) ? v.pastryItems.map(p => ({...p})) : [];
  renderPastrysList();
  refreshPastryOptions().then(() => { readPastrysFromDom(); renderPastrysList(); });
  currentPies = (v.pieItems && v.pieItems.length) ? v.pieItems.map(p => ({...p})) : [];
  renderPiesList();
  refreshPieOptions().then(() => { readPiesFromDom(); renderPiesList(); });
  currentAttachments = (v.attachments && v.attachments.length) ? v.attachments.map(a => ({...a})) : [];
  renderAttachmentsList();
  $('f-notes').value = v.notes || '';
  setStars(v.rating || 0);
}

function openTicket(){
  $('ticket').classList.add('open');
  $('ticket').scrollIntoView({behavior:'smooth', block:'start'});
}

// "+ Visit" on a restaurant card: keeps that restaurant's info, starts a
// blank visit dated today, appends as a new visit on save.
function openForNewVisit(restaurantId){
  const r = entries.find(x=>x.id===restaurantId);
  if(!r) return;
  resetForm();
  editingId = restaurantId;
  editingVisitId = null;
  fillRestaurantFields(r);
  $('f-date').value = new Date().toISOString().slice(0,10);
  $('saveBtn').textContent = 'Save Visit';
  openTicket();
}

// Editing one specific past visit (or, from the card's own "edit" button,
// the most recent one) — updates that visit in place on save.
function openForEditVisit(restaurantId, visitId){
  const r = entries.find(x=>x.id===restaurantId);
  if(!r) return;
  const v = (r.visits||[]).find(x=>x.id===visitId);
  if(!v) return;
  editingId = restaurantId;
  editingVisitId = visitId;
  fillRestaurantFields(r);
  fillVisitFields(v);
  $('saveBtn').textContent = 'Update Visit';
  openTicket();
}

function setStars(n){
  currentStars = n;
  document.querySelectorAll('#f-stars span').forEach(s=>{
    s.classList.toggle('on', parseInt(s.dataset.v) <= n);
  });
}

// One-time shape migration: entries used to be one row per visit (date,
// dishItems, wineItems, ... all top-level alongside name/website/etc).
// Now each row is one restaurant with a `visits` array holding those same
// per-visit fields, so repeat visits live under one record instead of
// spawning a duplicate restaurant card each time. Any entry loaded without
// a `visits` array gets wrapped into one on the fly and written straight
// back to storage — happens once per legacy entry, then never again.
const VISIT_FIELD_KEYS = ['date','price','rating','breadItems','pastryItems','pieItems','attachments','notes','photos'];

function migrateEntryToVisits(raw){
  if(raw && raw.visits) return { entry: raw, migrated: false };
  const visit = { id: 'v' + Date.now() + Math.random().toString(36).slice(2,7) };
  VISIT_FIELD_KEYS.forEach(k => { if(raw[k] !== undefined) visit[k] = raw[k]; });
  const restaurant = { ...raw };
  VISIT_FIELD_KEYS.forEach(k => { delete restaurant[k]; });
  restaurant.visits = [visit];
  return { entry: restaurant, migrated: true };
}

async function loadEntries(){
  try{
    // Scoped to 'bakery:bk' — Bakery entry ids always start with 'bk' (see
    // saveEntry's id generation below). Bread/Pastry/Pie entries live under
    // their own 'bread:'/'pastry:'/'pie:' prefixes in the same shared
    // kv_store table, so this stays specific rather than using a bare
    // 'bakery:' prefix, mirroring the same lesson learned in restaurants.html.
    let loaded = [];
    if(storage.listWithValues){
      // Fast path: one request for everything.
      const result = await storage.listWithValues('bakery:bk');
      loaded = (result.items || [])
        .map(it => { try{ return JSON.parse(it.value); }catch(e){ return null; } })
        .filter(Boolean);
    } else {
      // Fallback for storage backends without a batch method (Claude
      // artifact storage, plain localStorage) — one request per entry.
      const result = await storage.list('bakery:bk');
      if(result && result.keys && result.keys.length){
        for(const key of result.keys){
          try{
            const r = await storage.get(key);
            if(r && r.value) loaded.push(JSON.parse(r.value));
          }catch(err){ /* skip missing */ }
        }
      }
    }

    const migratedEntries = [];
    for(const raw of loaded){
      const { entry, migrated } = migrateEntryToVisits(raw);
      migratedEntries.push(entry);
      if(migrated){
        try{ await storage.set('bakery:' + entry.id, JSON.stringify(entry)); }
        catch(err){ console.error('Could not persist visit-shape migration for', entry.id, err); }
      }
    }
    entries = migratedEntries;
  }catch(err){
    entries = [];
  }
  render();
}

function latestVisit(r){
  if(!r.visits || !r.visits.length) return {};
  return [...r.visits].sort((a,b) => (b.date||'').localeCompare(a.date||''))[0];
}

// Keeps a Bread/Pastry/Pie item's own record in sync with the Bakery it's
// linked to. This matters most for a brand-new bakery: createNewBread/
// createNewPastry/createNewPie can only write the back-link when editingId
// already exists (see those functions above) — a bakery that hasn't been
// saved yet has no stable id to link to. Calling this after every save
// closes that gap by revisiting each linked item and writing the
// now-final bakery id/name onto it. Idempotent and safe to run on every
// save (not just new bakeries): it fetches the item's current record and
// only touches the bakery/bakeryUrl fields, so photos/producer/type/etc.
// set later in bread.html/pastry.html/pie.html are never clobbered.
async function syncItemBakeryBacklink(prefix, itemUrl, bakeryName, bakeryId){
  if(!supabaseClient || !itemUrl) return;
  const linkedId = itemUrl.split('#')[1];
  if(!linkedId) return;
  const key = prefix + linkedId;
  const bakeryUrl = location.origin + location.pathname.replace(/bakeries\.html$/, '') + 'bakeries.html#' + bakeryId;
  try{
    const { data, error } = await supabaseClient.from('kv_store').select('value').eq('key', key).maybeSingle();
    if(error || !data) return;
    const record = JSON.parse(data.value);
    if(record.bakery === bakeryName && record.bakeryUrl === bakeryUrl) return; // already in sync
    record.bakery = bakeryName;
    record.bakeryUrl = bakeryUrl;
    await supabaseClient.from('kv_store').upsert({ key, value: JSON.stringify(record), updated_at: new Date().toISOString() });
  }catch(err){
    console.error('Could not sync bakery back-link for', key, err);
  }
}

async function saveEntry(){
  const name = $('f-name').value.trim();
  if(!name){
    $('f-name').focus();
    return;
  }
  const id = editingId || ('bk' + Date.now() + Math.random().toString(36).slice(2,7));
  const tags = $('f-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  readBreadsFromDom();
  const breadItems = currentBreads.filter(b => b.breadUrl);
  readPastrysFromDom();
  const pastryItems = currentPastrys.filter(p => p.pastryUrl);
  readPiesFromDom();
  const pieItems = currentPies.filter(p => p.pieUrl);

  const visitId = editingVisitId || ('v' + Date.now() + Math.random().toString(36).slice(2,7));
  const visit = {
    id: visitId,
    date: $('f-date').value,
    price: $('f-price').value,
    rating: currentStars,
    breadItems,
    pastryItems,
    pieItems,
    attachments: currentAttachments,
    notes: $('f-notes').value.trim()
  };

  const existing = entries.find(x=>x.id===id);
  const restaurant = existing ? {...existing} : { id, visits: [] };
  restaurant.name = name;
  restaurant.website = normalizeAutofillUrl($('f-website').value);
  restaurant.neighborhood = $('f-neighborhood').value.trim();
  restaurant.place = $('f-place').value.trim();
  restaurant.state = $('f-state').value.trim();
  restaurant.country = $('f-country').value.trim();
  restaurant.tags = tags;
  restaurant.visits = existing ? [...existing.visits] : [];
  if(editingVisitId){
    const vIdx = restaurant.visits.findIndex(v=>v.id===editingVisitId);
    if(vIdx>-1) restaurant.visits[vIdx] = visit; else restaurant.visits.push(visit);
  } else {
    restaurant.visits.push(visit);
  }

  try{
    await storage.set('bakery:' + id, JSON.stringify(restaurant));
    const idx = entries.findIndex(e=>e.id===id);
    if(idx>-1) entries[idx] = restaurant; else entries.push(restaurant);
    render();
    closeForm();
    // Fire-and-forget: now that this bakery has a final id, make sure every
    // linked Bread/Pastry/Pie item actually points back to it. Doesn't
    // block the UI — the form is already closed by this point.
    await Promise.all([
      ...breadItems.map(item => syncItemBakeryBacklink('bread:', item.breadUrl, name, id)),
      ...pastryItems.map(item => syncItemBakeryBacklink('pastry:', item.pastryUrl, name, id)),
      ...pieItems.map(item => syncItemBakeryBacklink('pie:', item.pieUrl, name, id)),
    ]);
  }catch(err){
    alert('Could not save entry. Please try again.');
    console.error(err);
  }
}

// Removes the whole restaurant record (all of its visits).
async function deleteEntry(id){
  try{
    await storage.delete('bakery:' + id);
    entries = entries.filter(e=>e.id!==id);
    render();
  }catch(err){
    alert('Could not delete entry. Please try again.');
    console.error(err);
  }
}

// Removes one visit from a restaurant's history. If it's the last visit,
// this removes the whole restaurant record instead (nothing meaningful is
// left to keep), and the lightbox is closed since there's nothing to show.
async function deleteVisit(restaurantId, visitId){
  const r = entries.find(x=>x.id===restaurantId);
  if(!r) return;
  const remaining = (r.visits||[]).filter(v=>v.id!==visitId);
  if(remaining.length === 0){
    closeLightbox();
    await deleteEntry(restaurantId);
    return;
  }
  const updated = {...r, visits: remaining};
  try{
    await storage.set('bakery:' + restaurantId, JSON.stringify(updated));
    const idx = entries.findIndex(e=>e.id===restaurantId);
    if(idx>-1) entries[idx] = updated;
    render();
    if($('lightbox').classList.contains('open') && currentLightboxId === restaurantId){
      openLightbox(restaurantId);
    }
  }catch(err){
    alert('Could not delete visit. Please try again.');
    console.error(err);
  }
}

function closeForm(){
  $('ticket').classList.remove('open');
  resetForm();
}

$('toggleForm').addEventListener('click', () => {
  const t = $('ticket');
  if(t.classList.contains('open')){
    closeForm();
  } else {
    resetForm();
    t.classList.add('open');
    t.scrollIntoView({behavior:'smooth', block:'start'});
    $('f-name').focus();
  }
});
$('cancelBtn').addEventListener('click', closeForm);
$('saveBtn').addEventListener('click', saveEntry);
document.querySelectorAll('#f-stars span').forEach(s=>{
  s.addEventListener('click', () => setStars(parseInt(s.dataset.v)));
});

$('search').addEventListener('input', render);

loadEntries().then(openFromHash);
</script>
